<!DOCTYPE html>
<html lang="fr">
<head>

                    <div class="flex items-center gap-8">
                        <a href="#" class="text-[10px] font-black text-slate-400 hover:text-white transition-colors uppercase tracking-[0.2em] italic">Statistiques</a>
                        <a href="#" class="text-[10px] font-black text-slate-400 hover:text-white transition-colors uppercase tracking-[0.2em] italic">Logs Système</a>
