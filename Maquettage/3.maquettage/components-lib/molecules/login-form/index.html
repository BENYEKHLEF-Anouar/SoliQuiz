<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molecule: Login Form - SoliQuiz UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        primary: {
                            50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd',
                            300: '#7dd3fc', 400: '#38bdf8', 500: '#17B0CF',
                            600: '#0ea5e9', 700: '#0284c7', 800: '#0369a1', 900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="bg-slate-50 p-10 font-sans flex justify-center items-center min-h-screen">
    <div class="max-w-4xl mx-auto space-y-10 w-full">
        <div class="border-b border-slate-200 pb-4">
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.3em] mb-2">Molecule</p>
            <h1 class="text-3xl font-black text-slate-900">Login Form</h1>
            <p class="text-slate-500 mt-2">Formulaire de connexion</p>
        </div>

        <section class="space-y-4">
            <div class="flex justify-center">
                <!-- Login Form -->
                <div class="mt-7 bg-white border border-slate-200 rounded-2xl shadow-sm w-full max-w-md p-4 sm:p-7">
                    <div class="text-center mb-8">
                        <div class="inline-flex items-center gap-2 mb-4 group justify-center">
                            <div class="size-10 bg-[#17B0CF] rounded-xl flex items-center justify-center shadow-lg shadow-[#17B0CF]/20 transition-transform group-hover:rotate-6">
                                <svg class="text-white size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                                    <polyline points="14 2 14 8 20 8" />
                                    <path d="m9 15 2 2 4-4" />
                                </svg>
                            </div>
                            <span class="text-2xl font-bold text-slate-900 tracking-tight">Soli<span class="text-[#17B0CF]">Quiz</span></span>
                        </div>
                        <h1 class="block text-2xl font-bold text-slate-900">Bienvenue</h1>
                        <p class="mt-2 text-sm text-slate-500">Connectez-vous pour accéder à votre espace.</p>
                    </div>

                    <form>
                        <div class="grid gap-y-4">
                            <!-- Email -->
                            <div>
                                <label for="email" class="block text-sm mb-2 text-slate-800 font-bold">Adresse Email</label>
                                <div class="relative">
                                    <input type="email" id="email" placeholder="vous@exemple.com" class="py-3 px-4 block w-full border border-slate-200 rounded-xl text-sm shadow-sm focus:border-[#17B0CF] focus:ring-4 focus:ring-[#17B0CF]/10 outline-none transition-all" required>
                                </div>
                            </div>

                            <!-- Password -->
                            <div>
                                <div class="flex justify-between items-center mb-2">
                                    <label for="password" class="block text-sm text-slate-800 font-bold">Mot de passe</label>
                                    <a class="text-xs text-[#17B0CF] hover:underline font-bold" href="#">Mot de passe oublié?</a>
                                </div>
                                <div class="relative">
                                    <input type="password" id="password" class="py-3 px-4 block w-full border border-slate-200 rounded-xl text-sm shadow-sm focus:border-[#17B0CF] focus:ring-4 focus:ring-[#17B0CF]/10 outline-none transition-all" required>
                                </div>
                            </div>

                            <!-- Submit -->
                            <button type="submit" class="w-full py-3 px-4 inline-flex justify-center items-center gap-x-2 text-sm font-bold rounded-xl border border-transparent bg-[#17B0CF] text-white hover:bg-[#14a0bd] mt-4 transition-colors shadow-lg shadow-[#17B0CF]/20">
                                Se connecter
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
