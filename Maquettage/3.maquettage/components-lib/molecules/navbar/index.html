<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molecule: Navbar - SoliQuiz UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 p-10 font-sans">
    <div class="max-w-6xl mx-auto space-y-10">
        <div class="border-b border-slate-200 pb-4">
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.3em] mb-2">Molecule</p>
            <h1 class="text-3xl font-black text-slate-900">Navbar</h1>
            <p class="text-slate-500 mt-2">Barres de navigation pour différents rôles</p>
        </div>

        <section class="space-y-4">
            <h2 class="text-lg font-bold text-slate-900">Public Navbar (Landing)</h2>
            <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden">
                <header class="px-6 h-20 flex justify-between items-center">
                    <a href="#" class="flex items-center gap-3 group">
                        <div class="size-11 bg-[#17B0CF] rounded-xl flex items-center justify-center shadow-lg shadow-[#17B0CF]/20 transition-transform group-hover:scale-110">
                            <svg class="text-white size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                                <polyline points="14 2 14 8 20 8" />
                                <path d="m9 15 2 2 4-4" />
                            </svg>
                        </div>
                        <div class="flex flex-col">
                            <span class="text-2xl font-black tracking-tight text-slate-900 leading-none">Soli<span class="text-[#17B0CF]">Quiz</span></span>
                            <span class="text-[9px] font-black text-slate-400 uppercase tracking-[0.2em] mt-1 italic">Plateforme d'Évaluation</span>
                        </div>
                    </a>
                    <nav class="hidden md:flex items-center gap-10">
                        <a href="#" class="text-[11px] font-bold text-slate-500 hover:text-[#17B0CF] transition-colors uppercase tracking-widest">Fonctionnalités</a>
                        <a href="#" class="text-[11px] font-bold text-slate-500 hover:text-[#17B0CF] transition-colors uppercase tracking-widest">Utilisation</a>
                        <button class="px-6 py-2.5 bg-[#17B0CF] text-white text-[11px] font-black uppercase tracking-widest rounded-xl hover:bg-[#0284c7] transition-all shadow-lg shadow-[#17B0CF]/20">
                            Se connecter
                        </button>
                    </nav>
                </header>
            </div>
        </section>

        <section class="space-y-4">
            <h2 class="text-lg font-bold text-slate-900">Mobile Header</h2>
            <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden">
                <div class="px-6 h-16 flex justify-between items-center shadow-sm">
                    <div class="flex items-center gap-2">
                        <div class="size-8 bg-[#17B0CF] rounded-lg flex items-center justify-center shadow-lg shadow-[#17B0CF]/20">
                            <svg class="text-white size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                                <polyline points="14 2 14 8 20 8" />
                                <path d="m9 15 2 2 4-4" />
                            </svg>
                        </div>
                        <span class="font-black text-lg text-slate-900">Soli<span class="text-[#17B0CF]">Quiz</span></span>
                    </div>
                    <button class="p-2 rounded-xl bg-slate-100 hover:bg-slate-200 transition-colors">
                        <svg class="size-6 text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path d="M4 6h16M4 12h16m-7 6h7" />
                        </svg>
                    </button>
                </div>
            </div>
        </section>

        <section class="space-y-4">
            <h2 class="text-lg font-bold text-slate-900">Authenticated Header (Compact)</h2>
            <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden">
                <div class="px-6 h-16 flex justify-between items-center border-b border-slate-100">
                    <div class="flex items-center gap-4">
                        <div class="size-8 bg-[#17B0CF] rounded-lg flex items-center justify-center shadow-lg shadow-[#17B0CF]/20">
                            <svg class="text-white size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                                <polyline points="14 2 14 8 20 8" />
                                <path d="m9 15 2 2 4-4" />
                            </svg>
                        </div>
                        <nav class="hidden md:flex items-center gap-6">
                            <a href="#" class="text-xs font-bold text-slate-900">Dashboard</a>
                            <a href="#" class="text-xs font-bold text-slate-500 hover:text-[#17B0CF] transition-colors">Bibliothèque</a>
                            <a href="#" class="text-xs font-bold text-slate-500 hover:text-[#17B0CF] transition-colors">Résultats</a>
                        </nav>
                    </div>
                    <div class="flex items-center gap-3">
                        <button class="p-2 rounded-xl bg-slate-100 hover:bg-slate-200 transition-colors relative">
                            <svg class="size-5 text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
                            </svg>
                            <span class="absolute top-1 right-1 size-2 bg-rose-500 rounded-full"></span>
                        </button>
                        <img class="size-9 rounded-xl shadow-sm border border-white" src="https://ui-avatars.com/api/?name=User&background=17B0CF&color=fff&bold=true" alt="">
                    </div>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
