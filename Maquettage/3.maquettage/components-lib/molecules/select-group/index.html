<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Molécule: Select Group</title>
    <link rel="stylesheet" href="../../../charte-graphique/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 p-10 max-w-sm mx-auto">

    <!-- Molecule : Select Group -->
    <!-- Atoms : label, select -->
    <!-- Contexte : Formulaires de configuration -->

    <div class="flex flex-col gap-2">
        <!-- Atom: Label -->
        <label for="demo-select-group" class="text-sm font-semibold text-slate-700">Choisir une thématique</label>

        <select data-hs-select='{
            "placeholder": "Sélectionner une thématique...",
            "toggleTag": "<button type=\"button\" aria-expanded=\"false\"></button>",
            "toggleClasses": "hs-select-disabled:pointer-events-none hs-select-disabled:opacity-50 relative py-3 px-4 flex text-nowrap w-full cursor-pointer bg-white border border-slate-200 text-slate-800 rounded-xl text-start text-sm hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-primary-500 shadow-sm transition-all",
            "dropdownClasses": "mt-2 z-50 w-full max-h-72 p-1 space-y-0.5 bg-white border border-slate-100 rounded-xl shadow-2xl overflow-hidden overflow-y-auto",
            "optionClasses": "hs-selected:bg-primary-50 hs-selected:text-primary-600 py-2.5 px-4 w-full text-sm text-slate-600 cursor-pointer hover:bg-slate-50 rounded-xl focus:outline-none focus:bg-slate-50 font-medium transition-colors",
            "optionTemplate": "<div class=\"flex justify-between items-center w-full\"><span data-title></span><span class=\"hidden hs-selected:block\"><svg class=\"shrink-0 size-3.5 text-primary-500\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"/></svg></span></div>",
            "extraMarkup": "<div class=\"absolute top-1/2 end-4 -translate-y-1/2\"><svg class=\"shrink-0 size-4 text-slate-400 group-hover:text-primary-500 transition-colors\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m7 15 5 5 5-5\"/><path d=\"m7 9 5-5 5 5\"/></svg></div>"
          }' class="hidden">
            <option value="">Sélectionner...</option>
            <option>Frontend Development</option>
            <option>Backend PHP</option>
            <option>Gestion de base de données</option>
        </select>

        <p class="text-[11px] text-slate-400 italic">L'objectif pédagogique sera lié à ce choix.</p>
    </div>

    <!-- Scripts Preline -->
    <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.js"></script>

</body>

</html>
