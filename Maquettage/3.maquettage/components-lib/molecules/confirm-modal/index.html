<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Modal - Molécules</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        heading: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: 'hsl(190, 85%, 96%)',
                            100: 'hsl(190, 85%, 90%)',
                            200: 'hsl(190, 85%, 80%)',
                            300: 'hsl(190, 80%, 70%)',
                            400: 'hsl(190, 75%, 60%)',
                            500: 'hsl(190, 80%, 45%)',
                            600: 'hsl(190, 85%, 35%)',
                            700: 'hsl(190, 85%, 28%)',
                            800: 'hsl(190, 80%, 22%)',
                            900: 'hsl(190, 75%, 15%)',
                        }
                    },
                    boxShadow: {
                        'premium': '0 20px 50px -12px rgba(0, 0, 0, 0.08)',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../../charte-graphique/app.css">
</head>
<body class="bg-slate-50 font-sans p-10 space-y-6">
    <div>
        <span class="text-xs font-black text-slate-400 uppercase">Molécules</span>
        <h1 class="text-2xl font-black text-slate-900">Confirm Modal</h1>
    </div>
    <div class="max-w-md">
        <div class="bg-white border border-slate-100 rounded-[2.5rem] shadow-premium overflow-hidden">
            <div class="p-10 text-center">
                <div class="size-20 bg-rose-50 rounded-[2rem] flex items-center justify-center mb-8 mx-auto shadow-inner border border-rose-100/50">
                    <svg class="size-10 text-rose-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                    </svg>
                </div>
                <h2 class="text-2xl font-black text-slate-900 mb-3 italic uppercase tracking-tight">Supprimer l'élément ?</h2>
                <p class="text-sm text-slate-400 font-bold italic">Cette action est définitive et toutes les données associées seront perdues.</p>
            </div>
            <div class="px-10 py-8 bg-slate-50 flex flex-col gap-3">
                <button class="w-full h-14 bg-slate-900 text-white rounded-2xl text-[10px] font-black uppercase tracking-[0.25em] italic hover:bg-rose-500 transition-all shadow-xl shadow-slate-900/10 active:scale-95">Confirmer la suppression</button>
                <button class="w-full h-14 bg-white border border-slate-200 text-slate-400 rounded-2xl text-[10px] font-black uppercase tracking-[0.25em] italic hover:bg-slate-50 transition-all">Annuler</button>
            </div>
        </div>
    </div>
</body>
</html>
