<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Molécule: Sidebar Settings</title>
    <link rel="stylesheet" href="../../../charte-graphique/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans'], heading: ['Outfit', 'sans'] }, colors: { primary: { 500: 'var(--color-primary-500)', 600: 'var(--color-primary-600)' } } } } };</script>
</head>

<body class="bg-slate-50 p-6 max-w-xs mx-auto">

    <!-- Molecule : Sidebar Settings -->
    <!-- Atoms : title-section, select-group, toggle-group -->
    <!-- Contexte : Panneau latéral de l'éditeur QCM -->

    <aside class="w-full bg-white border border-slate-200 rounded-2xl p-5 shadow-sm space-y-6">
        <div>
            <h2 class="text-sm font-semibold text-slate-800 uppercase tracking-wider mb-4">Paramètres du QCM</h2>

            <div class="space-y-5">
                <!-- Molecule: Select Group (Cohorte) -->
                <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-medium text-slate-500">Cohorte ciblée</label>
                    <select data-hs-select='{
                        "placeholder": "Choisir une cohorte...",
                        "toggleTag": "<button type=\"button\" aria-expanded=\"false\"></button>",
                        "toggleClasses": "hs-select-disabled:pointer-events-none hs-select-disabled:opacity-50 relative py-3 ps-4 pe-9 flex text-nowrap w-full cursor-pointer bg-white border border-slate-200 text-slate-800 rounded-2xl text-start text-sm hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-primary-500 shadow-sm transition-all",
                        "dropdownClasses": "mt-2 z-50 w-full max-h-72 p-1 space-y-0.5 bg-white border border-slate-100 rounded-2xl shadow-2xl overflow-hidden overflow-y-auto",
                        "optionClasses": "hs-selected:bg-primary-50 hs-selected:text-primary-600 py-2.5 px-4 w-full text-sm text-slate-600 cursor-pointer hover:bg-slate-50 rounded-xl focus:outline-none focus:bg-slate-50 font-medium transition-colors",
                        "optionTemplate": "<div class=\"flex justify-between items-center w-full\"><span data-title></span><span class=\"hidden hs-selected:block\"><svg class=\"shrink-0 size-3.5 text-primary-500\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"/></svg></span></div>",
                        "extraMarkup": "<div class=\"absolute top-1/2 end-3 -translate-y-1/2\"><svg class=\"shrink-0 size-3.5 text-slate-400 group-hover:text-primary-500 transition-colors\" xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m7 15 5 5 5-5\"/><path d=\"m7 9 5-5 5 5\"/></svg></div>"
                      }' class="hidden">
                        <option value="DW_101">DW_101</option>
                        <option value="DW_102" selected>DW_102</option>
                        <option value="MOB_01">MOB_01</option>
                    </select>
                </div>

                <!-- Molecule: Toggle Group (Timer) -->
                <div class="flex items-center justify-between">
                    <div class="flex flex-col">
                        <span class="text-sm font-medium text-slate-700">Chronomètre</span>
                        <span class="text-xs text-slate-400">Limiter le temps</span>
                    </div>
                    <!-- Atom: Toggle Switch -->
                    <button type="button"
                        class="relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none bg-primary-500"
                        role="switch" aria-checked="true">
                        <span class="sr-only">Activer le timer</span>
                        <span aria-hidden="true"
                            class="translate-x-5 pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out"></span>
                    </button>
                </div>

                <!-- Input group (Time input) -->
                <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-medium text-slate-500">Durée (minutes)</label>
                    <input type="number" value="20"
                        class="py-2.5 px-4 block w-full border-slate-200 rounded-2xl text-sm focus:border-primary-500 focus:ring-primary-500 outline-none border transition-colors shadow-sm">
                </div>
            </div>
        </div>

        <div class="pt-6 border-t border-slate-100">
            <button
                class="w-full py-2.5 px-4 inline-flex justify-center items-center gap-x-2 text-sm font-semibold rounded-xl border border-transparent bg-slate-100 text-slate-500 hover:bg-slate-200 transition-colors">
                Supprimer le brouillon
            </button>
        </div>
    </aside>

    <!-- Scripts Preline -->
    <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.js"></script>

</body>

</html>
