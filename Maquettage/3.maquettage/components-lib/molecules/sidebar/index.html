<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molecule: Sidebar - SoliQuiz UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        heading: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: 'hsl(190, 85%, 96%)',
                            100: 'hsl(190, 85%, 90%)',
                            200: 'hsl(190, 85%, 80%)',
                            300: 'hsl(190, 80%, 70%)',
                            400: 'hsl(190, 75%, 60%)',
                            500: 'hsl(190, 80%, 45%)',
                            600: 'hsl(190, 85%, 35%)',
                            700: 'hsl(190, 85%, 28%)',
                            800: 'hsl(190, 80%, 22%)',
                            900: 'hsl(190, 75%, 15%)',
                        }
                    },
                    boxShadow: {
                        'premium': '0 20px 50px -12px rgba(0, 0, 0, 0.08)',
                    }
                }
            }
        }
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="../../../charte-graphique/app.css">
</head>
<body class="bg-slate-100 p-0 m-0 min-h-screen" x-data="{ sidebarOpen: false }">

    <!-- Mobile Header -->
    <div class="lg:hidden glass fixed top-0 left-0 right-0 z-50 px-6 h-16 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-2">
            <div class="size-8 bg-primary-500 rounded-lg flex items-center justify-center shadow-lg shadow-primary-500/20 text-white">
                <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><polyline points="14 2 14 8 20 8" /><path d="m9 15 2 2 4-4" /></svg>
            </div>
            <span class="font-heading font-black text-lg text-slate-900 leading-none tracking-tight italic uppercase">Soli<span class="text-primary-500">Quiz</span></span>
        </div>
        <button @click="sidebarOpen = !sidebarOpen" class="p-2 rounded-xl bg-slate-50 text-slate-600 active:scale-95 transition-all"><svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M4 6h16M4 12h16m-7 6h7" /></svg></button>
    </div>

    <!-- Backdrop -->
    <div x-show="sidebarOpen" @click="sidebarOpen = false" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-60 lg:hidden" x-cloak></div>

    <!-- Sidebar Aside -->
    <aside :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'" class="fixed top-0 left-0 w-72 h-screen transition-transform duration-300 ease-out z-70 shrink-0">
        <div class="h-full p-4">
            <div class="h-full bg-white rounded-[2.5rem] border border-slate-100 shadow-premium flex flex-col overflow-hidden relative">
                <!-- Logo -->
                <div class="p-8 border-b border-slate-50">
                    <div class="flex items-center gap-3">
                        <div class="size-10 bg-primary-500 rounded-2xl flex items-center justify-center shadow-lg shadow-primary-500/25 text-white">
                            <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><polyline points="14 2 14 8 20 8" /><path d="m9 15 2 2 4-4" /></svg>
                        </div>
                        <div class="flex flex-col">
                            <span class="text-2xl font-heading font-black text-slate-900 tracking-tighter leading-none italic uppercase">Soli<span class="text-primary-500">Quiz</span></span>
                            <span class="text-[9px] font-black text-slate-400 uppercase tracking-widest mt-1.5 italic">Espace Admin</span>
                        </div>
                    </div>
                </div>

                <!-- Nav -->
                <nav class="flex-1 px-4 py-8 space-y-8 overflow-y-auto custom-scrollbar">
                    <div>
                        <p class="text-label px-5 mb-5">Général</p>
                        <div class="space-y-1">
                            <a href="#" class="group flex items-center gap-4 px-6 py-3.5 rounded-2xl bg-primary-500 text-white shadow-xl shadow-primary-500/20 italic">
                                <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z" /></svg>
                                <span class="text-xs font-black uppercase tracking-widest">Dashboard</span>
                            </a>
                        </div>
                    </div>
                    <div>
                        <p class="text-label px-5 mb-5">Gestion</p>
                        <div class="space-y-1">
                            <a href="#" class="group flex items-center gap-4 px-6 py-3.5 rounded-2xl text-slate-500 hover:bg-primary-50 hover:text-primary-600 transition-all italic">
                                <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2 M9 7a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm14 14v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" /></svg>
                                <span class="text-xs font-black uppercase tracking-widest">Utilisateurs</span>
                            </a>
                        </div>
                    </div>
                </nav>

                <!-- Profile -->
                <div class="p-8 border-t border-slate-50 bg-slate-50/50">
                    <button class="w-full flex items-center justify-between p-2 rounded-2xl hover:bg-white hover:shadow-sm transition-all border border-transparent hover:border-slate-100 group">
                        <div class="flex items-center gap-3">
                            <div class="size-10 bg-primary-100 rounded-xl flex items-center justify-center font-black text-primary-600 italic">AD</div>
                            <div class="text-left">
                                <p class="text-xs font-black text-slate-900 uppercase italic">Admin</p>
                                <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Administrateur</p>
                            </div>
                        </div>
                        <svg class="size-4 text-slate-300 group-hover:text-primary-500 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path d="M19 9l-7 7-7-7" /></svg>
                    </button>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content Simulation -->
    <main class="lg:ml-72 p-10 pt-24 lg:pt-10">
        <div class="max-w-4xl bg-white rounded-[2.5rem] border border-slate-100 p-20 shadow-premium">
            <h1 class="text-5xl font-heading font-black text-slate-900 mb-8 italic uppercase leading-none">Vérification du <span class="text-primary-500">Design</span>.</h1>
            <p class="text-slate-500 italic text-xl leading-relaxed">Si vous lisez ceci avec la police <span class="font-black text-slate-900">Plus Jakarta Sans</span> et le bleu <span class="text-primary-500 font-black">Ocean Teal</span>, alors la synchronisation est parfaite.</p>
        </div>
    </main>

</body>
</html>
