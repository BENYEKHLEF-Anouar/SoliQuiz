<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molecule: Card QCM - SoliQuiz UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        heading: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: 'hsl(190, 85%, 96%)',
                            100: 'hsl(190, 85%, 90%)',
                            200: 'hsl(190, 85%, 80%)',
                            300: 'hsl(190, 80%, 70%)',
                            400: 'hsl(190, 75%, 60%)',
                            500: 'hsl(190, 80%, 45%)',
                            600: 'hsl(190, 85%, 35%)',
                            700: 'hsl(190, 85%, 28%)',
                            800: 'hsl(190, 80%, 22%)',
                            900: 'hsl(190, 75%, 15%)',
                        }
                    },
                    boxShadow: {
                        'premium': '0 20px 50px -12px rgba(0, 0, 0, 0.08)',
                    }
                }
            }
        }
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="../../../charte-graphique/app.css">
</head>
<body class="bg-slate-50 p-10 font-sans">
    <div class="max-w-4xl mx-auto space-y-10">
        <div class="border-b border-slate-200 pb-4">
            <p class="text-label mb-2">Molecule</p>
            <h1 class="text-3xl font-black text-slate-900 uppercase italic">QCM Card</h1>
            <p class="text-slate-500 mt-2">Composant de carte premium pour les évaluations.</p>
        </div>

        <section class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- QCM Card -->
            <div class="bg-white rounded-[2.5rem] border border-slate-100 p-8 shadow-sm hover:shadow-premium transition-all duration-500 group">
                <div class="flex items-start justify-between mb-6">
                    <div class="px-4 py-1.5 bg-slate-100 text-slate-500 rounded-full text-[9px] font-black uppercase tracking-widest italic">UA2 - JavaScript</div>
                    <span class="px-3 py-1 bg-emerald-50 text-emerald-600 rounded-lg text-[9px] font-black uppercase italic tracking-widest">Actif</span>
                </div>
                <h4 class="text-lg font-black text-slate-900 italic uppercase mb-2 group-hover:text-primary-500 transition-colors">JavaScript Avancé ES6+</h4>
                <p class="text-sm text-slate-500 italic mb-6">Arrow functions, destructuring, async/await</p>
                <div class="flex items-center gap-6 text-[10px] font-black text-slate-400 uppercase tracking-widest italic mb-8">
                    <span class="flex items-center gap-2"><svg class="size-4 text-primary-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>20 min</span>
                    <span class="flex items-center gap-2"><svg class="size-4 text-primary-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M9 5H7a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" /><polyline points="14 2 14 8 20 8" /><path d="m9 15 2 2 4-4" /></svg>15 questions</span>
                </div>
                <div class="flex items-center justify-between pt-6 border-t border-slate-50">
                    <div class="flex items-baseline gap-1.5"><span class="text-2xl font-black text-slate-900 italic">45</span><span class="text-label italic tracking-normal">passages</span></div>
                    <div class="flex gap-2">
                        <button class="size-10 rounded-xl bg-slate-50 text-slate-400 hover:bg-primary-500 hover:text-white transition-all flex items-center justify-center"><svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg></button>
                        <button class="size-10 rounded-xl bg-rose-50 text-rose-400 hover:bg-rose-500 hover:text-white transition-all flex items-center justify-center"><svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button>
                    </div>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
