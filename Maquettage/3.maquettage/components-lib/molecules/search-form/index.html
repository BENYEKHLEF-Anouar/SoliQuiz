<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molecule: Search Form - SoliQuiz UI</title>
    
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">

    <!-- Tailwind V4 CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        heading: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: 'hsl(190, 85%, 96%)',
                            100: 'hsl(190, 85%, 90%)',
                            200: 'hsl(190, 85%, 80%)',
                            300: 'hsl(190, 80%, 70%)',
                            400: 'hsl(190, 75%, 60%)',
                            500: 'hsl(190, 80%, 45%)',
                            600: 'hsl(190, 85%, 35%)',
                            700: 'hsl(190, 85%, 28%)',
                            800: 'hsl(190, 80%, 22%)',
                            900: 'hsl(190, 75%, 15%)',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../../charte-graphique/app.css">
</head>
<body class="bg-slate-50 p-10 font-sans uppercase">
    <div class="max-w-4xl mx-auto space-y-16">
        <!-- Header -->
        <div class="border-b border-slate-200 pb-10 italic">
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.4em] mb-4 italic">Unité Moléculaire</p>
            <h1 class="text-5xl font-black text-slate-900 italic tracking-tighter uppercase">Formulaire <span class="text-primary-500">Exploration</span></h1>
            <p class="text-[11px] font-bold text-slate-400 mt-4 uppercase tracking-widest italic">Interface de requête et filtrage granulaire</p>
        </div>

        <!-- Comprehensive Search Form -->
        <section class="space-y-8">
            <h2 class="text-[11px] font-black text-slate-400 uppercase tracking-[0.3em] italic">Configuration de Recherche Avancée</h2>
            <div class="p-16 bg-white rounded-[4rem] border border-slate-100 shadow-premium italic space-y-12">
                <div class="flex flex-col xl:flex-row gap-8">
                    <!-- Search Input -->
                    <div class="relative flex-1 group italic">
                        <div class="absolute inset-y-0 left-6 flex items-center pointer-events-none text-slate-200 group-focus-within:text-primary-500 transition-colors">
                            <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
                        </div>
                        <input type="text" placeholder="Rechercher QCM..." class="h-16 w-full bg-slate-50 border-2 border-transparent rounded-[1.5rem] pl-16 pr-8 text-sm font-black text-slate-900 focus:bg-white focus:border-primary-500 focus:ring-8 focus:ring-primary-500/5 outline-none transition-all placeholder:text-slate-200 italic uppercase">
                    </div>

                    <!-- Filter Stack -->
                    <div class="flex flex-col sm:flex-row gap-4">
                        <!-- État Flux Dropdown -->
                        <div class="relative min-w-[200px] italic" x-data="{ open: false, selected: '', options: [{value:'', label:'État Flux'},{value:'1', label:'Déployé'},{value:'2', label:'Brouillon'}], get selectedLabel(){ return this.options.find(o=>o.value===this.selected)?.label || 'État Flux'; } }">
                            <button type="button" @click="open = !open" @click.away="open = false"
                                class="h-16 w-full bg-white border-2 border-primary-500 rounded-full px-8 pr-12 font-black text-slate-900 text-[10px] uppercase tracking-widest italic outline-none focus:ring-8 focus:ring-primary-500/5 transition-all cursor-pointer shadow-sm flex items-center justify-between">
                                <span x-text="selectedLabel" class="truncate mr-2"></span>
                                <svg class="size-5 text-primary-500 shrink-0 transition-transform duration-300" :class="open ? 'rotate-180' : ''" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="4"><path d="M19 9l-7 7-7-7" /></svg>
                            </button>
                            <div x-show="open"
                                 x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-2 scale-95" x-transition:enter-end="opacity-100 translate-y-0 scale-100"
                                 x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100 translate-y-0 scale-100" x-transition:leave-end="opacity-0 translate-y-2 scale-95"
                                 class="absolute z-50 w-full mt-3 bg-white border border-slate-100 rounded-[2rem] shadow-premium overflow-hidden p-2" x-cloak>
                                <template x-for="opt in options" :key="opt.value">
                                    <button type="button" @click="selected = opt.value; open = false"
                                        class="w-full text-left px-6 py-4 rounded-2xl text-[10px] font-black uppercase tracking-widest italic transition-all"
                                        :class="selected === opt.value ? 'bg-primary-500 text-white shadow-lg shadow-primary-500/20' : 'text-slate-600 hover:bg-primary-50 hover:text-primary-600'"
                                        x-text="opt.label"></button>
                                </template>
                            </div>
                        </div>

                        <!-- Domaine UA Dropdown -->
                        <div class="relative min-w-[200px] italic" x-data="{ open: false, selected: '', options: [{value:'', label:'Domaine UA'},{value:'1', label:'Backend'},{value:'2', label:'Frontend'}], get selectedLabel(){ return this.options.find(o=>o.value===this.selected)?.label || 'Domaine UA'; } }">
                            <button type="button" @click="open = !open" @click.away="open = false"
                                class="h-16 w-full bg-white border-2 border-primary-500 rounded-full px-8 pr-12 font-black text-slate-900 text-[10px] uppercase tracking-widest italic outline-none focus:ring-8 focus:ring-primary-500/5 transition-all cursor-pointer shadow-sm flex items-center justify-between">
                                <span x-text="selectedLabel" class="truncate mr-2"></span>
                                <svg class="size-5 text-primary-500 shrink-0 transition-transform duration-300" :class="open ? 'rotate-180' : ''" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="4"><path d="M19 9l-7 7-7-7" /></svg>
                            </button>
                            <div x-show="open"
                                 x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-2 scale-95" x-transition:enter-end="opacity-100 translate-y-0 scale-100"
                                 x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100 translate-y-0 scale-100" x-transition:leave-end="opacity-0 translate-y-2 scale-95"
                                 class="absolute z-50 w-full mt-3 bg-white border border-slate-100 rounded-[2rem] shadow-premium overflow-hidden p-2" x-cloak>
                                <template x-for="opt in options" :key="opt.value">
                                    <button type="button" @click="selected = opt.value; open = false"
                                        class="w-full text-left px-6 py-4 rounded-2xl text-[10px] font-black uppercase tracking-widest italic transition-all"
                                        :class="selected === opt.value ? 'bg-primary-500 text-white shadow-lg shadow-primary-500/20' : 'text-slate-600 hover:bg-primary-50 hover:text-primary-600'"
                                        x-text="opt.label"></button>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Compact Form -->
        <section class="space-y-8">
            <h2 class="text-[11px] font-black text-slate-400 uppercase tracking-[0.3em] italic">Saisie Rapide / Navigation</h2>
            <div class="p-12 bg-slate-900 rounded-[3rem] border border-white/5 flex items-center justify-center italic">
                <div class="relative group w-full max-w-sm italic">
                    <div class="absolute inset-y-0 left-5 flex items-center pointer-events-none text-slate-500 group-focus-within:text-primary-500 transition-colors">
                        <svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
                    </div>
                    <input type="text" placeholder="Recherche flash..." class="h-12 w-full bg-white/5 border border-white/10 rounded-xl pl-12 pr-6 text-[10px] font-black text-white focus:bg-white focus:text-slate-900 focus:border-primary-500 outline-none transition-all placeholder:text-slate-500 italic uppercase">
                </div>
            </div>
        </section>
    </div>
</body>
</html>
