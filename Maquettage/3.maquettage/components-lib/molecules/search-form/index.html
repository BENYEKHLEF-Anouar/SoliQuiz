<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Molécule: Search Form</title>
    <link rel="stylesheet" href="../../../charte-graphique/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans'], heading: ['Outfit', 'sans'] }, colors: { primary: { 500: 'var(--color-primary-500)', 600: 'var(--color-primary-600)' } } } } };</script>
</head>

<body class="bg-slate-50 p-10 max-w-lg mx-auto">

    <!-- Molecule : Search Form -->
    <!-- Atoms : input (search), button -->
    <!-- Contexte : dashboards admin/formateur pour filtrer utilisateurs/QCM -->

    <form class="w-full flex items-center gap-2">
        <div class="relative flex-grow">
            <!-- Atom: Input (Search) -->
            <input type="text" placeholder="Rechercher par matricule ou email..."
                class="py-2.5 px-4 pl-10 block w-full border-slate-200 rounded-xl text-sm border focus:border-primary-500 focus:ring-primary-500 outline-none shadow-sm transition-all" />

            <!-- Icon Input Decorator -->
            <div class="absolute inset-y-0 left-3.5 flex items-center pointer-events-none">
                <svg class="h-4 w-4 text-slate-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2.5">
                    <circle cx="11" cy="11" r="8" />
                    <path d="m21 21-4.35-4.35" />
                </svg>
            </div>
        </div>

        <!-- Atom: Button (Search/Submit) -->
        <button type="submit"
            class="py-2.5 px-4 inline-flex items-center gap-x-2 text-sm font-semibold rounded-xl border border-transparent bg-primary-500 text-white hover:bg-primary-600 transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2">
            Chercher
        </button>
    </form>

</body>

</html>
