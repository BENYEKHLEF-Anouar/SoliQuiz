<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molecule: Breadcrumb - SoliQuiz UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 p-10 font-sans">
    <div class="max-w-4xl mx-auto space-y-10">
        <div class="border-b border-slate-200 pb-4">
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.3em] mb-2">Molecule</p>
            <h1 class="text-3xl font-black text-slate-900">Breadcrumb</h1>
            <p class="text-slate-500 mt-2">Fil d'Ariane pour la navigation</p>
        </div>

        <section class="space-y-4">
            <h2 class="text-lg font-bold text-slate-900">Standard Breadcrumb</h2>
            <div class="p-6 bg-white rounded-2xl border border-slate-200">
                <nav class="flex items-center gap-2 text-[10px] font-black uppercase tracking-widest text-slate-400">
                    <a href="#" class="hover:text-[#17B0CF] transition-colors">Dashboard</a>
                    <span class="size-1 rounded-full bg-slate-300"></span>
                    <a href="#" class="hover:text-[#17B0CF] transition-colors">Bibliothèque</a>
                    <span class="size-1 rounded-full bg-slate-300"></span>
                    <span class="text-slate-600">Créer QCM</span>
                </nav>
            </div>
        </section>

        <section class="space-y-4">
            <h2 class="text-lg font-bold text-slate-900">Breadcrumb with Icons</h2>
            <div class="p-6 bg-white rounded-2xl border border-slate-200">
                <nav class="flex items-center gap-2 text-[10px] font-black uppercase tracking-widest text-slate-400">
                    <a href="#" class="flex items-center gap-1.5 hover:text-[#17B0CF] transition-colors">
                        <svg class="size-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                            <path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                        </svg>
                        Dashboard
                    </a>
                    <span class="size-1 rounded-full bg-slate-300"></span>
                    <span class="text-slate-600 flex items-center gap-1.5">
                        <svg class="size-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                            <path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                        </svg>
                        Mes QCMs
                    </span>
                </nav>
            </div>
        </section>

        <section class="space-y-4">
            <h2 class="text-lg font-bold text-slate-900">Back Navigation</h2>
            <div class="p-6 bg-white rounded-2xl border border-slate-200">
                <a href="#" class="inline-flex items-center gap-2 text-[11px] font-bold text-slate-500 hover:text-[#17B0CF] transition-colors uppercase tracking-wider italic">
                    <svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                    </svg>
                    Retour à la bibliothèque
                </a>
            </div>
        </section>
    </div>
</body>
</html>
