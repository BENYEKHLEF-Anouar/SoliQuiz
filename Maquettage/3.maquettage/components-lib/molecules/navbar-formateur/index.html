<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molecule: Navbar Formateur - SoliQuiz UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        primary: {
                            50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd',
                            300: '#7dd3fc', 400: '#38bdf8', 500: '#17B0CF',
                            600: '#0ea5e9', 700: '#0284c7', 800: '#0369a1', 900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="bg-slate-50 font-sans">
    <div class="max-w-6xl mx-auto space-y-10 p-10">
        <div class="border-b border-slate-200 pb-4">
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.3em] mb-2">Molecule</p>
            <h1 class="text-3xl font-black text-slate-900">Navbar Formateur</h1>
            <p class="text-slate-500 mt-2">Barre de navigation pour l'espace formateur</p>
        </div>

        <section class="space-y-4">
            <h2 class="text-lg font-bold text-slate-900">Navbar Desktop + Mobile</h2>
            <div class="space-y-4">
                <!-- Navbar Formateur -->
                <header class="flex flex-wrap md:justify-start md:flex-nowrap z-50 w-full bg-white border-b border-slate-200 sticky top-0">
                    <nav class="relative max-w-7xl w-full flex flex-wrap md:grid md:grid-cols-12 basis-full items-center px-4 md:px-6 mx-auto py-3" aria-label="Navigation Formateur">
                        <!-- Logo -->
                        <div class="md:col-span-3">
                            <a class="flex items-center gap-2 group outline-none" href="#" aria-label="SoliQuiz Formateur">
                                <div class="size-8 bg-[#17B0CF] rounded-lg flex items-center justify-center shadow-lg shadow-[#17B0CF]/20 transition-transform group-hover:rotate-6">
                                    <svg class="text-white size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                                        <polyline points="14 2 14 8 20 8" />
                                        <path d="m9 15 2 2 4-4" />
                                    </svg>
                                </div>
                                <div class="flex flex-col leading-none">
                                    <span class="text-xl font-bold text-slate-900 tracking-tight">Soli<span class="text-[#17B0CF]">Quiz</span></span>
                                    <span class="text-[10px] font-black text-slate-400 uppercase tracking-[0.3em] ml-0.5">Formateur</span>
                                </div>
                            </a>
                        </div>

                        <!-- Nav Menu (Centre - Hidden on Mobile) -->
                        <div class="hidden md:flex md:col-span-6 justify-center items-center gap-x-6">
                            <a href="#" class="font-bold text-[#17B0CF] focus:outline-none text-sm" aria-current="page">Mes Classes</a>
                            <a href="#" class="font-bold text-slate-500 hover:text-slate-800 transition-colors focus:outline-none text-sm">Mes QCM</a>
                            <a href="#" class="font-bold text-slate-500 hover:text-slate-800 transition-colors focus:outline-none text-sm">Éditeur</a>
                        </div>

                        <!-- Actions Droite -->
                        <div class="flex items-center gap-x-3 md:gap-x-4 ms-auto md:col-span-3 justify-end" x-data="{ userOpen: false }">
                            <a href="#" class="hidden sm:inline-flex items-center gap-1.5 py-2 px-3 text-xs font-bold rounded-xl border border-transparent bg-[#17B0CF] text-white hover:bg-[#14a0bd] transition-colors">
                                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                                </svg>
                                Nouveau QCM
                            </a>
                            <button @click="userOpen = !userOpen" type="button" class="flex items-center justify-center w-[38px] h-[38px] rounded-full border border-slate-200 bg-white hover:bg-slate-100 transition-colors">
                                <img class="inline-block size-[32px] rounded-full" src="https://ui-avatars.com/api/?name=Youssef+K&background=17B0CF&color=fff&bold=true" alt="Avatar Formateur">
                            </button>

                            <!-- Dropdown -->
                            <div x-show="userOpen" @click.away="userOpen = false" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100" class="absolute right-0 top-full mt-2 w-48 bg-white rounded-xl border border-slate-200 shadow-xl p-2 z-50" x-cloak>
                                <a href="#" class="flex items-center gap-2 px-4 py-2 rounded-lg text-sm text-slate-600 hover:bg-slate-50">Mon Profil</a>
                                <a href="#" class="flex items-center gap-2 px-4 py-2 rounded-lg text-sm text-slate-600 hover:bg-slate-50">Paramètres</a>
                                <hr class="my-2 border-slate-100">
                                <a href="#" class="flex items-center gap-2 px-4 py-2 rounded-lg text-sm text-rose-500 hover:bg-rose-50">Déconnexion</a>
                            </div>
                        </div>
                    </nav>
                </header>

                <!-- Mobile Bottom Nav -->
                <nav class="md:hidden fixed bottom-0 w-full bg-slate-900 border-t border-white/10 z-50">
                    <div class="flex justify-around items-center h-[72px] px-4 text-white">
                        <a href="#" class="flex flex-col items-center justify-center text-[#17B0CF] gap-1.5">
                            <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                                <rect x="3" y="3" width="7" height="9" />
                                <rect x="14" y="3" width="7" height="5" />
                                <rect x="14" y="12" width="7" height="9" />
                                <rect x="3" y="16" width="7" height="5" />
                            </svg>
                            <span class="text-[10px] font-bold uppercase tracking-widest">QCMs</span>
                        </a>
                        <a href="#" class="flex flex-col items-center justify-center text-slate-400 gap-1.5">
                            <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                            </svg>
                            <span class="text-[10px] font-bold uppercase tracking-widest">Classe</span>
                        </a>
                        <a href="#" class="flex flex-col items-center justify-center text-slate-400 gap-1.5">
                            <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                            </svg>
                            <span class="text-[10px] font-bold uppercase tracking-widest">Profil</span>
                        </a>
                    </div>
                </nav>
            </div>
        </section>
    </div>
</body>
</html>
