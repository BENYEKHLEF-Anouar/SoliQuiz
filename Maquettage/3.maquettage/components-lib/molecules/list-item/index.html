<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molecule: List Item - SoliQuiz UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 p-10 font-sans">
    <div class="max-w-4xl mx-auto space-y-10">
        <div class="border-b border-slate-200 pb-4">
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.3em] mb-2">Molecule</p>
            <h1 class="text-3xl font-black text-slate-900">List Item</h1>
            <p class="text-slate-500 mt-2">Éléments de liste interactifs</p>
        </div>

        <section class="space-y-4">
            <h2 class="text-lg font-bold text-slate-900">Activity List Items</h2>
            <div class="p-6 bg-white rounded-2xl border border-slate-200">
                <div class="divide-y divide-slate-100">
                    <div class="p-4 hover:bg-slate-50 transition-all flex items-center justify-between group">
                        <div class="flex items-center gap-4">
                            <div class="size-10 bg-emerald-100 rounded-xl flex items-center justify-center text-emerald-600">
                                <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M5 13l4 4L19 7"/></svg>
                            </div>
                            <div>
                                <p class="font-bold text-slate-900 text-sm group-hover:text-[#17B0CF] transition-colors">JavaScript Avancé</p>
                                <p class="text-xs text-slate-500">Unité d'apprentissage 3</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-4">
                            <div class="text-right">
                                <p class="text-lg font-black text-emerald-600">17/20</p>
                                <p class="text-[10px] text-slate-400">Il y a 2h</p>
                            </div>
                            <div class="size-8 bg-slate-100 rounded-lg flex items-center justify-center text-slate-400 group-hover:bg-[#17B0CF] group-hover:text-white transition-all">
                                <svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M9 5l7 7-7 7"/></svg>
                            </div>
                        </div>
                    </div>
                    <div class="p-4 hover:bg-slate-50 transition-all flex items-center justify-between group">
                        <div class="flex items-center gap-4">
                            <div class="size-10 bg-rose-100 rounded-xl flex items-center justify-center text-rose-600">
                                <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M6 18L18 6M6 6l12 12"/></svg>
                            </div>
                            <div>
                                <p class="font-bold text-slate-900 text-sm group-hover:text-[#17B0CF] transition-colors">Base de données SQL</p>
                                <p class="text-xs text-slate-500">Unité d'apprentissage 5</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-4">
                            <div class="text-right">
                                <p class="text-lg font-black text-rose-600">9/20</p>
                                <p class="text-[10px] text-slate-400">Hier</p>
                            </div>
                            <div class="size-8 bg-slate-100 rounded-lg flex items-center justify-center text-slate-400 group-hover:bg-[#17B0CF] group-hover:text-white transition-all">
                                <svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M9 5l7 7-7 7"/></svg>
                            </div>
                        </div>
                    </div>
                    <div class="p-4 hover:bg-slate-50 transition-all flex items-center justify-between group">
                        <div class="flex items-center gap-4">
                            <div class="size-10 bg-[#e0f2fe] rounded-xl flex items-center justify-center text-[#17B0CF] animate-pulse">
                                <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                            </div>
                            <div>
                                <p class="font-bold text-slate-900 text-sm group-hover:text-[#17B0CF] transition-colors">Laravel Framework</p>
                                <p class="text-xs text-slate-500">Unité d'apprentissage 4</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-4">
                            <div class="text-right">
                                <p class="text-xs font-black text-[#17B0CF] uppercase tracking-widest">En cours</p>
                                <p class="text-[10px] text-slate-400">Il y a 30min</p>
                            </div>
                            <div class="size-8 bg-slate-100 rounded-lg flex items-center justify-center text-slate-400 group-hover:bg-[#17B0CF] group-hover:text-white transition-all">
                                <svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M9 5l7 7-7 7"/></svg>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
