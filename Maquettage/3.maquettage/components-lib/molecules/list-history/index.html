<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molecule: List History - SoliQuiz UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        primary: {
                            50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd',
                            300: '#7dd3fc', 400: '#38bdf8', 500: '#17B0CF',
                            600: '#0ea5e9', 700: '#0284c7', 800: '#0369a1', 900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 p-10 font-sans max-w-lg mx-auto">
    <div class="max-w-4xl mx-auto space-y-10 w-full">
        <div class="border-b border-slate-200 pb-4">
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.3em] mb-2">Molecule</p>
            <h1 class="text-3xl font-black text-slate-900">List History</h1>
            <p class="text-slate-500 mt-2">Liste d'historique avec dates et scores</p>
        </div>

        <section class="space-y-4">
            <div>
                <div class="flex flex-col gap-2">
                    <!-- Item 1 -->
                    <div class="flex items-center justify-between bg-white border border-slate-100 rounded-xl px-4 py-3 shadow-sm hover:border-[#7dd3fc] transition-colors">
                        <div class="flex flex-col">
                            <span class="text-sm font-bold text-slate-800">HTML / CSS — Bases</span>
                            <span class="text-xs text-slate-400 mt-0.5">28 fév 2026</span>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="inline-flex items-center py-1 px-2.5 rounded-full text-xs font-bold bg-emerald-100 text-emerald-700">80%</span>
                            <a href="#" class="text-xs text-[#17B0CF] hover:underline font-bold">Voir correction</a>
                        </div>
                    </div>

                    <!-- Item 2 -->
                    <div class="flex items-center justify-between bg-white border border-slate-100 rounded-xl px-4 py-3 shadow-sm hover:border-[#7dd3fc] transition-colors">
                        <div class="flex flex-col">
                            <span class="text-sm font-bold text-slate-800">PHP — Fonctions</span>
                            <span class="text-xs text-slate-400 mt-0.5">25 fév 2026</span>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="inline-flex items-center py-1 px-2.5 rounded-full text-xs font-bold bg-amber-100 text-amber-700">55%</span>
                            <a href="#" class="text-xs text-[#17B0CF] hover:underline font-bold">Voir correction</a>
                        </div>
                    </div>

                    <!-- Item 3 -->
                    <div class="flex items-center justify-between bg-white border border-slate-100 rounded-xl px-4 py-3 shadow-sm hover:border-[#7dd3fc] transition-colors">
                        <div class="flex flex-col">
                            <span class="text-sm font-bold text-slate-800">Algorithmique — Tri</span>
                            <span class="text-xs text-slate-400 mt-0.5">20 fév 2026</span>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="inline-flex items-center py-1 px-2.5 rounded-full text-xs font-bold bg-rose-100 text-rose-700">30%</span>
                            <a href="#" class="text-xs text-[#17B0CF] hover:underline font-bold">Voir correction</a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
