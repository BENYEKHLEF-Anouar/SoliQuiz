<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atom: Textarea - SoliQuiz UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 p-10 font-sans">
    <div class="max-w-4xl mx-auto space-y-10">
        <div class="border-b border-slate-200 pb-4">
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.3em] mb-2">Atom</p>
            <h1 class="text-3xl font-black text-slate-900">Textarea</h1>
            <p class="text-slate-500 mt-2">Zones de texte multilignes</p>
        </div>

        <section class="space-y-4">
            <h2 class="text-lg font-bold text-slate-900">Basic Textarea</h2>
            <div class="p-6 bg-white rounded-2xl border border-slate-200">
                <div class="space-y-2">
                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em] ml-1 italic">Description du QCM</label>
                    <textarea rows="4" placeholder="Décrivez le contenu et les objectifs de ce QCM..."
                        class="w-full bg-slate-50 border-2 border-transparent rounded-2xl py-3 px-4 text-sm font-medium text-slate-900 focus:bg-white focus:border-[#17B0CF] focus:ring-4 focus:ring-[#17B0CF]/10 outline-none transition-all placeholder:text-slate-400 resize-none"></textarea>
                </div>
            </div>
        </section>

        <section class="space-y-4">
            <h2 class="text-lg font-bold text-slate-900">Textarea with Character Count</h2>
            <div class="p-6 bg-white rounded-2xl border border-slate-200">
                <div class="space-y-2">
                    <div class="flex justify-between items-center px-1">
                        <label class="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em] italic">Feedback de question</label>
                        <span class="text-[9px] font-bold text-slate-400">0/500</span>
                    </div>
                    <textarea rows="3" placeholder="Ajoutez une explication pour cette question..."
                        class="w-full bg-slate-50 border-2 border-transparent rounded-2xl py-3 px-4 text-sm font-medium text-slate-900 focus:bg-white focus:border-[#17B0CF] focus:ring-4 focus:ring-[#17B0CF]/10 outline-none transition-all placeholder:text-slate-400 resize-none"></textarea>
                </div>
            </div>
        </section>

        <section class="space-y-4">
            <h2 class="text-lg font-bold text-slate-900">States</h2>
            <div class="p-6 bg-white rounded-2xl border border-slate-200 space-y-4">
                <div class="space-y-2">
                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em] italic">Default</label>
                    <textarea rows="2" placeholder="Placeholder text"
                        class="w-full bg-slate-50 border-2 border-transparent rounded-2xl py-3 px-4 text-sm font-medium text-slate-900 focus:bg-white focus:border-[#17B0CF] focus:ring-4 focus:ring-[#17B0CF]/10 outline-none transition-all resize-none"></textarea>
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em] italic">Filled</label>
                    <textarea rows="2" class="w-full bg-white border-2 border-[#17B0CF] rounded-2xl py-3 px-4 text-sm font-medium text-slate-900 focus:bg-white focus:border-[#17B0CF] focus:ring-4 focus:ring-[#17B0CF]/10 outline-none transition-all resize-none">Ce QCM couvre les fondamentaux de JavaScript incluant les variables, fonctions, et structures de contrôle.</textarea>
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em] italic">Disabled</label>
                    <textarea rows="2" disabled class="w-full bg-slate-100 border-2 border-transparent rounded-2xl py-3 px-4 text-sm font-medium text-slate-400 cursor-not-allowed resize-none">Contenu verrouillé</textarea>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
