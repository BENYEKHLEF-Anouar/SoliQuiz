<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atom: Toggle - SoliQuiz UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 p-10 font-sans">
    <div class="max-w-4xl mx-auto space-y-10">
        <div class="border-b border-slate-200 pb-4">
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.3em] mb-2">Atom</p>
            <h1 class="text-3xl font-black text-slate-900">Toggle</h1>
            <p class="text-slate-500 mt-2">Interrupteurs et switches</p>
        </div>

        <section class="space-y-4">
            <h2 class="text-lg font-bold text-slate-900">Basic Toggle</h2>
            <div class="p-6 bg-white rounded-2xl border border-slate-200 space-y-4">
                <label class="flex items-center gap-3 cursor-pointer group">
                    <div class="relative">
                        <input type="checkbox" class="peer sr-only" checked>
                        <div class="w-12 h-7 bg-slate-200 rounded-full peer-checked:bg-[#17B0CF] transition-colors"></div>
                        <div class="absolute top-1 left-1 size-5 bg-white rounded-full shadow-sm transition-transform peer-checked:translate-x-5"></div>
                    </div>
                    <span class="text-sm font-medium text-slate-700">Notifications activées</span>
                </label>
                <label class="flex items-center gap-3 cursor-pointer group">
                    <div class="relative">
                        <input type="checkbox" class="peer sr-only">
                        <div class="w-12 h-7 bg-slate-200 rounded-full peer-checked:bg-[#17B0CF] transition-colors"></div>
                        <div class="absolute top-1 left-1 size-5 bg-white rounded-full shadow-sm transition-transform peer-checked:translate-x-5"></div>
                    </div>
                    <span class="text-sm font-medium text-slate-700">Mode sombre</span>
                </label>
                <label class="flex items-center gap-3 cursor-pointer group">
                    <div class="relative">
                        <input type="checkbox" class="peer sr-only" disabled>
                        <div class="w-12 h-7 bg-slate-100 rounded-full cursor-not-allowed"></div>
                        <div class="absolute top-1 left-1 size-5 bg-white rounded-full shadow-sm cursor-not-allowed"></div>
                    </div>
                    <span class="text-sm font-medium text-slate-400">Option désactivée</span>
                </label>
            </div>
        </section>

        <section class="space-y-4">
            <h2 class="text-lg font-bold text-slate-900">Compact Toggle</h2>
            <div class="p-6 bg-white rounded-2xl border border-slate-200 space-y-4">
                <label class="flex items-center gap-3 cursor-pointer group">
                    <div class="relative">
                        <input type="checkbox" class="peer sr-only" checked>
                        <div class="w-9 h-5 bg-slate-200 rounded-full peer-checked:bg-[#17B0CF] transition-colors"></div>
                        <div class="absolute top-0.5 left-0.5 size-4 bg-white rounded-full shadow-sm transition-transform peer-checked:translate-x-4"></div>
                    </div>
                    <span class="text-xs font-medium text-slate-700">Compact ON</span>
                </label>
                <label class="flex items-center gap-3 cursor-pointer group">
                    <div class="relative">
                        <input type="checkbox" class="peer sr-only">
                        <div class="w-9 h-5 bg-slate-200 rounded-full peer-checked:bg-[#17B0CF] transition-colors"></div>
                        <div class="absolute top-0.5 left-0.5 size-4 bg-white rounded-full shadow-sm transition-transform peer-checked:translate-x-4"></div>
                    </div>
                    <span class="text-xs font-medium text-slate-700">Compact OFF</span>
                </label>
            </div>
        </section>

        <section class="space-y-4">
            <h2 class="text-lg font-bold text-slate-900">Toggle with Description</h2>
            <div class="p-6 bg-white rounded-2xl border border-slate-200 space-y-4">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm font-bold text-slate-900">Synchronisation auto</p>
                        <p class="text-xs text-slate-500">Synchronise les résultats en temps réel</p>
                    </div>
                    <label class="cursor-pointer">
                        <div class="relative">
                            <input type="checkbox" class="peer sr-only" checked>
                            <div class="w-12 h-7 bg-slate-200 rounded-full peer-checked:bg-[#17B0CF] transition-colors"></div>
                            <div class="absolute top-1 left-1 size-5 bg-white rounded-full shadow-sm transition-transform peer-checked:translate-x-5"></div>
                        </div>
                    </label>
                </div>
                <div class="h-px bg-slate-100"></div>
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm font-bold text-slate-900">Mode évaluation</p>
                        <p class="text-xs text-slate-500">Bloque la navigation pendant le QCM</p>
                    </div>
                    <label class="cursor-pointer">
                        <div class="relative">
                            <input type="checkbox" class="peer sr-only">
                            <div class="w-12 h-7 bg-slate-200 rounded-full peer-checked:bg-[#17B0CF] transition-colors"></div>
                            <div class="absolute top-1 left-1 size-5 bg-white rounded-full shadow-sm transition-transform peer-checked:translate-x-5"></div>
                        </div>
                    </label>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
