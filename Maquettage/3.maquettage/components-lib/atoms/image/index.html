<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atom: Image - SoliQuiz UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 p-10 font-sans">
    <div class="max-w-4xl mx-auto space-y-10">
        <div class="border-b border-slate-200 pb-4">
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.3em] mb-2">Atom</p>
            <h1 class="text-3xl font-black text-slate-900">Image</h1>
            <p class="text-slate-500 mt-2">Conteneurs et styles d'images</p>
        </div>

        <section class="space-y-4">
            <h2 class="text-lg font-bold text-slate-900">Avatar Images</h2>
            <div class="p-6 bg-white rounded-2xl border border-slate-200">
                <div class="flex items-center gap-4">
                    <img class="size-12 rounded-2xl object-cover shadow-md border-2 border-white" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100&h=100&fit=crop" alt="Avatar">
                    <img class="size-16 rounded-2xl object-cover shadow-md border-2 border-white" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&h=100&fit=crop" alt="Avatar">
                    <img class="size-20 rounded-3xl object-cover shadow-lg border-2 border-white" src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=100&h=100&fit=crop" alt="Avatar">
                </div>
            </div>
        </section>

        <section class="space-y-4">
            <h2 class="text-lg font-bold text-slate-900">Card Images</h2>
            <div class="p-6 bg-white rounded-2xl border border-slate-200">
                <div class="grid grid-cols-3 gap-4">
                    <div class="aspect-video rounded-xl overflow-hidden bg-slate-100">
                        <img class="w-full h-full object-cover" src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=400&h=225&fit=crop" alt="Card">
                    </div>
                    <div class="aspect-video rounded-xl overflow-hidden bg-slate-100">
                        <img class="w-full h-full object-cover" src="https://images.unsplash.com/photo-1501504905252-473c47e087f8?w=400&h=225&fit=crop" alt="Card">
                    </div>
                    <div class="aspect-video rounded-xl overflow-hidden bg-slate-100">
                        <img class="w-full h-full object-cover" src="https://images.unsplash.com/photo-1434030216411-0b793f4b4173?w=400&h=225&fit=crop" alt="Card">
                    </div>
                </div>
            </div>
        </section>

        <section class="space-y-4">
            <h2 class="text-lg font-bold text-slate-900">Image with Overlay</h2>
            <div class="p-6 bg-white rounded-2xl border border-slate-200">
                <div class="relative aspect-video rounded-2xl overflow-hidden">
                    <img class="w-full h-full object-cover" src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?w=800&h=450&fit=crop" alt="Hero">
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-900/80 to-transparent"></div>
                    <div class="absolute bottom-0 left-0 right-0 p-6">
                        <p class="text-white text-lg font-bold">Formation Solicode</p>
                        <p class="text-slate-300 text-sm">Apprenez avec les meilleurs</p>
                    </div>
                </div>
            </div>
        </section>

        <section class="space-y-4">
            <h2 class="text-lg font-bold text-slate-900">Placeholder</h2>
            <div class="p-6 bg-white rounded-2xl border border-slate-200">
                <div class="flex items-center gap-4">
                    <div class="size-20 rounded-xl bg-slate-100 flex items-center justify-center">
                        <svg class="size-8 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                            <path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                        </svg>
                    </div>
                    <div class="aspect-video w-32 rounded-xl bg-slate-100 flex items-center justify-center">
                        <svg class="size-8 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                            <path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                        </svg>
                    </div>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
