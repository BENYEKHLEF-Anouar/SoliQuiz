<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atom: Button</title>
    <!-- CSS Custom -->
    <link rel="stylesheet" href="../../../charte-graphique/style.css">
    <!-- Tailwind Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: {
                            50: 'var(--color-primary-50)', 100: 'var(--color-primary-100)',
                            500: 'var(--color-primary-500)', 600: 'var(--color-primary-600)',
                            800: 'var(--color-primary-800)', 900: 'var(--color-primary-900)',
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gray-50 p-10 font-sans space-y-6 flex flex-col items-start">

    <h2 class="text-xs text-slate-400 font-mono uppercase">Primary Button (Preline UI)</h2>
    <!-- Atom : Button Primary -->
    <button type="button"
        class="py-3 px-4 inline-flex items-center gap-x-2 text-sm font-semibold rounded-xl border border-transparent bg-primary-500 text-white shadow-sm hover:bg-primary-600 hover:-translate-y-0.5 disabled:opacity-50 disabled:pointer-events-none transition-all duration-300">
        Valider mes réponses
    </button>

    <h2 class="text-xs text-slate-400 font-mono uppercase mt-6">Outline / Secondary Button</h2>
    <!-- Atom : Button Outline -->
    <button type="button"
        class="py-3 px-4 inline-flex items-center gap-x-2 text-sm font-medium rounded-xl border border-slate-200 bg-white text-slate-800 shadow-sm hover:bg-slate-50 hover:-translate-y-0.5 disabled:opacity-50 disabled:pointer-events-none transition-all duration-300">
        Enregistrer le brouillon
    </button>

    <h2 class="text-xs text-slate-400 font-mono uppercase mt-6">Soft / Muted Button</h2>
    <!-- Atom : Button Soft -->
    <button type="button"
        class="py-3 px-4 inline-flex items-center gap-x-2 text-sm font-semibold rounded-xl border border-transparent bg-primary-50 text-primary-800 hover:bg-primary-100 disabled:opacity-50 disabled:pointer-events-none transition-all duration-300">
        Question précédente
    </button>

</body>

</html>
