<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier le QCM - SoliQuiz UI</title>
    
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">

    <!-- Tailwind V4 CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        heading: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: 'hsl(190, 85%, 96%)',
                            100: 'hsl(190, 85%, 90%)',
                            200: 'hsl(190, 85%, 80%)',
                            300: 'hsl(190, 80%, 70%)',
                            400: 'hsl(190, 75%, 60%)',
                            500: 'hsl(190, 80%, 45%)',
                            600: 'hsl(190, 85%, 35%)',
                            700: 'hsl(190, 85%, 28%)',
                            800: 'hsl(190, 80%, 22%)',
                            900: 'hsl(190, 75%, 15%)',
                        }
                    },
                    boxShadow: {
                        'premium': '0 20px 50px -12px rgba(0, 0, 0, 0.08)',
                    }
                }
            }
        }
    </script>
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Custom Design System -->
    <link rel="stylesheet" href="../charte-graphique/app.css">
    
    <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="font-sans antialiased text-slate-800 bg-slate-50 h-screen overflow-hidden text-left uppercase">
    <div class="flex h-screen overflow-hidden p-0 m-0" x-data="{ sidebarOpen: false }">
        
        <!-- Mobile Header -->
        <div class="lg:hidden glass fixed top-0 left-0 right-0 z-50 px-6 h-16 flex justify-between items-center shadow-sm">
            <div class="flex items-center gap-2">
                <div class="size-8 bg-primary-500 rounded-lg flex items-center justify-center shadow-lg shadow-primary-500/20 text-white">
                    <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><polyline points="14 2 14 8 20 8" /><path d="m9 15 2 2 4-4" /></svg>
                </div>
                <span class="font-heading font-black text-lg text-slate-900 leading-none tracking-tight italic uppercase">Soli<span class="text-primary-500">Quiz</span></span>
            </div>
            <button @click="sidebarOpen = !sidebarOpen" class="p-2 rounded-xl bg-slate-50 text-slate-600 active:scale-95 transition-all"><svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M4 6h16M4 12h16m-7 6h7" /></svg></button>
        </div>

        <!-- Backdrop -->
        <div x-show="sidebarOpen" @click="sidebarOpen = false" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-60 lg:hidden" x-cloak></div>

        <!-- Sidebar -->
        <aside :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'"
               class="fixed top-0 left-0 w-72 transition-transform duration-300 ease-out z-70 h-screen shrink-0">
            <div class="h-full p-4 text-left">
                <div class="h-full bg-white rounded-[2.5rem] border border-slate-100 shadow-premium flex flex-col overflow-hidden relative">
                    <div class="p-8 border-b border-slate-50">
                        <a class="flex items-center gap-3 transition-transform active:scale-95 outline-none" href="03-formateur-dashboard.html">
                            <div class="size-10 bg-primary-500 rounded-2xl flex items-center justify-center shadow-lg shadow-primary-500/25 text-white">
                                <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><polyline points="14 2 14 8 20 8" /><path d="m9 15 2 2 4-4" /></svg>
                            </div>
                            <div class="flex flex-col leading-none">
                                <span class="text-2xl font-heading font-black text-slate-900 tracking-tighter leading-none italic uppercase">Soli<span class="text-primary-500">Quiz</span></span>
                                <span class="text-[9px] font-black text-slate-400 uppercase tracking-widest mt-1.5 italic">Espace Formateur</span>
                            </div>
                        </a>
                    </div>
                    <nav class="flex-1 px-4 py-8 space-y-8 overflow-y-auto custom-scrollbar">
                        <div>
                            <p class="text-label px-5 mb-5 italic">Général</p>
                            <div class="space-y-1">
                                <a href="03-formateur-dashboard.html" class="group flex items-center gap-4 px-6 py-3.5 rounded-2xl transition-all italic text-slate-500 hover:bg-primary-50 hover:text-primary-600">
                                    <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z" /></svg>
                                    <span class="text-xs font-black uppercase tracking-widest">Tableau de Bord</span>
                                </a>
                            </div>
                        </div>
                        <div>
                            <p class="text-label px-5 mb-5 italic">Ma Pédagogie</p>
                            <div class="space-y-1">
                                <a href="03-formateur-bibliotheque.html" class="group flex items-center gap-4 px-6 py-3.5 rounded-2xl transition-all italic bg-primary-500 text-white shadow-xl shadow-primary-500/20">
                                    <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.247 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>
                                    <span class="text-xs font-black uppercase tracking-widest">Mes QCMs</span>
                                </a>
                                <a href="20-formateur-resultats.html" class="group flex items-center gap-4 px-6 py-3.5 rounded-2xl transition-all italic text-slate-500 hover:bg-primary-50 hover:text-primary-600">
                                    <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>
                                    <span class="text-xs font-black uppercase tracking-widest">Statistiques</span>
                                </a>
                                <a href="21-formateur-pedagogie.html" class="group flex items-center gap-4 px-6 py-3.5 rounded-2xl transition-all italic text-slate-500 hover:bg-primary-50 hover:text-primary-600">
                                    <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.247 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>
                                    <span class="text-xs font-black uppercase tracking-widest">Plan de Formation</span>
                                </a>
                            </div>
                        </div>
                    </nav>
                    <div class="p-4 border-t border-slate-50">
                        <div class="bg-slate-900 rounded-[2rem] p-6 text-white relative overflow-hidden group">
                            <div class="relative z-10 text-left">
                                <p class="text-[8px] font-black uppercase tracking-widest text-slate-400 mb-2 italic">Session Formateur</p>
                                <p class="text-xs font-bold leading-tight italic">Ahmed Pro</p>
                                <a href="14-public-landing.html" class="mt-4 flex items-center gap-2 text-rose-400 hover:text-rose-300 transition-colors text-[10px] font-black uppercase tracking-widest italic">
                                    Déconnexion
                                    <svg class="size-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h6a2 2 0 012 2v1" /></svg>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Content Area -->
        <div class="flex-1 flex flex-col min-w-0 p-0 m-0 lg:ml-72">
            <main class="flex-1 overflow-y-auto custom-scrollbar min-h-0 bg-slate-50 pt-16 lg:pt-0">
                <div class="p-4 lg:p-10 pt-0 lg:pt-0 text-left uppercase">
                    <div class="max-w-[1600px] mx-auto pt-10">
                        <div class="fade-in pb-32 italic" x-data="qcmBuilder()">
                            <!-- Main Form Application -->
                            <form class="flex flex-col lg:flex-row gap-6 xl:gap-8 items-start italic uppercase" @submit.prevent="handleSubmit">
                                <!-- Main Column -->
                                <div class="flex-1 w-full space-y-10 italic">
                                    <div class="bg-white rounded-[3.5rem] border border-slate-100 shadow-premium p-12 relative overflow-hidden italic">
                                        <div class="absolute top-0 right-0 p-8 opacity-5 pointer-events-none">
                                            <svg class="size-32" fill="currentColor" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="m9 15 2 2 4-4"/></svg>
                                        </div>
                                        <div class="relative z-10 space-y-5 italic text-left">
                                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-4 italic">Identité de l'évaluation</label>
                                            <input type="text" x-model="titre" required class="w-full bg-slate-50 border-transparent rounded-[2rem] py-6 px-10 text-4xl font-black text-slate-900 placeholder:text-slate-200 focus:bg-white focus:ring-4 focus:ring-primary-500/5 outline-none transition-all italic uppercase">
                                        </div>
                                    </div>

                                    <div class="space-y-10 italic">
                                        <template x-for="(question, qIndex) in questions" :key="qIndex">
                                            <article class="bg-white rounded-[3.5rem] border border-slate-100 shadow-premium overflow-hidden italic transition-all duration-500" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 translate-y-8">
                                                <div class="px-12 py-10 border-b border-slate-50 flex items-center justify-between bg-slate-50/20 italic">
                                                    <div class="flex items-center gap-8 italic">
                                                        <div class="size-16 rounded-[1.5rem] bg-slate-900 text-white flex items-center justify-center text-2xl font-black italic shadow-2xl shadow-slate-900/10" x-text="(qIndex + 1).toString().padStart(2, '0')"></div>
                                                        <div class="flex flex-col italic text-left">
                                                            <span class="text-[11px] font-black text-slate-400 uppercase tracking-[0.2em] italic mb-1">Configuration de l'item</span>
                                                            <div class="flex items-center gap-4 italic">
                                                                <span class="text-[10px] font-black text-primary-500 uppercase tracking-widest italic" x-text="question.type === 'choix_unique' ? 'Réponse Unique' : 'Réponses Multiples'"></span>
                                                                <span class="size-1.5 rounded-full bg-slate-200 italic"></span>
                                                                <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest italic" x-text="`${question.points} Points`"></span>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <button @click="removeQuestion(qIndex)" type="button" class="p-4 text-slate-300 hover:text-rose-500 transition-colors">
                                                        <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                                                    </button>
                                                </div>
                                                
                                                <div class="p-12 space-y-12 italic">
                                                    <div class="flex flex-col md:flex-row gap-10 italic">
                                                        <div class="w-32 shrink-0 space-y-5 italic text-left">
                                                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2 italic">Barème</label>
                                                            <input type="number" x-model.number="question.points" class="w-full h-16 rounded-[1.5rem] border-transparent bg-slate-50 font-black text-3xl text-slate-900 text-center focus:bg-white focus:ring-4 focus:ring-primary-500/5 transition-all outline-none italic">
                                                        </div>
                                                        <div class="flex-1 space-y-5 italic text-left">
                                                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2 italic">Énoncé Pédagogique</label>
                                                            <textarea x-model="question.texte" required class="w-full py-6 px-10 rounded-[2.5rem] bg-slate-50 border-transparent font-black text-2xl text-slate-900 placeholder:text-slate-200 focus:bg-white focus:ring-4 focus:ring-primary-500/5 transition-all outline-none resize-none italic uppercase" rows="2" placeholder="Formuler la question..."></textarea>
                                                        </div>
                                                    </div>

                                                    <!-- Options Management -->
                                                    <div class="space-y-8 italic">
                                                        <div class="flex items-center justify-between border-b border-slate-50 pb-5">
                                                            <div class="flex items-center gap-3">
                                                                <h4 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.3em] italic">Options Stratégiques</h4>
                                                            </div>
                                                            <div class="relative group mt-2">
                                                                <select x-model="question.type" class="h-12 bg-white border-2 border-primary-500 rounded-full pl-6 pr-10 text-[9px] font-black uppercase tracking-widest text-slate-900 outline-none focus:ring-4 focus:ring-primary-500/10 transition-all appearance-none cursor-pointer italic shadow-sm">
                                                                    <option value="choix_unique">Choix Unique</option>
                                                                    <option value="choix_multiple">Choix Multiple</option>
                                                                </select>
                                                                <div class="absolute inset-y-0 right-4 flex items-center pointer-events-none text-primary-500 group-focus-within:rotate-180 transition-transform duration-300">
                                                                    <svg class="size-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="4"><path d="M19 9l-7 7-7-7" /></svg>
                                                                </div>
                                                            </div>
                                                        </div>

                                                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 italic text-left">
                                                            <template x-for="(opt, oIndex) in question.options" :key="oIndex">
                                                                <div class="group/opt p-8 bg-slate-50/50 rounded-[2.5rem] border-2 transition-all duration-300 space-y-4 shadow-sm" :class="opt.est_correcte ? 'border-emerald-400 bg-emerald-50/50' : 'border-transparent hover:border-primary-100 hover:bg-white'">
                                                                    <div class="flex items-center gap-4">
                                                                        <button @click="toggleCorrectOption(qIndex, oIndex)" type="button" class="shrink-0 transition-all" :class="question.type === 'choix_unique' ? 'w-8 h-8 rounded-full' : 'w-8 h-8 rounded-xl'">
                                                                            <div class="w-full h-full flex items-center justify-center transition-all shadow-sm" :class="opt.est_correcte ? 'bg-emerald-500 text-white' : 'bg-white border-2 border-slate-200 text-transparent'">
                                                                                <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="4"><path d="M5 13l4 4L19 7" /></svg>
                                                                            </div>
                                                                        </button>
                                                                        <input type="text" required x-model="opt.texte" placeholder="Option de réponse..." class="flex-1 bg-transparent border-none p-0 font-black text-slate-800 text-lg placeholder:text-slate-300 focus:ring-0 outline-none uppercase italic">
                                                                        <button @click="removeOption(qIndex, oIndex)" type="button" class="text-slate-200 hover:text-rose-500 transition-colors opacity-0 group-hover/opt:opacity-100 p-2">
                                                                            <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path d="M6 18L18 6M6 6l12 12" /></svg>
                                                                        </button>
                                                                    </div>
                                                                    <input type="text" x-model="opt.feedback_specifique" placeholder="Feedback correctif (optionnel)..." class="w-full bg-white/60 border border-slate-100 rounded-2xl py-3 px-5 text-[10px] font-black text-slate-500 uppercase tracking-widest italic placeholder:text-slate-300 focus:bg-white transition-all outline-none">
                                                                </div>
                                                            </template>
                                                            
                                                            <button @click="addOption(qIndex)" type="button" class="h-full min-h-[120px] border-2 border-dashed border-slate-200 rounded-[2.5rem] flex flex-col items-center justify-center gap-2 text-slate-300 hover:text-primary-500 hover:border-primary-200 hover:bg-primary-50/30 transition-all group">
                                                                <svg class="size-8 group-hover:rotate-90 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path d="M12 4v16m8-8H4" /></svg>
                                                                <span class="text-[10px] font-black uppercase tracking-[0.2em] italic">Insérer Option</span>
                                                            </button>
                                                        </div>
                                                    </div>

                                                    <!-- Global Question Feedback -->
                                                    <div class="pt-8 border-t border-slate-50 flex gap-6 items-start italic text-left">
                                                        <div class="size-14 rounded-[1.5rem] bg-primary-50 text-primary-500 flex items-center justify-center shrink-0 shadow-sm">
                                                            <svg class="size-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                                                        </div>
                                                        <div class="flex-1 space-y-4">
                                                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2 italic">Analyse Post-Passation</label>
                                                            <textarea x-model="question.explication_feedback" class="w-full bg-slate-50 border-transparent rounded-[2rem] py-5 px-8 text-sm font-black text-slate-600 focus:bg-white focus:ring-4 focus:ring-primary-500/5 transition-all outline-none resize-none uppercase italic" rows="2" placeholder="Expliquer le raisonnement correct..."></textarea>
                                                        </div>
                                                    </div>
                                                </div>
                                            </article>
                                        </template>
                                        
                                        <!-- Final Actions -->
                                        <div class="flex flex-col items-center gap-10 py-8 italic">
                                            <button @click="addQuestion()" type="button" class="h-20 px-12 bg-white border border-slate-100 rounded-[2.5rem] font-black text-slate-900 uppercase tracking-[0.3em] italic shadow-premium hover:shadow-2xl hover:-translate-y-2 transition-all flex items-center gap-4 text-xs">
                                                <svg class="size-6 text-primary-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path d="M12 4v16m8-8H4" /></svg>
                                                Nouvelle Question
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                <!-- Sidebar Configuration -->
                                <div class="w-full lg:w-[420px] shrink-0 space-y-10 sticky top-12 italic uppercase">
                                    <div class="bg-white rounded-[3.5rem] border border-slate-100 shadow-premium p-10 space-y-10 italic">
                                        <h3 class="text-xs font-black uppercase tracking-[0.2em] text-slate-900 italic border-b border-slate-50 pb-8 text-left">Configuration</h3>
                                        
                                        <div class="space-y-8 italic text-left">
                                            <div class="space-y-4 italic">
                                                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-4 italic">Disponibilité</label>
                                                <div class="relative group mt-2">
                                                    <select x-model="statut" class="w-full h-14 bg-white border-2 border-primary-500 rounded-full px-8 pr-12 font-black text-slate-900 text-[10px] uppercase tracking-widest italic outline-none focus:ring-8 focus:ring-primary-500/5 transition-all appearance-none cursor-pointer shadow-sm">
                                                        <option value="brouillon">Brouillon</option>
                                                        <option value="public">Public</option>
                                                        <option value="termine">Terminé</option>
                                                    </select>
                                                    <div class="absolute inset-y-0 right-6 flex items-center pointer-events-none text-primary-500 group-focus-within:rotate-180 transition-transform duration-300">
                                                        <svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="4"><path d="M19 9l-7 7-7-7" /></svg>
                                                    </div>
                                                </div>
                                            </div>

                                            <div class="space-y-4 italic">
                                                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-4 italic">Module UA</label>
                                                <div class="relative group mt-2">
                                                    <select x-model="selectedUniteId" class="w-full h-14 bg-white border-2 border-primary-500 rounded-full px-8 pr-12 font-black text-slate-900 text-[10px] uppercase tracking-widest italic outline-none focus:ring-8 focus:ring-primary-500/5 transition-all appearance-none cursor-pointer shadow-sm">
                                                        <template x-for="u in allUnites" :key="u.id">
                                                            <option :value="u.id" x-text="u.nom"></option>
                                                        </template>
                                                    </select>
                                                    <div class="absolute inset-y-0 right-6 flex items-center pointer-events-none text-primary-500 group-focus-within:rotate-180 transition-transform duration-300">
                                                        <svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="4"><path d="M19 9l-7 7-7-7" /></svg>
                                                    </div>
                                                </div>
                                            </div>

                                            <div class="space-y-4 italic">
                                                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-4 italic">Cohorte Cible</label>
                                                <div class="relative group mt-2">
                                                    <select x-model="selectedClasseId" class="w-full h-14 bg-white border-2 border-primary-500 rounded-full px-8 pr-12 font-black text-slate-900 text-[10px] uppercase tracking-widest italic outline-none focus:ring-8 focus:ring-primary-500/5 transition-all appearance-none cursor-pointer shadow-sm">
                                                        <template x-for="c in allClasses" :key="c.id">
                                                            <option :value="c.id" x-text="c.nom"></option>
                                                        </template>
                                                    </select>
                                                    <div class="absolute inset-y-0 right-6 flex items-center pointer-events-none text-primary-500 group-focus-within:rotate-180 transition-transform duration-300">
                                                        <svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="4"><path d="M19 9l-7 7-7-7" /></svg>
                                                    </div>
                                                </div>
                                            </div>

                                            <div class="grid grid-cols-2 gap-6">
                                                <div class="space-y-4 italic">
                                                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-4 italic">Durée (min)</label>
                                                    <input type="number" x-model="dureeMinutes" required class="w-full h-14 bg-white border-2 border-slate-100 rounded-full px-6 font-black text-slate-900 text-center text-[11px] focus:border-primary-500 transition-all outline-none italic shadow-sm">
                                                </div>
                                                <div class="space-y-4 italic">
                                                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-4 italic">Réussite (pts)</label>
                                                    <input type="number" x-model="scoreReussite" required step="0.5" class="w-full h-14 bg-white border-2 border-slate-100 rounded-full px-6 font-black text-slate-900 text-center text-[11px] focus:border-primary-500 transition-all outline-none italic shadow-sm">
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div x-show="selectedUniteId" class="bg-white rounded-[3.5rem] border border-slate-100 shadow-premium p-10 space-y-6 italic mt-10">
                                        <div class="flex items-center justify-between pb-6 border-b border-slate-50">
                                            <h3 class="text-xs font-black uppercase tracking-[0.2em] text-slate-900 italic">Compétences</h3>
                                            <span class="text-[10px] font-black text-white bg-slate-900 px-3 py-1.5 rounded-xl shadow-sm" x-text="filteredCompetences.length"></span>
                                        </div>
                                        <div class="flex flex-col gap-3 max-h-[300px] overflow-y-auto pr-2 custom-scrollbar text-left">
                                            <template x-for="comp in filteredCompetences" :key="comp.id">
                                                <label class="relative group cursor-pointer w-full">
                                                    <input type="checkbox" :value="comp.id" :checked="selectedCompetences.includes(comp.id)" @change="toggleCompetence(comp.id)" class="peer hidden">
                                                    <div class="w-full px-6 py-5 bg-slate-50/80 hover:bg-slate-100 rounded-2xl border border-transparent peer-checked:border-primary-500 peer-checked:bg-primary-50/50 transition-all flex items-start gap-4 shadow-sm">
                                                        <div class="shrink-0 size-6 mt-1 rounded-lg flex items-center justify-center border-2 border-slate-300 peer-checked:border-primary-500 peer-checked:bg-primary-500 transition-colors">
                                                            <svg class="size-4 text-white opacity-0 peer-checked:opacity-100 transition-opacity" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="4"><path d="M5 13l4 4L19 7" /></svg>
                                                        </div>
                                                        <div class="flex flex-col">
                                                            <span class="text-[10px] font-black text-slate-400 peer-checked:text-primary-600 transition-colors uppercase tracking-widest italic" x-text="comp.code"></span>
                                                            <span class="text-[11px] font-black text-slate-700 leading-snug mt-1 group-hover:text-slate-900 transition-colors uppercase italic" x-text="comp.libelle"></span>
                                                        </div>
                                                    </div>
                                                </label>
                                            </template>
                                        </div>
                                    </div>
                                </div>

                                <!-- Save Control -->
                                <div class="fixed bottom-10 left-1/2 -translate-x-1/2 z-[100] w-[95%] max-w-5xl italic">
                                    <div class="bg-slate-900/95 backdrop-blur-3xl text-white rounded-[3rem] py-5 px-10 shadow-[0_30px_100px_-20px_rgba(0,0,0,0.5)] flex items-center justify-between border border-white/10 italic uppercase">
                                        <div class="flex items-center gap-8 text-left italic">
                                            <div class="flex flex-col">
                                                <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest leading-none mb-2 italic">État du Barème</span>
                                                <span class="text-3xl font-black italic leading-none uppercase" :class="totalPoints === 20 ? 'text-emerald-400' : 'text-amber-400'" x-text="`${totalPoints} / 20 PTS`"></span>
                                            </div>
                                        </div>
                                        <button type="submit" class="h-16 px-12 bg-primary-500 text-white rounded-[2rem] font-black uppercase tracking-[0.2em] text-[12px] italic hover:bg-primary-400 shadow-2xl shadow-primary-500/30 transition-all flex items-center gap-4 active:scale-95 italic">
                                            <svg class="size-6 italic" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="4"><path d="M5 13l4 4L19 7" /></svg>
                                            Sauvegarder
                                        </button>
                                    </div>
                                </div>
                            </form>

                            <!-- Warning Modal -->
                            <div x-show="showPointsWarning" class="fixed inset-0 z-[200] overflow-y-auto" x-cloak>
                                <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:block sm:p-0">
                                    <div x-show="showPointsWarning" x-transition:enter="ease-out duration-300" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" class="fixed inset-0 transition-opacity bg-slate-900/60 backdrop-blur-sm"></div>
                                    <div x-show="showPointsWarning" x-transition:enter="ease-out duration-300" x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95" x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100" class="inline-block w-full max-w-lg p-12 overflow-hidden text-center align-middle transition-all transform bg-white shadow-premium rounded-[3.5rem] sm:my-8 border border-slate-100 italic">
                                        <div class="size-24 bg-rose-50 rounded-3xl flex items-center justify-center mx-auto mb-10 shadow-sm">
                                            <svg class="size-12 text-rose-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                                                <path d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                            </svg>
                                        </div>
                                        <h3 class="text-3xl font-heading font-black text-slate-900 tracking-tight leading-none uppercase italic mb-4">Total non-conforme</h3>
                                        <p class="text-slate-500 text-[11px] font-black uppercase tracking-widest leading-relaxed mb-10">
                                            La somme actuelle est de <strong class="text-rose-600 text-sm" x-text="totalPoints"></strong> points.<br> 
                                            Le système requiert exactement <span class="font-black text-slate-900 text-sm italic">20 points</span>.
                                        </p>
                                        <div class="grid grid-cols-1 gap-4">
                                            <button @click="showPointsWarning = false; equalizePoints()" type="button" class="h-16 rounded-[2rem] bg-slate-900 text-white font-black uppercase tracking-widest text-xs hover:bg-primary-500 shadow-xl shadow-slate-900/10 transition-all italic">
                                                Équilibrer Automatiquement
                                            </button>
                                            <button @click="showPointsWarning = false; alert('Enregistré quand même (Mockup)')" type="button" class="h-14 rounded-[2rem] bg-white border-2 border-slate-100 font-black text-rose-500 uppercase tracking-widest text-[10px] hover:bg-rose-50 transition-all italic">
                                                Ignorer et Enregistrer
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('qcmBuilder', () => ({
                titre: 'Pattern Strategy / PHP 8',
                statut: 'brouillon',
                showPointsWarning: false,
                dureeMinutes: 30,
                scoreReussite: 10,
                allUnites: [
                    {id: 1, nom: 'Architecture Logicielle'},
                    {id: 2, nom: 'Programmation Orientée Objet'}
                ],
                allClasses: [
                    {id: 1, nom: 'DW_101'},
                    {id: 2, nom: 'DW_102'}
                ],
                selectedUniteId: 1,
                selectedClasseId: 1,
                selectedCompetences: [101],
                
                get filteredCompetences() {
                    return [
                        {id: 101, code: 'C1', libelle: 'Implémenter un design pattern comportemental'},
                        {id: 102, code: 'C2', libelle: 'Comprendre l\'injection de dépendances'}
                    ];
                },

                get totalPoints() {
                    return this.questions.reduce((sum, q) => sum + (parseFloat(q.points) || 0), 0);
                },

                equalizePoints() {
                    const n = this.questions.length;
                    if (n === 0) return;
                    const base = Math.floor(20 / n);
                    const remainder = 20 - base * n;
                    this.questions.forEach((q, i) => {
                        q.points = base + (i === n - 1 ? remainder : 0);
                    });
                },

                toggleCompetence(id) {
                    const idx = this.selectedCompetences.indexOf(id);
                    if (idx > -1) this.selectedCompetences.splice(idx, 1);
                    else this.selectedCompetences.push(id);
                },

                questions: [
                    {
                        texte: 'Quelle interface implémente le pattern Strategy en PHP ?',
                        type: 'choix_unique',
                        points: 20,
                        explication_feedback: 'Le pattern strategy encapsule un comportement dans une interface.',
                        options: [
                            { texte: 'Interface', est_correcte: true, feedback_specifique: 'Bonne réponse' },
                            { texte: 'Abstract Class', est_correcte: false, feedback_specifique: 'Incomplet' }
                        ]
                    }
                ],

                addQuestion() {
                    this.questions.push({
                        texte: '',
                        type: 'choix_unique',
                        points: 0,
                        explication_feedback: '',
                        options: [
                            { texte: '', est_correcte: true, feedback_specifique: '' },
                            { texte: '', est_correcte: false, feedback_specifique: '' }
                        ]
                    });
                    this.equalizePoints();
                },

                removeQuestion(qIndex) {
                    if (this.questions.length > 1) {
                        this.questions.splice(qIndex, 1);
                        this.equalizePoints();
                    }
                },

                addOption(qIndex) {
                    this.questions[qIndex].options.push({ texte: '', est_correcte: false, feedback_specifique: '' });
                },

                removeOption(qIndex, oIndex) {
                    if (this.questions[qIndex].options.length > 2) {
                        this.questions[qIndex].options.splice(oIndex, 1);
                    }
                },

                toggleCorrectOption(qIndex, oIndex) {
                    const q = this.questions[qIndex];
                    if (q.type === 'choix_unique') {
                        q.options.forEach((opt, idx) => {
                            opt.est_correcte = (idx === oIndex);
                        });
                    } else {
                        q.options[oIndex].est_correcte = !q.options[oIndex].est_correcte;
                    }
                },

                handleSubmit() {
                    if (this.totalPoints !== 20) {
                        this.showPointsWarning = true;
                    } else {
                        alert('QCM sauvegardé avec succès ! (Mockup)');
                    }
                }
            }));
        });
    </script>
</body>
</html>
