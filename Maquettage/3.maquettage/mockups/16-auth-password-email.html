<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réinitialisation - SoliQuiz UI</title>
    
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">

    <!-- Tailwind V4 CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom Design System -->
    <link rel="stylesheet" href="../charte-graphique/app.css">
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-6 antialiased font-sans text-left">
    <div class="w-full max-w-[480px] reveal active uppercase">
        <!-- Logo Header -->
        <div class="flex justify-center mb-12 italic">
            <a href="14-public-landing.html" class="flex items-center gap-4 group transition-transform hover:scale-105 active:scale-95 outline-none">
                <div class="size-14 bg-primary-500 rounded-[22px] flex items-center justify-center shadow-2xl shadow-primary-500/30">
                    <svg class="text-white size-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                        <polyline points="14 2 14 8 20 8" />
                        <path d="m9 15 2 2 4-4" />
                    </svg>
                </div>
                <span class="text-4xl font-black tracking-tighter text-slate-900 italic">Soli<span class="text-primary-500">Quiz</span></span>
            </a>
        </div>

        <!-- Reset Card -->
        <div class="bg-white rounded-[3rem] shadow-premium border border-slate-100 overflow-hidden relative">
            <div class="p-10 lg:p-14 relative z-10 italic">
                <div class="text-center mb-12">
                    <div class="size-20 bg-slate-50 rounded-[2rem] flex items-center justify-center mx-auto mb-8 shadow-inner border border-slate-100/50">
                        <svg class="size-10 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
                        </svg>
                    </div>
                    <h1 class="text-3xl font-black text-slate-900 tracking-tight leading-none mb-4 italic uppercase">Mot de passe <span class="text-primary-500">Oublié</span></h1>
                    <p class="text-slate-400 font-black uppercase tracking-[0.3em] text-[9px] italic">Récupération de l'accès</p>
                </div>

                <form class="space-y-8">
                    <div class="space-y-3">
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-[0.25em] ml-4 italic">Email Académique</label>
                        <div class="relative group">
                            <input type="email" class="w-full bg-slate-50 border-2 border-transparent rounded-2xl py-5 px-8 font-black text-slate-900 focus:bg-white focus:border-primary-500 focus:ring-8 focus:ring-primary-500/5 transition-all placeholder:text-slate-200 outline-none italic" placeholder="votre@solicode.co">
                        </div>
                    </div>

                    <button type="submit" class="w-full h-18 inline-flex justify-center items-center gap-x-3 text-[11px] font-black rounded-2xl border border-transparent bg-slate-900 text-white shadow-2xl shadow-slate-900/20 hover:bg-primary-500 active:scale-[0.97] transition-all uppercase tracking-[0.3em] italic">
                        Envoyer le lien
                        <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="4"><path d="M13 7l5 5m0 0l-5 5m5-5H6" /></svg>
                    </button>
                </form>
            </div>

            <div class="bg-slate-50/50 border-t border-slate-50 p-10 text-center italic">
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">
                    Vous vous en souvenez ? 
                    <a href="01-auth-login.html" class="text-primary-500 hover:text-primary-600 ml-2 transition-colors border-b-2 border-primary-500/20">Se connecter</a>
                </p>
            </div>
        </div>
        
        <p class="mt-12 text-center text-[9px] font-black text-slate-300 uppercase tracking-[0.5em] italic">
            © 2026 — SOLIQUIZ ECOSYSTEM
        </p>
    </div>
</body>
</html>
