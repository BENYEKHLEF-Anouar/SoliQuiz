<!DOCTYPE html>
<html lang="fr"
    class="bg-slate-900 border-x border-slate-200 shadow-2xl h-[100dvh] mx-auto w-full max-w-[430px] overflow-hidden">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mockup: Historique</title>
    <!-- Preline Core -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap"
        rel="stylesheet">
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'], heading: ['Outfit', 'sans-serif'] }, colors: { primary: { 50: 'hsl(190, 80%, 95%)', 100: 'hsl(190, 80%, 90%)', 200: 'hsl(190, 80%, 80%)', 300: 'hsl(190, 80%, 70%)', 400: 'hsl(190, 80%, 60%)', 500: 'hsl(190, 80%, 45%)', 600: 'hsl(190, 80%, 35%)', 700: 'hsl(190, 80%, 25%)', 800: 'hsl(190, 80%, 15%)', 900: 'hsl(190, 80%, 5%)' }, semantic: { success: 'hsl(140, 65%, 45%)', error: 'hsl(0, 75%, 55%)', warning: 'hsl(35, 95%, 55%)', info: 'hsl(220, 80%, 55%)' } } } } };</script>
</head>

<body class="bg-slate-50 flex flex-col h-full font-sans overflow-hidden relative">

    <!-- Preline Header Pattern -->
    <header
        class="flex flex-wrap sm:justify-start sm:flex-nowrap w-full bg-white text-sm py-4 dark:bg-neutral-800 z-40 shrink-0 border-b border-slate-200 dark:border-neutral-700 pt-[env(safe-area-inset-top,20px)]">
        <nav class="max-w-[85rem] w-full mx-auto px-4 flex items-center justify-between" aria-label="Global">
            <h1 class="text-xl font-bold text-slate-800 dark:text-white font-heading">Historique</h1>
            <div class="flex items-center gap-x-2">
                <button type="button"
                    class="size-8 inline-flex justify-center items-center gap-x-2 rounded-full border border-transparent bg-primary-100 text-primary-600 hover:bg-primary-200 focus:outline-none focus:bg-primary-200 disabled:opacity-50 disabled:pointer-events-none">
                    <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 3v18h18" />
                        <path d="m19 9-5 5-4-4-3 3" />
                    </svg>
                </button>
            </div>
        </nav>
    </header>

    <main class="flex-1 overflow-y-auto w-full px-4 py-6 pb-24 hide-scrollbar">

        <div class="space-y-6">
            <!-- Section 1 -->
            <div>
                <h2 class="text-xs font-semibold text-slate-500 uppercase tracking-widest mb-3 dark:text-neutral-500">Ce
                    mois-ci</h2>
                <!-- PRELINE LIST GROUP -->
                <ul
                    class="flex flex-col bg-white border border-slate-200 shadow-sm rounded-xl dark:bg-neutral-900 dark:border-neutral-700 divide-y divide-slate-200 dark:divide-neutral-700">
                    <li class="p-4 hover:bg-slate-50 dark:hover:bg-neutral-800 cursor-pointer transition">
                        <div class="flex items-center justify-between">
                            <div>
                                <h3 class="font-bold text-slate-800 dark:text-white text-sm">Fondamentaux PHP</h3>
                                <p class="text-xs text-slate-500 mt-1 dark:text-neutral-500">Il y a 2 heures</p>
                            </div>
                            <!-- Preline Badge Soft -->
                            <span
                                class="inline-flex items-center gap-x-1.5 py-1.5 px-3 rounded-full text-xs font-medium bg-primary-100 text-primary-800 dark:bg-primary-800/30 dark:text-primary-500 font-mono">
                                17/20
                            </span>
                        </div>
                    </li>
                    <li class="p-4 hover:bg-slate-50 dark:hover:bg-neutral-800 cursor-pointer transition">
                        <div class="flex items-center justify-between">
                            <div>
                                <h3 class="font-bold text-slate-800 dark:text-white text-sm">UML Avancé</h3>
                                <p class="text-xs text-slate-500 mt-1 dark:text-neutral-500">12 Fév 2026</p>
                            </div>
                            <!-- Preline Badge Soft -->
                              <span
                                class="inline-flex items-center gap-x-1.5 py-1.5 px-3 rounded-full text-xs font-medium bg-semantic-warning text-primary-800 dark:bg-primary-800/30 dark:text-primary-500 font-mono">
                                10/20
                            </span>
                        </div>
                    </li>
                </ul>
            </div>

            <!-- Section 2 -->
            <div>
                <h2 class="text-xs font-semibold text-slate-500 uppercase tracking-widest mb-3 dark:text-neutral-500">
                    Mois précédent</h2>
                <!-- PRELINE LIST GROUP -->
                <ul
                    class="flex flex-col bg-white border border-slate-200 shadow-sm rounded-xl dark:bg-neutral-900 dark:border-neutral-700 divide-y divide-slate-200 dark:divide-neutral-700">
                    <li class="p-4 hover:bg-slate-50 dark:hover:bg-neutral-800 cursor-pointer transition">
                        <div class="flex items-center justify-between">
                            <div>
                                <h3 class="font-bold text-slate-800 dark:text-white text-sm">Intégration HTML/CSS</h3>
                                <p class="text-xs text-slate-500 mt-1 dark:text-neutral-500">25 Jan 2026</p>
                            </div>
                            <span
                                class="inline-flex items-center gap-x-1.5 py-1.5 px-3 rounded-full text-xs font-medium bg-primary-100 text-primary-800 font-mono">
                                19/20
                            </span>
                        </div>
                    </li>
                    <li class="p-4 hover:bg-slate-50 dark:hover:bg-neutral-800 cursor-pointer transition">
                        <div class="flex items-center justify-between">
                            <div>
                                <h3 class="font-bold text-slate-800 dark:text-white text-sm">Bases JavaScript</h3>
                                <p class="text-xs text-slate-500 mt-1 dark:text-neutral-500">10 Jan 2026</p>
                            </div>
                            <!-- Preline Badge Error -->
                            <span
                                class="inline-flex items-center gap-x-1.5 py-1.5 px-3 rounded-full text-xs font-medium bg-semantic-error/20 text-semantic-error font-mono">
                                07/20
                            </span>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </main>

    <nav
        class="fixed bottom-0 w-full max-w-[430px] mx-auto bg-white border-t border-slate-200 z-50 rounded-b-[2.5rem] dark:bg-neutral-900 dark:border-neutral-800">
        <div class="flex justify-around items-center h-[70px] px-2 pb-[env(safe-area-inset-bottom,20px)]">
            <a href="02-mobile-dashboard.html"
                class="flex flex-col items-center justify-center w-full h-full text-slate-500 gap-1 rounded-xl active:bg-slate-50 transition-colors focus:outline-none dark:text-neutral-400 dark:hover:bg-neutral-800">
                <svg class="shrink-0 size-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="9" />
                    <rect x="14" y="3" width="7" height="5" />
                    <rect x="14" y="12" width="7" height="9" />
                    <rect x="3" y="16" width="7" height="5" />
                </svg>
                <span class="text-[10px] font-medium">Accueil</span>
            </a>
            <a href="05-mobile-history.html"
                class="flex flex-col items-center justify-center w-full h-full text-primary-600 gap-1 rounded-xl bg-slate-50 dark:bg-neutral-800">
                <svg class="shrink-0 size-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10" />
                    <polyline points="12 6 12 12 16 14" />
                </svg>
                <span class="text-[10px] font-bold">Historique</span>
            </a>
            <a href="08-mobile-profile.html"
                class="flex flex-col items-center justify-center w-full h-full text-slate-500 gap-1 rounded-xl hover:bg-slate-50 active:bg-slate-50 transition-colors focus:outline-none dark:text-neutral-400 dark:hover:bg-neutral-800">
                <svg class="size-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                </svg>
                <span class="text-[10px] font-medium">Profil</span>
            </a>
        </div>
    </nav>
    <style>
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
    </style>
</body>

</html>
