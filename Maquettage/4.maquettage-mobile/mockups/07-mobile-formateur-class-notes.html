<!DOCTYPE html>
<html lang="fr" class="bg-slate-900 border-x border-slate-200 shadow-2xl h-[100dvh] mx-auto w-full max-w-[430px] overflow-hidden">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SoliQuiz - Notes & Suivi Formateur</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">

    <!-- Styles -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../charte-graphique/style.css">
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
                        heading: ['Outfit', 'sans-serif']
                    },
                    colors: {
                        primary: {
                            50: 'var(--color-primary-50)',
                            100: 'var(--color-primary-100)',
                            200: 'var(--color-primary-200)',
                            300: 'var(--color-primary-300)',
                            400: 'var(--color-primary-400)',
                            500: 'var(--color-primary-500)',
                            600: 'var(--color-primary-600)',
                            700: 'var(--color-primary-700)',
                            800: 'var(--color-primary-800)',
                            900: 'var(--color-primary-900)'
                        },
                        semantic: {
                            success: 'var(--color-success-500)',
                            error: 'var(--color-error-500)',
                            warning: 'var(--color-warning-500)',
                            info: 'var(--color-info-500)'
                        }
                    }
                }
            }
        };
    </script>
</head>

<body class="bg-slate-50 h-[100dvh] flex flex-col relative overflow-hidden font-sans antialiased text-slate-900 selection:bg-primary-500/30">

<div x-data="classNotes" x-init="init()" class="h-full flex flex-col relative overflow-hidden font-sans">
    
    <!-- Formateur Header (Inlined) -->
    <header class="bg-slate-950 px-5 pt-safe-top pb-4 border-b border-white/5 shadow-2xl shrink-0 sticky top-0 z-40">
        <div class="h-[44px] hidden ios:block"></div>
        <div class="flex justify-between items-center mt-2">
            <div class="flex items-center gap-3">
                <a class="flex items-center gap-2 group outline-none" href="06-mobile-formateur-qcms.html">
                    <div class="size-9 bg-primary-500 rounded-xl flex items-center justify-center shadow-lg shadow-primary-500/30 transition-transform group-hover:scale-110 active:scale-95">
                        <svg class="text-white size-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                            <polyline points="14 2 14 8 20 8" />
                            <path d="m9 15 2 2 4-4" />
                        </svg>
                    </div>
                    <div class="flex flex-col leading-none">
                        <span class="text-xl font-heading font-extrabold text-white tracking-tight">Soli<span class="text-primary-500">Quiz</span></span>
                        <span class="text-[9px] font-black text-slate-500 uppercase tracking-[0.3em] ml-0.5">Formateur</span>
                    </div>
                </a>
            </div>

            <button type="button" class="size-10 rounded-full border border-white/10 bg-white/5 overflow-hidden active:scale-95 transition-transform">
                <img class="w-full h-full object-cover" src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?ixlib=rb-1.2.1&auto=format&fit=facearea&facepad=2&w=256&h=256&q=80" alt="Avatar">
            </button>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto w-full px-5 py-6 pb-24 hide-scrollbar">
        <div class="flex flex-col gap-4 mb-6">
            <h1 class="text-2xl font-heading font-bold tracking-tight text-slate-900">Notes & Suivi</h1>
            
            <div class="hs-dropdown relative inline-flex w-full">
                <button id="hs-dropdown-cohort" type="button" class="hs-dropdown-toggle w-full flex justify-between items-center bg-white border border-slate-200 text-slate-800 rounded-xl py-3 px-4 text-sm font-bold shadow-sm outline-none">
                    <span x-text="selectedCohortId ? cohorts.find(c => c.id == selectedCohortId)?.name : 'Sélectionner une classe'"></span>
                    <svg class="hs-dropdown-open:rotate-180 size-4 transition" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6" /></svg>
                </button>
                <div class="hs-dropdown-menu transition-[opacity,margin] duration hs-dropdown-open:opacity-100 opacity-0 hidden w-full bg-white shadow-lg rounded-xl p-1 mt-2 border border-slate-200 z-[60]" role="menu">
                    <template x-for="cohort in cohorts" :key="cohort.id">
                        <a class="flex items-center gap-x-3 py-2 px-3 rounded-lg text-sm transition-colors text-start outline-none" :class="selectedCohortId == cohort.id ? 'text-primary-600 font-bold bg-primary-50' : 'text-slate-800 hover:bg-slate-100'" href="#" @click.prevent="selectedCohortId = cohort.id">
                            <span x-text="cohort.name"></span>
                        </a>
                    </template>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-10">
            <div class="bg-gradient-to-br from-primary-50 to-white rounded-[2rem] p-6 border border-primary-100/50 shadow-sm relative overflow-hidden group">
                <div class="absolute -top-6 -right-6 size-16 bg-white/50 rounded-full blur-xl group-hover:scale-150 transition-transform duration-1000"></div>
                <span class="text-[9px] font-black text-primary-600 uppercase tracking-[0.2em] block mb-2 relative z-10">Moy. Classe</span>
                <div class="flex items-baseline gap-1 relative z-10">
                    <span class="text-3xl font-heading font-extrabold text-primary-700 leading-none" x-text="classAverage"></span>
                    <span class="text-[10px] font-bold text-primary-300 uppercase italic">/20</span>
                </div>
            </div>
        </div>

        <div class="flex flex-col gap-4 mb-6">
            <div class="relative group">
                <div class="absolute inset-y-0 start-0 flex items-center ps-4 pointer-events-none group-focus-within:text-primary-500 transition-colors">
                    <svg class="shrink-0 size-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" /></svg>
                </div>
                <input type="text" x-model="search" class="py-4 px-4 ps-11 block w-full border-slate-100 bg-white shadow-sm rounded-2xl text-sm font-medium focus:border-primary-500 focus:ring-4 focus:ring-primary-500/5 transition-all outline-none" placeholder="Rechercher un étudiant...">
            </div>
            <div class="flex justify-between items-center">
                <h2 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">LISTE DES APPRENANTS</h2>
            </div>
        </div>

        <div class="grid gap-4">
            <template x-for="student in filteredStudents" :key="student.id">
                <div class="p-5 flex items-center bg-white border border-slate-100 shadow-[0_2px_15px_-3px_rgba(0,0,0,0.03)] rounded-[2rem] cursor-pointer active:scale-[0.98] transition-all hover:border-slate-200 group"
                    :class="student.averageScore < 10 ? 'border-l-4 border-l-semantic-error' : 'border-l-4 border-l-transparent'"
                    @click="selectedStudent = student; HSOverlay.open('#hs-offcanvas-student')">
                    
                    <div class="size-12 rounded-2xl bg-slate-50 flex items-center justify-center border border-slate-100 shrink-0 transition-colors group-hover:bg-primary-50">
                        <img class="size-full rounded-2xl object-cover" 
                            src="https://images.unsplash.com/photo-1568602471122-7832951cc4c5?auto=format&fit=facearea&facepad=2&w=150&h=150&q=80" 
                            alt="Avatar">
                    </div>
                    
                    <div class="ms-4 flex-1">
                        <h3 class="font-extrabold text-slate-900 text-base leading-tight" x-text="student.name"></h3>
                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-tighter mt-1" x-text="student.averageScore < 10 ? 'Suivi prioritaire' : 'Progression normale'"></p>
                    </div>

                    <div class="text-right">
                        <span class="font-heading font-extrabold text-lg px-3 py-1.5 rounded-xl border shadow-sm transition-all"
                            :class="student.averageScore >= 10 ? 'bg-primary-50 text-primary-600 border-primary-100' : 'bg-semantic-error/10 text-semantic-error border-semantic-error/10'"
                            x-text="student.averageScore"></span>
                    </div>
                </div>
            </template>
        </div>
    </main>

    <!-- Student Detail Offcanvas (Inlined) -->
    <div id="hs-offcanvas-student" class="hs-overlay hs-overlay-open:translate-y-0 translate-y-full fixed bottom-0 inset-x-0 transition-all duration-300 transform h-2/3 max-w-[430px] mx-auto w-full z-[80] bg-white border-t border-slate-200 rounded-t-3xl shadow-[0_-10px_40px_rgba(0,0,0,0.1)] hidden" role="dialog" tabindex="-1">
        <div class="flex justify-between items-center py-4 px-5 border-b border-slate-100">
            <div class="flex items-center gap-3">
                <img class="w-10 h-10 rounded-full border border-slate-200" src="https://images.unsplash.com/photo-1568602471122-7832951cc4c5?auto=format&fit=facearea&facepad=2&w=150&h=150&q=80" alt="Avatar">
                <h3 class="font-bold text-slate-900 text-lg" x-text="selectedStudent?.name"></h3>
            </div>
            <button type="button" class="size-8 inline-flex justify-center items-center rounded-full bg-slate-100 text-slate-800" data-hs-overlay="#hs-offcanvas-student">
                <svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
        </div>
        <div class="p-5 overflow-y-auto max-h-full" x-show="selectedStudent">
            <h4 class="text-xs font-bold uppercase tracking-widest mb-3" :class="selectedStudent?.averageScore < 10 ? 'text-semantic-error' : 'text-primary-600'" x-text="selectedStudent?.averageScore < 10 ? 'Risque de décrochage détecté' : 'Progression satisfaisante'"></h4>
            <div class="grid grid-cols-2 gap-3 mb-6">
                <div class="bg-slate-50 rounded-xl p-3 border border-slate-100">
                    <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest block">Dernier QCM</span>
                    <span class="text-lg font-mono font-bold" :class="selectedStudent?.lastQcmScore < 10 ? 'text-semantic-error' : 'text-semantic-success'" x-text="selectedStudent?.lastQcmScore + '/20'"></span>
                </div>
                <div class="bg-slate-50 rounded-xl p-3 border border-slate-100">
                    <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest block">Participation</span>
                    <span class="text-lg font-mono font-bold text-slate-700" x-text="selectedStudent?.participation"></span>
                </div>
            </div>
            <button type="button" class="mt-6 w-full py-3.5 px-4 flex justify-center items-center gap-x-2 text-sm font-bold rounded-xl bg-slate-900 text-white shadow-md">Envoyer un message de soutien</button>
        </div>
    </div>

    <!-- Formateur Bottom Nav (Inlined) -->
    <nav class="fixed bottom-0 w-full max-w-[430px] bg-slate-950 border-t border-white/5 z-50">
        <div class="flex justify-around items-center h-[72px] px-4 pb-safe">
            <a href="06-mobile-formateur-qcms.html" class="flex flex-col items-center justify-center text-slate-500 gap-1.5 transition-colors">
                <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <rect x="3" y="3" width="7" height="9" /><rect x="14" y="3" width="7" height="5" /><rect x="14" y="12" width="7" height="9" /><rect x="3" y="16" width="7" height="5" />
                </svg>
                <span class="text-[10px] font-bold uppercase tracking-widest leading-none">QCMs</span>
            </a>
            <a href="07-mobile-formateur-class-notes.html" class="flex flex-col items-center justify-center text-primary-500 gap-1.5 transition-colors">
                <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                </svg>
                <span class="text-[10px] font-bold uppercase tracking-widest leading-none">Notes</span>
            </a>
            <a href="09-mobile-formateur-profile.html" class="flex flex-col items-center justify-center text-slate-500 gap-1.5 transition-colors">
                <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
                <span class="text-[10px] font-bold uppercase tracking-widest leading-none">Profil</span>
            </a>
        </div>
    </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.js"></script>
<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('classNotes', () => ({
            cohorts: [{ id: 1, name: 'DW_102' }, { id: 2, name: 'CDA_101' }],
            selectedCohortId: 1,
            students: [
                { id: 1, name: 'Mehdi Tazi', averageScore: 17.5, lastQcmScore: 18, participation: 'Excellente' },
                { id: 2, name: 'Karim Tazi', averageScore: 8.5, lastQcmScore: 7, participation: 'Faible' }
            ],
            selectedStudent: null,
            loading: true,
            search: '',
            get filteredStudents() {
                if (!this.search) return this.students;
                return this.students.filter(s => s.name.toLowerCase().includes(this.search.toLowerCase()));
            },
            get classAverage() {
                if (this.students.length === 0) return 0;
                return (this.students.reduce((acc, s) => acc + s.averageScore, 0) / this.students.length).toFixed(1);
            },
            async init() {
                setTimeout(() => { this.loading = false; }, 800);
            }
        }));
    });
</script>

<style>
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
    .pt-safe-top { padding-top: env(safe-area-inset-top, 0px); }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
</style>

</body>
</html>
