<!DOCTYPE html>
<html lang="fr" class="bg-slate-900 border-x border-slate-200 shadow-2xl h-full mx-auto w-full max-w-[430px]">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mockup: Login Form</title>
    <!-- Preline Core & Tailwind -->
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.js"></script>
    <link rel="stylesheet" href="../charte-graphique/style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Outfit', 'sans-serif']
                    },
                    colors: {
                        primary: {
                            50: 'var(--color-primary-50)',
                            100: 'var(--color-primary-100)',
                            200: 'var(--color-primary-200)',
                            300: 'var(--color-primary-300)',
                            400: 'var(--color-primary-400)',
                            500: 'var(--color-primary-500)',
                            600: 'var(--color-primary-600)',
                            700: 'var(--color-primary-700)',
                            800: 'var(--color-primary-800)',
                            900: 'var(--color-primary-900)'

                        semantic: {
                            success: 'var(--color-success-500)',
                            error: 'var(--color-error-500)',
                            warning: 'var(--color-warning-500)',
                            info: 'var(--color-info-500)'
                        }

<body class="bg-slate-50 h-full flex flex-col relative overflow-hidden">

    <div class="h-[44px] w-full shrink-0"></div> <!-- iOS Safe Area -->

    <main class="w-full max-w-md mx-auto p-6 flex flex-col justify-center flex-1">
        <div

            <div class="p-4 sm:p-7">
                <div class="text-center">
                    <div
                        class="size-16 bg-primary-500 rounded-2xl flex items-center justify-center shadow-lg shadow-primary-500/20 transition-transform mx-auto mb-4">
                        <svg class="text-white size-8" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                            stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                            <polyline points="14 2 14 8 20 8" />
                            <path d="m9 15 2 2 4-4" />
                        </svg>
                    </div>
                    <h1 class="text-3xl font-heading font-bold text-slate-900 tracking-tight">Soli<span
                            class="text-primary-500">Quiz</span></h1>
                    <p class="mt-2 text-sm text-slate-500 font-medium">
                        Connectez-vous pour commencer.
                    </p>
                </div>

                <div class="mt-8">
                    <!-- PRELINE FORM PATTERN -->
                    <form>
                        <div class="grid gap-y-4">
                            <!-- Input Email Preline -->
                            <div>
                                <label for="email" class="block text-sm mb-2 dark:text-white font-medium">Email
                                    Solicode</label>
                                <div class="relative">
                                    <input type="email" id="email" name="email"
                                        class="py-4 px-5 block w-full border-slate-200 rounded-2xl text-sm focus:border-primary-500 focus:ring-primary-500 transition-all outline-none"
                                        placeholder="prenom@solicode.co" required>
                                </div>
                            </div>

                            <!-- Input Password Preline -->
                            <div>
                                <div class="flex justify-between items-center">
                                    <label for="password"
                                        class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2 italic">Mot
                                        de
                                        passe</label>
                                    <a class="text-xs text-primary-600 font-bold uppercase tracking-wider mb-2"
                                        href="#">Oublié ?</a>
                                </div>
                                <div class="relative">
                                    <input type="password" id="password" name="password"
                                        class="py-4 px-5 block w-full border-slate-200 rounded-2xl text-sm focus:border-primary-500 focus:ring-primary-500 transition-all outline-none"
                                        placeholder="••••••••" required>
                                </div>
                            </div>

                            <!-- Checkbox Preline -->
                            <div class="flex items-center">
                                <div class="flex">
                                    <input id="remember-me" name="remember-me" type="checkbox"
                                        class="shrink-0 mt-0.5 border-slate-200 rounded text-primary-600 focus:ring-primary-500 dark:bg-neutral-800 dark:border-neutral-700 dark:checked:bg-primary-500 dark:checked:border-primary-500 dark:focus:ring-offset-slate-800">
                                </div>
                                <div class="ms-3">
                                    <label for="remember-me" class="text-sm dark:text-white">Se souvenir de moi</label>
                                </div>
                            </div>

                            <!-- Role Selector -->
                            <!-- <div class="p-1.5 inline-flex bg-slate-100 rounded-2xl mb-2">
                                <button type="button" id="role-student"
                                    class="py-2.5 px-6 inline-flex items-center gap-x-2 text-xs font-black rounded-xl border border-transparent bg-white text-slate-900 shadow-sm active:scale-95 transition-all">
                                    ÉTUDIANT
                                </button>
                                <button type="button" id="role-trainer"
                                    class="py-2.5 px-6 inline-flex items-center gap-x-2 text-xs font-bold rounded-xl border border-transparent text-slate-500 hover:text-slate-700 active:scale-95 transition-all uppercase tracking-widest">
                                    FORMATEUR
                                </button>
                            </div> -->

                            <script>
                                window.loginRole = 'student';
                                const sBtn = document.getElementById('role-student');
                                const tBtn = document.getElementById('role-trainer');
                                sBtn.onclick = () => {
                                    window.loginRole = 'student';
                                    sBtn.className = 'py-2.5 px-6 inline-flex items-center gap-x-2 text-xs font-black rounded-xl border border-transparent bg-white text-slate-900 shadow-sm active:scale-95 transition-all';
                                    tBtn.className = 'py-2.5 px-6 inline-flex items-center gap-x-2 text-xs font-bold rounded-xl border border-transparent text-slate-500 hover:text-slate-700 active:scale-95 transition-all uppercase tracking-widest';
                                };
                                tBtn.onclick = () => {
                                    window.loginRole = 'trainer';
                                    tBtn.className = 'py-2.5 px-6 inline-flex items-center gap-x-2 text-xs font-black rounded-xl border border-transparent bg-white text-slate-900 shadow-sm active:scale-95 transition-all';
                                    sBtn.className = 'py-2.5 px-6 inline-flex items-center gap-x-2 text-xs font-bold rounded-xl border border-transparent text-slate-500 hover:text-slate-700 active:scale-95 transition-all uppercase tracking-widest';
                                };
                            </script>

                            <!-- Button Preline Solid -->
                            <button type="submit"
                                class="w-full py-4 px-4 inline-flex justify-center items-center gap-x-2 text-xs font-black rounded-2xl border border-transparent bg-primary-500 text-white hover:bg-primary-600 shadow-xl shadow-primary-500/30 active:scale-[0.98] transition-all uppercase tracking-widest">
                                Connexion
                            </button>

                            <!-- Button Preline Outline -->
                            <!-- <button type="button"
                                class="w-full py-3 px-4 inline-flex justify-center items-center gap-x-2 text-sm font-medium rounded-lg border border-slate-200 bg-white text-slate-800 shadow-sm hover:bg-slate-50 disabled:opacity-50 disabled:pointer-events-none dark:bg-neutral-900 dark:border-neutral-700 dark:text-white dark:hover:bg-neutral-800">
                                <svg class="w-4 h-auto" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path
                                        d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4" />
                                    <path d="M9 18c-4.51 2-5-2-7-2" />
                                </svg>
                                Connexion via GitHub
                            </button> -->
                        </div>
                    </form>
                    <!-- END PRELINE FORM -->
                </div>
            </div>
        </div>
    </main>

    <!-- Interactions JS App Mobile -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.querySelector('form');
            if (form) {
                form.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const email = document.getElementById('email').value.toLowerCase();

                    if (email.includes('formateur')) {
                        window.location.href = '06-mobile-formateur-qcms.html';
                    } else {
                        window.location.href = '02-mobile-dashboard.html'; // Default to student on mobile
                    }
                });
            }
        });
    </script>
</body>

</html>
