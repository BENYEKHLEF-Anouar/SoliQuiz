<!DOCTYPE html>
<html lang="fr" class="bg-slate-900 border-x border-slate-200 shadow-2xl h-[100dvh] mx-auto w-full max-w-[430px] overflow-hidden">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SoliQuiz - Profil Formateur</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">

    <!-- Styles -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../charte-graphique/style.css">
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
                        heading: ['Outfit', 'sans-serif']
                    },
                    colors: {
                        primary: {
                            50: 'var(--color-primary-50)',
                            100: 'var(--color-primary-100)',
                            200: 'var(--color-primary-200)',
                            300: 'var(--color-primary-300)',
                            400: 'var(--color-primary-400)',
                            500: 'var(--color-primary-500)',
                            600: 'var(--color-primary-600)',
                            700: 'var(--color-primary-700)',
                            800: 'var(--color-primary-800)',
                            900: 'var(--color-primary-900)'
                        },
                        semantic: {
                            success: 'var(--color-success-500)',
                            error: 'var(--color-error-500)',
                            warning: 'var(--color-warning-500)',
                            info: 'var(--color-info-500)'
                        }
                    }
                }
            }
        };
    </script>
</head>

<body class="bg-slate-50 h-[100dvh] flex flex-col relative overflow-hidden font-sans antialiased text-slate-900 selection:bg-primary-500/30">

<div x-data="formateurProfile" x-init="init()" class="h-full flex flex-col relative overflow-hidden font-sans">
    
    <!-- Formateur Header (Inlined) -->
    <header class="bg-slate-950 px-5 pt-safe-top pb-4 border-b border-white/5 shadow-2xl shrink-0 sticky top-0 z-40">
        <div class="h-[44px] hidden ios:block"></div>
        <div class="flex justify-between items-center mt-2">
            <div class="flex items-center gap-3">
                <a class="flex items-center gap-2 group outline-none" href="06-mobile-formateur-qcms.html">
                    <div class="size-9 bg-primary-500 rounded-xl flex items-center justify-center shadow-lg shadow-primary-500/30 transition-transform group-hover:scale-110 active:scale-95">
                        <svg class="text-white size-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                            <polyline points="14 2 14 8 20 8" />
                            <path d="m9 15 2 2 4-4" />
                        </svg>
                    </div>
                    <div class="flex flex-col leading-none">
                        <span class="text-xl font-heading font-extrabold text-white tracking-tight">Soli<span class="text-primary-500">Quiz</span></span>
                        <span class="text-[9px] font-black text-slate-500 uppercase tracking-[0.3em] ml-0.5">Formateur</span>
                    </div>
                </a>
            </div>

            <button type="button" class="size-10 rounded-full border border-white/10 bg-white/5 overflow-hidden active:scale-95 transition-transform">
                <img class="w-full h-full object-cover" src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?ixlib=rb-1.2.1&auto=format&fit=facearea&facepad=2&w=256&h=256&q=80" alt="Avatar">
            </button>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto px-5 py-8 hide-scrollbar pb-24 text-slate-800 relative">
        <!-- Global Loading State -->
        <div x-show="loading" 
             x-transition:leave="transition ease-in duration-500"
             x-transition:leave-start="opacity-100"
             x-transition:leave-end="opacity-0"
             class="absolute inset-0 z-50 bg-slate-50 flex items-center justify-center">
            <div class="flex flex-col items-center gap-4">
                <div class="relative size-16">
                    <div class="absolute inset-0 border-4 border-primary-500/10 rounded-full"></div>
                    <div class="absolute inset-0 border-4 border-primary-500 border-t-transparent rounded-full animate-spin"></div>
                </div>
                <p class="text-[10px] font-black uppercase tracking-[0.3em] text-slate-400">Chargement du profil...</p>
            </div>
        </div>

        <div x-show="!loading" 
             style="display: none;"
             x-transition:enter="transition ease-out duration-700 delay-300"
             x-transition:enter-start="opacity-0 translate-y-4"
             x-transition:enter-end="opacity-100 translate-y-0">
            
            <!-- Profile Card -->
            <div class="flex flex-col items-center mb-10 text-slate-800">
                <div class="relative group">
                    <div class="absolute inset-0 bg-slate-900 rounded-full blur-2xl opacity-10 group-hover:opacity-20 transition-opacity"></div>
                    <img class="relative inline-block size-28 rounded-full border-4 border-white shadow-xl object-cover transition-transform group-hover:scale-105" 
                        src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?ixlib=rb-1.2.1&auto=format&fit=facearea&facepad=2&w=256&h=256&q=80" 
                        alt="Avatar">
                    <button class="absolute bottom-1 right-1 bg-slate-950 text-white p-2.5 rounded-2xl shadow-xl border-2 border-white active:scale-90 transition-all outline-none">
                        <svg class="size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
                        </svg>
                    </button>
                </div>
                <h2 class="mt-6 text-2xl font-heading font-extrabold text-slate-900 tracking-tight leading-none" x-text="profile.prenom + ' ' + profile.nom"></h2>
                <p class="text-[10px] font-black text-primary-600 mt-2 uppercase tracking-[0.25em]">Formateur Référent</p>
            </div>

            <!-- Info List -->
            <div class="space-y-5 px-1">
                <div class="bg-white border border-slate-100 rounded-[2.5rem] p-8 shadow-[0_8px_30px_-4px_rgba(0,0,0,0.04)]">
                    <div class="flex flex-col gap-6">
                        <div class="flex items-center gap-4">
                            <div class="size-11 bg-slate-50 rounded-2xl flex items-center justify-center text-slate-400">
                                <svg class="size-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                                    <polyline points="22,6 12,13 2,6" />
                                </svg>
                            </div>
                            <div class="min-w-0">
                                <p class="text-[9px] font-black text-slate-300 uppercase tracking-[0.2em] mb-1">Email Professionnel</p>
                                <p class="text-sm font-extrabold text-slate-900 truncate" x-text="profile.email"></p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Logout Button -->
                <a href="00-mobile-landing.html"
                    class="w-full h-16 inline-flex justify-center items-center gap-x-2 text-[10px] font-black uppercase tracking-[0.25em] rounded-2xl border-2 border-slate-100 bg-white text-slate-900 hover:bg-slate-950 hover:text-white hover:border-slate-950 transition-all active:scale-[0.98]">
                    Déconnexion
                    <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="3">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                        <polyline points="16 17 21 12 16 7" />
                        <line x1="21" y1="12" x2="9" y2="12" />
                    </svg>
                </a>
                
                <p class="text-center text-[9px] font-black text-slate-200 uppercase tracking-[0.4em] pt-12 leading-loose">
                    SoliQuiz Formateur v1.0<br/> <span class="text-slate-100">© 2026 Solicode Team</span>
                </p>
            </div>
        </div>
    </main>

    <!-- Formateur Bottom Nav (Inlined) -->
    <nav class="fixed bottom-0 w-full max-w-[430px] bg-slate-950 border-t border-white/5 z-50">
        <div class="flex justify-around items-center h-[72px] px-4 pb-safe">
            <a href="06-mobile-formateur-qcms.html" class="flex flex-col items-center justify-center text-slate-500 gap-1.5 transition-colors">
                <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <rect x="3" y="3" width="7" height="9" /><rect x="14" y="3" width="7" height="5" /><rect x="14" y="12" width="7" height="9" /><rect x="3" y="16" width="7" height="5" />
                </svg>
                <span class="text-[10px] font-bold uppercase tracking-widest leading-none">QCMs</span>
            </a>
            <a href="07-mobile-formateur-class-notes.html" class="flex flex-col items-center justify-center text-slate-500 gap-1.5 transition-colors">
                <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                </svg>
                <span class="text-[10px] font-bold uppercase tracking-widest leading-none">Notes</span>
            </a>
            <a href="09-mobile-formateur-profile.html" class="flex flex-col items-center justify-center text-primary-500 gap-1.5 transition-colors">
                <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
                <span class="text-[10px] font-bold uppercase tracking-widest leading-none">Profil</span>
            </a>
        </div>
    </nav>
</div>

<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('formateurProfile', () => ({
            profile: { nom: 'Benyekhlef', prenom: 'Anouar', email: 'a.benyekhlef@solicode.co' },
            loading: true,
            async init() {
                setTimeout(() => { this.loading = false; }, 800);
            }
        }));
    });
</script>

<style>
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
    .pt-safe-top { padding-top: env(safe-area-inset-top, 0px); }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
</style>

</body>
</html>
