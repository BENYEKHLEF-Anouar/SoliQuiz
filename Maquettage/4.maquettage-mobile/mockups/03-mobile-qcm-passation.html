<!DOCTYPE html>
<html lang="fr"
    class="bg-slate-900 border-x border-slate-200 shadow-2xl h-[100dvh] mx-auto w-full max-w-[430px] overflow-hidden">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mockup: QCM Passation</title>
    <!-- Preline Core -->
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap"
        rel="stylesheet">
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'], heading: ['Outfit', 'sans-serif'] }, colors: { primary: { 50: 'hsl(190, 80%, 95%)', 100: 'hsl(190, 80%, 90%)', 200: 'hsl(190, 80%, 80%)', 300: 'hsl(190, 80%, 70%)', 400: 'hsl(190, 80%, 60%)', 500: 'hsl(190, 80%, 45%)', 600: 'hsl(190, 80%, 35%)', 700: 'hsl(190, 80%, 25%)', 800: 'hsl(190, 80%, 15%)', 900: 'hsl(190, 80%, 5%)' }, semantic: { success: 'hsl(140, 65%, 45%)', error: 'hsl(0, 75%, 55%)', warning: 'hsl(35, 95%, 55%)', info: 'hsl(220, 80%, 55%)' } } } } };</script>
</head>

<body class="bg-slate-50 h-[100dvh] flex flex-col relative overflow-hidden font-sans">

    <!-- Preline Header Pattern -->
    <header
        class="flex flex-wrap sm:justify-start sm:flex-nowrap w-full bg-white text-sm py-4 dark:bg-neutral-800 z-40 shrink-0 border-b border-slate-200 dark:border-neutral-700">
        <nav class="max-w-[85rem] w-full mx-auto px-4 flex items-center justify-between" aria-label="Global">
            <div class="flex items-center gap-x-2">
                <span
                    class="inline-flex items-center justify-center size-8 rounded-full bg-slate-800 text-white text-xs font-semibold leading-none dark:bg-white dark:text-slate-800">
                    4
                </span>
                <span class="text-xs font-semibold text-slate-500 uppercase tracking-widest dark:text-neutral-500">/
                    20</span>
            </div>
            <div class="flex items-center gap-x-2">
                <!-- Preline Soft Badge Pattern -->
                <span
                    class="inline-flex items-center gap-x-1.5 py-1.5 px-3 rounded-full text-xs font-medium bg-semantic-error/20 text-semantic-error dark:bg-semantic-error/30 dark:text-semantic-error">
                    <svg class="size-3 animate-pulse" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10" />
                        <polyline points="12 6 12 12 16 14" />
                    </svg>
                    03:45
                </span>
                <a href="02-mobile-dashboard.html"
                    class="size-8 inline-flex items-center justify-center rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200 focus:outline-none transition-colors ml-1">
                    <svg class="size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 6 6 18" />
                        <path d="m6 6 12 12" />
                    </svg>
                </a>
            </div>
        </nav>
    </header>

    <!-- Preline Progress Bar -->
    <div class="w-full h-1.5 bg-slate-200 dark:bg-neutral-700 shrink-0">
        <div class="h-1.5 bg-primary-600 dark:bg-primary-500 transition-all duration-500" style="width: 20%"></div>
    </div>

    <!-- Main Workspace -->
    <main class="flex-1 overflow-y-auto w-full px-4 py-8 hide-scrollbar">
        <h1 class="text-xl sm:text-2xl font-bold text-slate-800 dark:text-white leading-snug mb-8 font-heading">
            Parmi les propositions suivantes, laquelle crée un commentaire sur plusieurs lignes en PHP ?
        </h1>

        <!-- PRELINE ADVANCED RADIO BUTTONS -->
        <div class="grid space-y-3 pb-24">
            <!-- Option 1 -->
            <label for="hs-radio-in-form-1"
                class="flex p-4 w-full bg-white border border-slate-200 rounded-xl text-sm focus:border-primary-500 focus:ring-primary-500 dark:bg-neutral-900 dark:border-neutral-700 dark:text-neutral-400 cursor-pointer hover:bg-slate-50 active:scale-[0.98] transition-all has-[:checked]:border-primary-600 has-[:checked]:bg-primary-50/50">
                <input type="radio" name="hs-radio-in-form"
                    class="shrink-0 mt-0.5 border-slate-300 rounded-full text-primary-600 focus:ring-primary-500 disabled:opacity-50 disabled:pointer-events-none dark:bg-neutral-800 dark:border-neutral-500 dark:checked:bg-primary-500 dark:checked:border-primary-500 dark:focus:ring-offset-slate-800"
                    id="hs-radio-in-form-1">
                <span class="text-sm text-slate-800 ms-3 dark:text-neutral-300 font-medium font-mono text-base">// Ceci
                    est un commentaire //</span>
            </label>

            <!-- Option 2 (Checked) -->
            <label for="hs-radio-in-form-2"
                class="flex p-4 w-full bg-primary-50/80 border-2 border-primary-600 rounded-xl text-sm cursor-pointer shadow-sm active:scale-[0.98] transition-all">
                <input type="radio" name="hs-radio-in-form"
                    class="shrink-0 mt-0.5 border-slate-300 rounded-full text-primary-600 focus:ring-primary-500 disabled:opacity-50 disabled:pointer-events-none"
                    id="hs-radio-in-form-2" checked>
                <span class="text-sm text-primary-800 ms-3 font-bold font-mono text-base">/* Ceci est un commentaire
                    */</span>
            </label>

            <!-- Option 3 -->
            <label for="hs-radio-in-form-3"
                class="flex p-4 w-full bg-white border border-slate-200 rounded-xl text-sm focus:border-primary-500 focus:ring-primary-500 dark:bg-neutral-900 dark:border-neutral-700 dark:text-neutral-400 cursor-pointer hover:bg-slate-50 active:scale-[0.98] transition-all has-[:checked]:border-primary-600 has-[:checked]:bg-primary-50">
                <input type="radio" name="hs-radio-in-form"
                    class="shrink-0 mt-0.5 border-slate-300 rounded-full text-primary-600 focus:ring-primary-500 disabled:opacity-50 disabled:pointer-events-none"
                    id="hs-radio-in-form-3">
                <span class="text-sm text-slate-800 ms-3 dark:text-neutral-300 font-medium font-mono text-base">&lt;!--
                    Comm --&gt;</span>
            </label>
        </div>
    </main>

    <!-- Preline Bottom Sticky Footer -->
    <div
        class="fixed inset-x-0 bottom-8 z-50 bg-white border-t border-slate-200 dark:bg-neutral-900 dark:border-neutral-800 max-w-[430px] mx-auto rounded-b-[2.5rem]">
        <div class="p-4 flex gap-3 items-center justify-between pb-[env(safe-area-inset-bottom,20px)]">
            <!-- Preline Secondary Icon Button -->
            <button type="button"
                class="py-3 px-4 inline-flex justify-center items-center gap-x-2 text-sm font-semibold rounded-lg border border-slate-200 text-slate-500 hover:border-primary-600 hover:text-primary-600 disabled:opacity-50 disabled:pointer-events-none dark:border-neutral-700 dark:text-neutral-400 dark:hover:text-semantic-info dark:hover:border-semantic-info">
                <svg class="shrink-0 size-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m15 18-6-6 6-6" />
                </svg>
            </button>

            <!-- Preline Primary Button -->
            <button type="button"
                class="w-full py-3 px-4 inline-flex justify-center items-center gap-x-2 text-sm font-semibold rounded-lg border border-transparent bg-primary-600 text-white hover:bg-primary-700 disabled:opacity-50 disabled:pointer-events-none">
                Question Suivante
                <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m9 18 6-6-6-6" />
                </svg>
            </button>
        </div>
    </div>

    <style>
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
    </style>
    <!-- Interactions Basiques JS -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const labels = document.querySelectorAll('.grid.space-y-3 label');
            const radios = document.querySelectorAll('input[type="radio"][name="hs-radio-in-form"]');

            radios.forEach(radio => {
                radio.addEventListener('change', (e) => {
                    // Reset all labels
                    labels.forEach(label => {
                        label.className = "flex p-4 w-full bg-white border border-slate-200 rounded-xl text-sm focus:border-primary-500 focus:ring-primary-500 cursor-pointer hover:bg-slate-50 active:scale-[0.98] transition-all";
                        const span = label.querySelector('span.text-sm');
                        if (span) {
                            span.classList.remove('text-primary-800', 'font-bold');
                            span.classList.add('text-slate-800', 'font-medium');
                        }
                    });

                    // Set active label
                    if (e.target.checked) {
                        const activeLabel = e.target.closest('label');
                        activeLabel.className = "flex p-4 w-full bg-primary-50/80 border-2 border-primary-600 rounded-xl text-sm cursor-pointer shadow-sm active:scale-[0.98] transition-all";
                        const span = activeLabel.querySelector('span.text-sm');
                        if (span) {
                            span.classList.remove('text-slate-800', 'font-medium');
                            span.classList.add('text-primary-800', 'font-bold');
                        }
                    }
                });
            });

            // Simulate Timer
            const timerEl = document.querySelector('.animate-pulse').nextSibling;
            const timerContainer = timerEl.parentElement;
            if (timerContainer) {
                // Get the text node containing the time
                const textNodes = Array.from(timerContainer.childNodes).filter(node => node.nodeType === 3 && node.textContent.trim().includes(':'));
                if (textNodes.length > 0) {
                    let timeParts = textNodes[0].textContent.trim().split(':');
                    let minutes = parseInt(timeParts[0]);
                    let seconds = parseInt(timeParts[1]);

                    setInterval(() => {
                        if (seconds === 0) {
                            if (minutes === 0) return;
                            minutes--;
                            seconds = 59;
                        } else {
                            seconds--;
                        }
                        textNodes[0].textContent = ` ${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                    }, 1000);
                }
            }
        });
    </script>
</body>

</html>
