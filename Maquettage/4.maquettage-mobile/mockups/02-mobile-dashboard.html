<!DOCTYPE html>
<html lang="fr" class="bg-slate-900 border-x border-slate-200 shadow-2xl h-[100dvh] mx-auto w-full max-w-[430px]">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SoliQuiz - Dashboard Mobile</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">

    <!-- Styles -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../charte-graphique/style.css">
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
                        heading: ['Outfit', 'sans-serif']
                    },
                    colors: {
                        primary: {
                            50: 'var(--color-primary-50)',
                            100: 'var(--color-primary-100)',
                            200: 'var(--color-primary-200)',
                            300: 'var(--color-primary-300)',
                            400: 'var(--color-primary-400)',
                            500: 'var(--color-primary-500)',
                            600: 'var(--color-primary-600)',
                            700: 'var(--color-primary-700)',
                            800: 'var(--color-primary-800)',
                            900: 'var(--color-primary-900)'
                        },
                        semantic: {
                            success: 'var(--color-success-500)',
                            error: 'var(--color-error-500)',
                            warning: 'var(--color-warning-500)',
                            info: 'var(--color-info-500)'
                        }
                    }
                }
            }
        };
    </script>
</head>

<body class="bg-slate-50 h-[100dvh] flex flex-col relative overflow-hidden font-sans antialiased text-slate-900 selection:bg-primary-500/30">

<div x-data="dashboard" x-init="init()" class="h-full flex flex-col relative overflow-hidden font-sans">
    
    <!-- Header Component (Inlined) -->
    <header class="bg-white/80 backdrop-blur-md px-5 pt-safe-top pb-4 border-b border-slate-100 shadow-[0_1px_3px_rgba(0,0,0,0.02)] shrink-0 sticky top-0 z-40">
        <div class="h-[44px] hidden ios:block"></div>
        <div class="flex justify-between items-center mt-2">
            <div class="flex items-center gap-3">
                <a class="flex items-center gap-2 group outline-none" href="02-mobile-dashboard.html" aria-label="SoliQuiz Accueil">
                    <div class="size-9 bg-primary-500 rounded-xl flex items-center justify-center shadow-lg shadow-primary-500/20 transition-transform group-hover:scale-110 active:scale-95">
                        <svg class="text-white size-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                            <polyline points="14 2 14 8 20 8" />
                            <path d="m9 15 2 2 4-4" />
                        </svg>
                    </div>
                    <div class="flex flex-col leading-none">
                        <span class="text-xl font-heading font-bold text-slate-900 tracking-tight">Soli<span class="text-primary-500">Quiz</span></span>
                        <span class="text-[10px] font-black text-slate-400 uppercase tracking-[0.3em] ml-0.5">Apprenant</span>
                    </div>
                </a>
            </div>

            <!-- Profile Dropdown (Mocked with Preline logic) -->
            <div class="hs-dropdown relative inline-flex">
                <button id="hs-dropdown-profile" type="button" class="hs-dropdown-toggle w-10 h-10 rounded-full border border-slate-200 bg-white shadow-sm overflow-hidden active:scale-95 transition-transform focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2" data-hs-overlay="#hs-offcanvas-notifications">
                    <img class="w-full h-full object-cover" src="https://images.unsplash.com/photo-1568602471122-7832951cc4c5?ixlib=rb-4.0.3&auto=format&fit=facearea&facepad=2&w=300&h=300&q=80" alt="Avatar">
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto w-full hide-scrollbar pb-24 relative">
        <!-- Global Loading State -->
        <div x-show="loading" 
             x-transition:leave="transition ease-in duration-500"
             x-transition:leave-start="opacity-100"
             x-transition:leave-end="opacity-0"
             class="absolute inset-0 z-50 bg-slate-50 flex items-center justify-center">
            <!-- Loader Component (Inlined) -->
            <div class="flex flex-col items-center gap-4 animate-in fade-in zoom-in duration-500">
                <div class="relative size-16">
                    <div class="absolute inset-0 border-4 border-primary-500/10 rounded-full"></div>
                    <div class="absolute inset-0 border-4 border-primary-500 border-t-transparent rounded-full animate-spin"></div>
                    <div class="absolute inset-4 bg-primary-500/20 rounded-full animate-pulse"></div>
                </div>
                <div class="flex flex-col items-center">
                    <p class="text-[10px] font-black uppercase tracking-[0.3em] text-slate-400 animate-pulse" x-text="'Synchronisation en cours...'"></p>
                </div>
            </div>
        </div>

        <div x-show="!loading" 
             style="display: none;"
             x-transition:enter="transition ease-out duration-700 delay-300"
             x-transition:enter-start="opacity-0 translate-y-4"
             x-transition:enter-end="opacity-100 translate-y-0">
            
            <!-- Premium Greeting Section -->
            <div class="px-5 pt-8 pb-10 relative overflow-hidden group">
                <div class="absolute -top-10 -right-10 size-40 bg-primary-100/50 rounded-full blur-3xl transition-transform group-hover:scale-110 duration-1000"></div>
                
                <div class="relative">
                    <div class="inline-flex items-center gap-x-1.5 py-1.5 px-3.5 rounded-full bg-primary-50 text-primary-600 border border-primary-100/50 mb-5 relative z-10 transition-all hover:bg-primary-100">
                        <span class="size-1.5 rounded-full bg-primary-500 animate-pulse"></span>
                        <span class="text-[9px] font-black uppercase tracking-[0.2em]" x-text="'Promotion ' + (profile.cohort || 'DW_102')"></span>
                    </div>
                    <h2 class="text-4xl font-heading font-extrabold text-slate-900 tracking-tighter leading-[0.95] mb-3">
                        Bonjour, <br/>
                        <span class="text-transparent bg-clip-text bg-gradient-to-r from-primary-600 to-primary-400" x-text="profile.prenom || 'Apprenant'"></span>
                    </h2>
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">C'est le moment de briller.</p>
                </div>
            </div>

            <!-- Stats Grid Partial (Inlined) -->
            <div class="-mt-8">
                <section class="px-5 mt-6 grid grid-cols-2 gap-4">
                    <div class="bg-white border border-slate-100 rounded-[2rem] p-5 shadow-[0_4px_20px_-4px_rgba(0,0,0,0.03)] group transition-all hover:border-primary-100">
                        <span class="text-[9px] font-black text-slate-400 uppercase tracking-[0.2em] block mb-2">Score Global</span>
                        <div class="flex items-baseline gap-1">
                            <span class="text-3xl font-heading font-extrabold text-primary-500 leading-none" x-text="scores.globalScore || 0"></span>
                            <span class="text-[10px] font-bold text-primary-200 uppercase italic">%</span>
                        </div>
                    </div>
                    <div class="bg-white border border-slate-100 rounded-[2rem] p-5 shadow-[0_4px_20px_-4px_rgba(0,0,0,0.03)] group transition-all hover:border-primary-100">
                        <span class="text-[9px] font-black text-slate-400 uppercase tracking-[0.2em] block mb-2">Classement</span>
                        <div class="flex items-baseline gap-0.5">
                            <span class="text-3xl font-heading font-extrabold text-slate-900 leading-none" x-text="scores.ranking || 0"></span>
                            <span class="text-[10px] font-bold text-slate-300 uppercase italic">/<span x-text="scores.totalStudents || 0"></span></span>
                        </div>
                    </div>
                </section>
            </div>

            <!-- Evaluations Section -->
            <section class="px-5 mt-12 space-y-6">
                <div class="flex justify-between items-end mb-4">
                    <div class="flex flex-col">
                        <h2 class="text-xl font-heading font-extrabold text-slate-900 tracking-tight">VOS ÉVALUATIONS</h2>
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mt-1">Aujourd'hui & À venir</p>
                    </div>
                    <div x-show="urgentCount > 0" class="inline-flex items-center gap-x-1.5 py-1.5 px-3 rounded-xl bg-semantic-warning/10 text-semantic-warning border border-semantic-warning/10">
                        <svg class="size-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
                        <span class="text-[10px] font-black uppercase tracking-tight" x-text="urgentCount + ' Urgent'"></span>
                    </div>
                </div>
                
                <div class="grid gap-5 text-left">
                    <template x-for="evaluation in evaluations" :key="evaluation.id">
                        <a :href="'03-mobile-qcm-passation.html'" 
                            class="group block bg-white border border-slate-100 shadow-[0_8px_30px_-4px_rgba(0,0,0,0.04)] rounded-[2.5rem] p-7 relative overflow-hidden active:scale-[0.97] transition-all duration-300 hover:border-primary-100">
                            
                            <!-- Status Indicator Accent -->
                            <div class="absolute top-0 right-12 w-16 h-1 rounded-b-full transition-all duration-500 group-hover:h-2" 
                                :class="evaluation.urgent ? 'bg-semantic-warning shadow-[0_0_15px_rgba(245,158,11,0.4)]' : 'bg-slate-100 group-hover:bg-primary-500'"></div>
                            
                            <div class="flex justify-between items-start mb-5">
                                <div class="flex items-center gap-3">
                                    <div class="size-11 rounded-[1.25rem] bg-slate-50 flex items-center justify-center text-slate-300 group-hover:bg-primary-50 group-hover:text-primary-500 transition-all">
                                        <svg class="size-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="m9 15 2 2 4-4"/></svg>
                                    </div>
                                    <span class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]" x-text="evaluation.subject"></span>
                                </div>
                            </div>

                            <h3 class="text-2xl font-heading font-extrabold text-slate-900 leading-[1.1] tracking-tight mb-8" x-text="evaluation.title"></h3>
                            
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-x-2 text-[10px] font-black uppercase" :class="evaluation.urgent ? 'text-semantic-warning' : 'text-slate-300 group-hover:text-slate-500'">
                                    <svg class="size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                                    <span class="tracking-widest" x-text="evaluation.urgent ? 'Expire aujourd\'hui' : 'À venir'"></span>
                                </div>
                                
                                <div class="inline-flex items-center gap-x-2 text-xs font-black text-primary-600 transition-transform group-hover:translate-x-1">
                                    <span class="uppercase tracking-widest">Démarrer</span>
                                    <svg class="size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5"><path d="m9 18 6-6-6-6"/></svg>
                                </div>
                            </div>
                        </a>
                    </template>
                </div>
            </section>
        </div>
    </main>

    <!-- Bottom Navigation Component (Inlined) -->
    <nav class="fixed bottom-0 w-full max-w-[430px] bg-white border-t border-slate-200 z-50">
        <div class="flex justify-around items-center h-[72px] px-4 pb-safe">
            <a href="02-mobile-dashboard.html" class="flex flex-col items-center justify-center text-primary-500 gap-1.5 transition-colors">
                <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                </svg>
                <span class="text-[10px] font-bold uppercase tracking-widest">Home</span>
            </a>
            <a href="05-mobile-history.html" class="flex flex-col items-center justify-center text-slate-400 gap-1.5 transition-colors">
                <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                </svg>
                <span class="text-[10px] font-bold uppercase tracking-widest">Stats</span>
            </a>
            <a href="08-mobile-profile.html" class="flex flex-col items-center justify-center text-slate-400 gap-1.5 transition-colors">
                <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
                <span class="text-[10px] font-bold uppercase tracking-widest">Profil</span>
            </a>
        </div>
    </nav>

    <!-- Notifications Panel (Bottom Sheet - Inlined) -->
    <div id="hs-offcanvas-notifications" class="hs-overlay hs-overlay-open:translate-y-0 translate-y-full fixed bottom-0 inset-x-0 transition-all duration-300 transform h-3/4 max-w-[430px] mx-auto w-full z-[80] bg-white border-t border-slate-200 rounded-t-3xl shadow-[0_-10px_40px_rgba(0,0,0,0.1)] hidden" role="dialog" tabindex="-1">
        <div class="flex justify-between items-center py-3 px-5 border-b border-slate-100">
            <h3 class="font-bold text-slate-800 uppercase tracking-widest text-xs">Notifications</h3>
            <button type="button" class="size-8 inline-flex justify-center items-center gap-x-2 rounded-full border border-transparent bg-slate-100 text-slate-800 hover:bg-slate-200 focus:outline-none" data-hs-overlay="#hs-offcanvas-notifications">
                <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 6 6 18" /><path d="m6 6 12 12" />
                </svg>
            </button>
        </div>
        <div class="p-5 overflow-y-auto max-h-full">
            <template x-for="notif in notifications" :key="notif.id">
                <div class="p-4 rounded-xl border mb-3" :class="notif.type === 'urgent' ? 'bg-semantic-warning/20 text-semantic-warning border-semantic-warning/30' : 'bg-slate-50 text-slate-800 border-slate-100'">
                    <p class="text-sm font-bold mb-1 uppercase tracking-tight italic" x-text="notif.type === 'urgent' ? 'QCM Urgent !' : 'Note publiée'"></p>
                    <p class="text-xs" x-text="notif.message"></p>
                </div>
            </template>
        </div>
    </div>
</div>

<!-- Preline UI -->
<script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.js"></script>

<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('dashboard', () => ({
            profile: { prenom: 'Mehdi', cohort: 'DW_102' },
            scores: { globalScore: 82, ranking: 4, totalStudents: 24 },
            evaluations: [
                { id: 1, title: 'Fondamentaux PHP', subject: 'PHP - Backend', urgent: true },
                { id: 2, title: 'Introduction UML', subject: 'Analyse Design', urgent: false }
            ],
            notifications: [
                { id: 1, message: 'Le formateur a assigné un test à terminer avant ce soir.', type: 'urgent' },
                { id: 2, message: 'Vous avez obtenu 18/20 au module UML.', type: 'info' }
            ],
            loading: true,
            get urgentCount() {
                return this.evaluations.filter(e => e.urgent).length;
            },
            async init() {
                this.loading = true;
                setTimeout(() => { this.loading = false; }, 1200);
            }
        }));
    });
</script>

<style>
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
    .pt-safe-top { padding-top: env(safe-area-inset-top, 0px); }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
</style>

</body>
</html>
