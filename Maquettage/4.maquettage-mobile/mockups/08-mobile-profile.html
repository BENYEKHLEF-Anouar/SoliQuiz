<!DOCTYPE html>
<html lang="fr"
    class="bg-slate-900 border-x border-slate-200 shadow-2xl h-[100dvh] mx-auto w-full max-w-[430px] overflow-hidden">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mockup: Profil Utilisateur</title>
    <!-- Preline Core -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap"
        rel="stylesheet">
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'], heading: ['Outfit', 'sans-serif'] }, colors: { primary: { 50: 'hsl(190, 80%, 95%)', 100: 'hsl(190, 80%, 90%)', 200: 'hsl(190, 80%, 80%)', 300: 'hsl(190, 80%, 70%)', 400: 'hsl(190, 80%, 60%)', 500: 'hsl(190, 80%, 45%)', 600: 'hsl(190, 80%, 35%)', 700: 'hsl(190, 80%, 25%)', 800: 'hsl(190, 80%, 15%)', 900: 'hsl(190, 80%, 5%)' }, semantic: { success: 'hsl(140, 65%, 45%)', error: 'hsl(0, 75%, 55%)', warning: 'hsl(35, 95%, 55%)', info: 'hsl(220, 80%, 55%)' } } } } };</script>
</head>

<body class="bg-slate-50 h-[100dvh] flex flex-col relative overflow-hidden font-sans">

    <!-- Header Focus -->
    <header class="bg-white px-5 pt-[env(safe-area-inset-top,20px)] pb-6 border-b border-slate-200 shadow-sm shrink-0">
        <h1 class="text-2xl font-heading font-bold text-slate-800 tracking-tight">Mon Profil</h1>
    </header>

    <main class="flex-1 overflow-y-auto px-5 py-8 hide-scrollbar pb-24">
        <!-- Profile Card -->
        <div class="flex flex-col items-center mb-8">
            <div class="relative">
                <img class="inline-block size-24 rounded-full border-4 border-white shadow-md"
                    src="https://images.unsplash.com/photo-1568602471122-7832951cc4c5?ixlib=rb-4.0.3&auto=format&fit=facearea&facepad=2&w=300&h=300&q=80"
                    alt="Avatar">
                <button
                    class="absolute bottom-0 right-0 bg-primary-600 text-white p-2 rounded-full shadow-lg border-2 border-white active:scale-90 transition-transform">
                    <svg class="size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.5">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
                    </svg>
                </button>
            </div>
            <h2 class="mt-4 text-xl font-heading font-bold text-slate-900 leading-none">Mehdi Tazi</h2>
            <p class="text-sm text-primary-600 font-bold mt-1 uppercase tracking-widest">Apprenant - DW_102</p>
        </div>

        <!-- Info List -->
        <div class="space-y-4">
            <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
                <div class="flex flex-col gap-4">
                    <div class="flex items-center gap-3">
                        <div class="size-10 bg-slate-100 rounded-xl flex items-center justify-center text-slate-500">
                            <svg class="size-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                                <polyline points="22,6 12,13 2,6" />
                            </svg>
                        </div>
                        <div>
                            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest leading-none mb-1">
                                Email</p>
                            <p class="text-sm font-semibold text-slate-800">m.tazi@solicode.co</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="size-10 bg-slate-100 rounded-xl flex items-center justify-center text-slate-500">
                            <svg class="size-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                            </svg>
                        </div>
                        <div>
                            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest leading-none mb-1">
                                Mot de passe</p>
                            <p class="text-sm font-semibold text-slate-800">••••••••••••</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Logout Button -->
            <a href="01-mobile-login.html"
                class="w-full py-4 px-4 inline-flex justify-center items-center gap-x-2 text-sm font-bold rounded-2xl border-2 border-semantic-error/20 bg-white text-semantic-error hover:bg-semantic-error hover:text-white transition-all shadow-sm">
                Déconnexion
                <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2.5">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                    <polyline points="16 17 21 12 16 7" />
                    <line x1="21" y1="12" x2="9" y2="12" />
                </svg>
            </a>
        </div>
    </main>

    <!-- Navigation Mobile -->
    <nav class="absolute bottom-0 w-full bg-white border-t border-slate-200 z-50 rounded-b-[2.5rem]">
        <div class="flex justify-around items-center h-[70px] px-2 pb-safe">
            <a href="02-mobile-dashboard.html"
                class="flex flex-col items-center justify-center w-full h-full text-slate-500 gap-1 rounded-xl active:bg-slate-50 transition-colors">
                <svg class="size-6 mb-0.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="9" />
                    <rect x="14" y="3" width="7" height="5" />
                    <rect x="14" y="12" width="7" height="9" />
                    <rect x="3" y="16" width="7" height="5" />
                </svg>
                <span class="text-[10px] font-medium">Accueil</span>
            </a>
            <a href="05-mobile-history.html"
                class="flex flex-col items-center justify-center w-full h-full text-slate-500 gap-1 rounded-xl active:bg-slate-50 transition-colors">
                <svg class="size-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <path d="M12 8v4l3 3" />
                    <circle cx="12" cy="12" r="9" />
                </svg>
                <span class="text-[10px] font-medium">Historique</span>
            </a>
            <a href="08-mobile-profile.html"
                class="flex flex-col items-center justify-center w-full h-full text-primary-600 gap-1 rounded-xl active:bg-slate-50 bg-slate-50 transition-colors">
                <svg class="size-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2.5">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                </svg>
                <span class="text-[10px] font-bold">Profil</span>
            </a>
        </div>
    </nav>

    <style>
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
    </style>
</body>

</html>
