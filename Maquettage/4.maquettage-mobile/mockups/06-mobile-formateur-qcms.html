<!DOCTYPE html>
<html lang="fr" class="bg-slate-900 border-x border-slate-200 shadow-2xl h-[100dvh] mx-auto w-full max-w-[430px] overflow-hidden">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SoliQuiz - Gestion QCMs Formateur</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">

    <!-- Styles -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../charte-graphique/style.css">
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
                        heading: ['Outfit', 'sans-serif']
                    },
                    colors: {
                        primary: {
                            50: 'var(--color-primary-50)',
                            100: 'var(--color-primary-100)',
                            200: 'var(--color-primary-200)',
                            300: 'var(--color-primary-300)',
                            400: 'var(--color-primary-400)',
                            500: 'var(--color-primary-500)',
                            600: 'var(--color-primary-600)',
                            700: 'var(--color-primary-700)',
                            800: 'var(--color-primary-800)',
                            900: 'var(--color-primary-900)'
                        },
                        semantic: {
                            success: 'var(--color-success-500)',
                            error: 'var(--color-error-500)',
                            warning: 'var(--color-warning-500)',
                            info: 'var(--color-info-500)'
                        }
                    }
                }
            }
        };
    </script>
</head>

<body class="bg-slate-50 h-[100dvh] flex flex-col relative overflow-hidden font-sans antialiased text-slate-900 selection:bg-primary-500/30">

<div x-data="formateurQcms" x-init="init()" class="h-full flex flex-col relative overflow-hidden font-sans">
    
    <!-- Formateur Header (Inlined) -->
    <header class="bg-slate-950 px-5 pt-safe-top pb-4 border-b border-white/5 shadow-2xl shrink-0 sticky top-0 z-40">
        <div class="h-[44px] hidden ios:block"></div>
        <div class="flex justify-between items-center mt-2">
            <div class="flex items-center gap-3">
                <a class="flex items-center gap-2 group outline-none" href="06-mobile-formateur-qcms.html">
                    <div class="size-9 bg-primary-500 rounded-xl flex items-center justify-center shadow-lg shadow-primary-500/30 transition-transform group-hover:scale-110 active:scale-95">
                        <svg class="text-white size-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                            <polyline points="14 2 14 8 20 8" />
                            <path d="m9 15 2 2 4-4" />
                        </svg>
                    </div>
                    <div class="flex flex-col leading-none">
                        <span class="text-xl font-heading font-extrabold text-white tracking-tight">Soli<span class="text-primary-500">Quiz</span></span>
                        <span class="text-[9px] font-black text-slate-500 uppercase tracking-[0.3em] ml-0.5">Formateur</span>
                    </div>
                </a>
            </div>

            <button type="button" class="size-10 rounded-full border border-white/10 bg-white/5 overflow-hidden active:scale-95 transition-transform">
                <img class="w-full h-full object-cover" src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?ixlib=rb-1.2.1&auto=format&fit=facearea&facepad=2&w=256&h=256&q=80" alt="Avatar">
            </button>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto w-full px-5 py-8 pb-32 hide-scrollbar relative">
        <!-- Global Loading State -->
        <div x-show="loading" 
             x-transition:leave="transition ease-in duration-500"
             x-transition:leave-start="opacity-100"
             x-transition:leave-end="opacity-0"
             class="absolute inset-0 z-50 bg-slate-50 flex items-center justify-center">
            <div class="flex flex-col items-center gap-4">
                <div class="relative size-16">
                    <div class="absolute inset-0 border-4 border-primary-500/10 rounded-full"></div>
                    <div class="absolute inset-0 border-4 border-primary-500 border-t-transparent rounded-full animate-spin"></div>
                </div>
                <p class="text-[10px] font-black uppercase tracking-[0.3em] text-slate-400">Gestion des sessions...</p>
            </div>
        </div>

        <div x-show="!loading" 
             style="display: none;"
             x-transition:enter="transition ease-out duration-700 delay-300"
             x-transition:enter-start="opacity-0 translate-y-4"
             x-transition:enter-end="opacity-100 translate-y-0">
            
            <div class="flex flex-col gap-5 mb-8">
                <!-- Search Input -->
                <div class="relative group">
                    <div class="absolute inset-y-0 start-0 flex items-center ps-4 pointer-events-none transition-colors group-focus-within:text-primary-500">
                        <svg class="shrink-0 size-4 text-slate-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8" />
                            <path d="m21 21-4.3-4.3" />
                        </svg>
                    </div>
                    <input type="text" x-model="search"
                        class="py-3.5 px-4 ps-11 block w-full border-slate-100 bg-white shadow-sm rounded-2xl text-sm font-medium focus:border-primary-500 focus:ring-4 focus:ring-primary-500/5 transition-all outline-none"
                        placeholder="Rechercher un QCM...">
                </div>
                
                <div class="flex justify-between items-center px-1">
                    <h2 class="text-[9px] font-black text-slate-400 uppercase tracking-[0.2em]" x-text="'Mes Créations (' + filteredQcms.length + ')'"></h2>
                </div>
            </div>

            <div class="grid gap-6">
                <template x-for="qcm in filteredQcms" :key="qcm.id">
                    <div class="flex flex-col bg-white border border-slate-100 shadow-[0_8px_30px_-4px_rgba(0,0,0,0.04)] rounded-[2.5rem] overflow-hidden transition-all duration-300 hover:border-slate-200 active:scale-[0.98]">
                        <div class="p-7">
                            <div class="flex justify-between items-start mb-6">
                                <span class="inline-flex items-center gap-x-1.5 py-1.5 px-3.5 rounded-xl text-[9px] font-black uppercase tracking-[0.2em] leading-none border"
                                    :class="qcm.status === 'Actif' ? 'bg-primary-50 text-primary-600 border-primary-100/50' : 'bg-slate-50 text-slate-500 border-slate-100'">
                                    <span class="size-1.5 rounded-full" :class="qcm.status === 'Actif' ? 'bg-primary-500 animate-pulse' : 'bg-slate-400'"></span>
                                    <span x-text="qcm.status"></span>
                                </span>

                                <div class="hs-dropdown relative inline-flex">
                                    <button class="size-10 flex items-center justify-center bg-slate-50 rounded-2xl text-slate-400 hover:bg-slate-950 hover:text-white transition-all outline-none">
                                        <svg class="shrink-0 size-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                            <circle cx="12" cy="12" r="1" /><circle cx="12" cy="5" r="1" /><circle cx="12" cy="19" r="1" />
                                        </svg>
                                    </button>
                                </div>
                            </div>
                            
                            <h3 class="text-2xl font-heading font-extrabold text-slate-900 leading-[1.1] tracking-tight mb-3" x-text="qcm.title"></h3>
                            <div class="flex items-center gap-x-2 text-[10px] font-bold text-slate-400 uppercase tracking-tight">
                                <span x-text="qcm.questionsCount + ' Questions'"></span>
                                <span class="size-1 bg-slate-200 rounded-full"></span>
                                <span x-text="'Cohorte: ' + (qcm.assignedCohort || 'N/A')"></span>
                            </div>

                            <div class="mt-8 flex gap-3">
                                <button class="flex-1 py-4 px-4 inline-flex justify-center items-center gap-x-2 text-[10px] font-black uppercase tracking-[0.2em] rounded-2xl border border-transparent bg-slate-950 text-white shadow-xl shadow-slate-900/10 active:scale-[0.97] transition-all">
                                    Suivi résultats (<span x-text="qcm.resultsCount"></span>)
                                </button>
                            </div>
                        </div>
                    </div>
                </template>
            </div>

            <div x-show="filteredQcms.length === 0" class="text-center py-32 flex flex-col items-center animate-in fade-in duration-1000">
                <div class="size-20 bg-slate-50 rounded-[2.5rem] flex items-center justify-center mb-6 text-slate-200 shadow-inner">
                    <svg class="size-10" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 4.5v15m7.5-7.5h-15" stroke-linecap="round"/></svg>
                </div>
                <p class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-300 italic">Aucun QCM détecté</p>
            </div>
        </div>
    </main>

    <!-- FAB Button -->
    <button type="button" data-hs-overlay="#hs-create-qcm-modal"
        class="fixed bottom-28 right-6 w-16 h-16 bg-primary-500 text-white rounded-[2rem] shadow-2xl shadow-primary-500/40 flex items-center justify-center hover:bg-primary-600 active:scale-90 transition-all z-40 outline-none">
        <svg class="shrink-0 size-7" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
    </button>

    <!-- Modal Shell (Preline) -->
    <div id="hs-create-qcm-modal" class="hs-overlay hidden size-full fixed top-0 start-0 z-[80] overflow-x-hidden overflow-y-auto pointer-events-none" role="dialog" tabindex="-1">
        <div class="hs-overlay-open:mt-auto hs-overlay-open:opacity-100 hs-overlay-open:duration-500 mt-10 opacity-0 transition-all ease-out flex items-end min-h-full">
            <div class="flex flex-col bg-white border shadow-2xl rounded-t-[3rem] pointer-events-auto w-full max-w-[430px] mx-auto border-t border-slate-100">
                <div class="p-5 flex justify-center"><div class="w-12 h-1.5 bg-slate-100 rounded-full"></div></div>
                <div class="flex justify-between items-center py-4 px-10">
                    <h3 class="text-2xl font-heading font-extrabold text-slate-900 tracking-tight">NOUVEAU QCM</h3>
                    <button type="button" class="size-9 inline-flex justify-center items-center rounded-2xl bg-slate-50 text-slate-400" data-hs-overlay="#hs-create-qcm-modal">
                        <svg class="size-4" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
                    </button>
                </div>
                <div class="px-10 pb-12 pt-4">
                    <div class="space-y-6">
                        <div>
                            <label class="block text-[9px] font-black text-slate-400 uppercase tracking-[0.2em] mb-3">Titre de l'évaluation</label>
                            <input type="text" class="py-4.5 px-6 block w-full border-slate-100 bg-slate-50 rounded-2xl text-sm font-bold focus:border-primary-500 focus:ring-4 focus:ring-primary-500/5 transition-all outline-none" placeholder="Ex: Masterclass Javascript">
                        </div>
                        <button type="button" class="w-full h-16 inline-flex justify-center items-center gap-x-2 text-[10px] font-black uppercase tracking-[0.2em] rounded-2xl bg-primary-500 text-white shadow-2xl shadow-primary-500/20 active:scale-[0.98]">Créer la session</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Formateur Bottom Nav (Inlined) -->
    <nav class="fixed bottom-0 w-full max-w-[430px] bg-slate-950 border-t border-white/5 z-50">
        <div class="flex justify-around items-center h-[72px] px-4 pb-safe">
            <a href="06-mobile-formateur-qcms.html" class="flex flex-col items-center justify-center text-primary-500 gap-1.5 transition-colors">
                <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <rect x="3" y="3" width="7" height="9" /><rect x="14" y="3" width="7" height="5" /><rect x="14" y="12" width="7" height="9" /><rect x="3" y="16" width="7" height="5" />
                </svg>
                <span class="text-[10px] font-bold uppercase tracking-widest leading-none">QCMs</span>
            </a>
            <a href="07-mobile-formateur-class-notes.html" class="flex flex-col items-center justify-center text-slate-500 gap-1.5 transition-colors">
                <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                </svg>
                <span class="text-[10px] font-bold uppercase tracking-widest leading-none">Notes</span>
            </a>
            <a href="09-mobile-formateur-profile.html" class="flex flex-col items-center justify-center text-slate-500 gap-1.5 transition-colors">
                <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
                <span class="text-[10px] font-bold uppercase tracking-widest leading-none">Profil</span>
            </a>
        </div>
    </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.js"></script>
<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('formateurQcms', () => ({
            qcms: [
                { id: 1, title: 'Bases de React JS', questionsCount: 20, assignedCohort: 'DW_102', status: 'Actif', resultsCount: 14 },
                { id: 2, title: 'Architecture MVC', questionsCount: 5, assignedCohort: null, status: 'Brouillon', resultsCount: 0 }
            ],
            loading: true,
            search: '',
            get filteredQcms() {
                if (!this.search) return this.qcms;
                return this.qcms.filter(q => q.title.toLowerCase().includes(this.search.toLowerCase()));
            },
            async init() {
                setTimeout(() => { this.loading = false; }, 800);
            }
        }));
    });
</script>

<style>
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
    .pt-safe-top { padding-top: env(safe-area-inset-top, 0px); }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
</style>

</body>
</html>
