<!DOCTYPE html>
<html lang="fr" class="bg-slate-50">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SoliQuiz - Molécules: Headers</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@800&display=swap" rel="stylesheet">

    <!-- Styles -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../../charte-graphique/style.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
                        heading: ['Outfit', 'sans-serif']
                    },
                    colors: {
                        primary: {
                            500: 'var(--color-primary-500)',
                        }
                    }
                }
            }
        };
    </script>
</head>

<body class="p-10 space-y-20 bg-slate-50 font-sans antialiased max-w-[430px] mx-auto">

    <!-- Student Header -->
    <section>
        <h2 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-6 px-4">Student App Header</h2>
        <header class="bg-white/80 backdrop-blur-md px-5 py-4 border border-slate-100 rounded-[2rem] shadow-sm">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="size-9 bg-primary-500 rounded-xl flex items-center justify-center shadow-lg shadow-primary-500/20 active:scale-95 transition-transform cursor-pointer">
                        <svg class="text-white size-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                            <polyline points="14 2 14 8 20 8" />
                            <path d="m9 15 2 2 4-4" />
                        </svg>
                    </div>
                    <div class="flex flex-col leading-none">
                        <span class="text-lg font-heading font-extrabold text-slate-900 tracking-tight">Soli<span class="text-primary-500">Quiz</span></span>
                        <span class="text-[9px] font-black text-slate-300 uppercase tracking-[0.3em] ml-0.5">Apprenant</span>
                    </div>
                </div>

                <div class="size-9 rounded-full bg-slate-100 flex items-center justify-center text-slate-400 shadow-inner">
                    <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                </div>
            </div>
        </header>
    </section>

    <!-- Formateur Header -->
    <section>
        <h2 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-6 px-4">Formateur App Header</h2>
        <header class="bg-slate-950 px-5 py-4 border border-white/5 rounded-[2rem] shadow-2xl">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="size-9 bg-primary-500 rounded-xl flex items-center justify-center shadow-lg shadow-primary-500/30 active:scale-95 transition-transform cursor-pointer">
                        <svg class="text-white size-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                            <polyline points="14 2 14 8 20 8" />
                            <path d="m9 15 2 2 4-4" />
                        </svg>
                    </div>
                    <div class="flex flex-col leading-none">
                        <span class="text-lg font-heading font-extrabold text-white tracking-tight">Soli<span class="text-primary-500">Quiz</span></span>
                        <span class="text-[9px] font-black text-slate-500 uppercase tracking-[0.3em] ml-0.5">Formateur</span>
                    </div>
                </div>

                <div class="size-9 rounded-full border border-white/10 bg-white/5 overflow-hidden active:scale-95 transition-transform cursor-pointer">
                    <img class="w-full h-full object-cover" src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?ixlib=rb-1.2.1&auto=format&fit=facearea&facepad=2&w=256&h=256&q=80" alt="Avatar">
                </div>
            </div>
        </header>
    </section>

</body>
</html>
