<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Molecule: Mobile Header Timer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.js"></script>
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'], heading: ['Outfit', 'sans-serif'] }, colors: { primary: { 50: 'hsl(190, 80%, 95%)', 100: 'hsl(190, 80%, 90%)', 200: 'hsl(190, 80%, 80%)', 300: 'hsl(190, 80%, 70%)', 400: 'hsl(190, 80%, 60%)', 500: 'hsl(190, 80%, 45%)', 600: 'hsl(190, 80%, 35%)', 700: 'hsl(190, 80%, 25%)', 800: 'hsl(190, 80%, 15%)', 900: 'hsl(190, 80%, 5%)' }, semantic: { success: 'hsl(140, 65%, 45%)', error: 'hsl(0, 75%, 55%)', warning: 'hsl(35, 95%, 55%)', info: 'hsl(220, 80%, 55%)' } } } } };</script>
    <style>
        .pt-safe-top {
            padding-top: env(safe-area-inset-top, 0px);
        }
    </style>
</head>

<body class="bg-slate-50">
    <header class="bg-white px-4 pt-safe-top pb-3 border-b border-slate-200 shadow-sm w-full">
        <div class="h-[20px] hidden ios:block"></div>
        <div class="flex justify-between items-center mt-3">
            <div class="flex items-center gap-2">
                <span
                    class="inline-flex size-[28px] bg-slate-900 text-white rounded-full items-center justify-center text-xs font-bold leading-none">4</span>
                <span class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">/ 20</span>
            </div>

            <div class="flex items-center gap-1.5 bg-semantic-error px-3 py-1.5 rounded-xl border border-semantic-error">
                <svg class="size-4 text-semantic-error" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10" />
                    <polyline points="12 6 12 12 16 14" />
                </svg>
                <span class="text-sm font-bold text-semantic-error font-mono tracking-widest leading-none pt-0.5">03:45</span>
            </div>
        </div>
    </header>
    <div class="h-1 bg-slate-200 w-full shrink-0">
        <div class="h-full bg-primary-500 rounded-r-full" style="width: 20%"></div>
    </div>
</body>

</html>
