<!DOCTYPE html>
<html lang="fr" class="bg-slate-50">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SoliQuiz - Molécules: List Items</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">

    <!-- Styles -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../../charte-graphique/style.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: 'var(--color-primary-50)',
                            500: 'var(--color-primary-500)',
                            600: 'var(--color-primary-600)',
                            100: 'var(--color-primary-100)',
                        },
                        semantic: {
                            error: 'var(--color-error-500)',
                        }
                    }
                }
            }
        };
    </script>
</head>

<body class="p-10 space-y-12 bg-slate-50 font-sans antialiased max-w-[430px] mx-auto">

    <!-- History List Item -->
    <section>
        <h2 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-6 px-4">History Item</h2>
        <div class="p-5 flex items-center bg-white border border-slate-100 shadow-[0_4px_20px_-4px_rgba(0,0,0,0.03)] rounded-[2rem] cursor-pointer active:scale-[0.98] transition-all hover:border-slate-200 group">
            <div class="size-12 rounded-2xl bg-slate-50 flex items-center justify-center text-primary-500 shrink-0 group-hover:bg-primary-50 transition-colors">
                <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
            <div class="ms-5 flex-1">
                <h3 class="font-extrabold text-slate-900 text-base leading-tight">Fondamentaux PHP</h3>
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-tight mt-1">Il y a 2 heures</p>
            </div>
            <div class="text-right">
                <span class="px-3 py-1.5 rounded-xl text-xs font-black tracking-tight border shadow-sm bg-primary-50 text-primary-600 border-primary-100">
                    17 <span class="opacity-40 text-[9px]">/</span> 20
                </span>
            </div>
        </div>
    </section>

    <!-- Student List Item (Alert) -->
    <section>
        <h2 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-6 px-4">Student Item (Alert)</h2>
        <div class="p-5 flex items-center bg-white border border-slate-100 border-l-4 border-l-semantic-error shadow-[0_2px_15px_-3px_rgba(0,0,0,0.03)] rounded-[2rem] cursor-pointer active:scale-[0.98] transition-all hover:border-slate-200 group">
            <div class="size-12 rounded-2xl bg-slate-50 flex items-center justify-center border border-slate-100 shrink-0 transition-colors group-hover:bg-primary-50 overflow-hidden">
                <img class="size-full object-cover" src="https://images.unsplash.com/photo-1568602471122-7832951cc4c5?auto=format&fit=facearea&facepad=2&w=150&h=150&q=80" alt="Avatar">
            </div>
            <div class="ms-4 flex-1">
                <h3 class="font-extrabold text-slate-900 text-base leading-tight">Karim Tazi</h3>
                <p class="text-[10px] font-bold text-semantic-error uppercase tracking-tighter mt-1">Suivi prioritaire</p>
            </div>
            <div class="text-right">
                <span class="px-3 py-1.5 rounded-xl text-xs font-black tracking-tight border shadow-sm bg-semantic-error/10 text-semantic-error border-semantic-error/10">
                    08.5
                </span>
            </div>
        </div>
    </section>

</body>
</html>
