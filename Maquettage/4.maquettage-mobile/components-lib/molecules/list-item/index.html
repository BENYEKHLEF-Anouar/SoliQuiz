<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Molecule: Preline List Item</title>
    <!-- Preline Core -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.js"></script>
</head>

<body class="p-6 bg-slate-50 flex justify-center w-full">

    <!-- PRELINE LIST GROUP PATTERN -->
    <ul
        class="max-w-xs flex flex-col w-full bg-white border border-slate-200 shadow-sm rounded-xl dark:bg-neutral-900 dark:border-neutral-700 divide-y divide-slate-200 dark:divide-neutral-700">
        <li
            class="inline-flex items-start gap-x-2 py-3 px-4 text-sm text-slate-800 dark:text-white cursor-pointer hover:bg-slate-50 active:bg-slate-100">
            <div class="flex-1">
                <h3 class="font-bold text-slate-800 dark:text-white text-sm">UML Diagrammes</h3>
                <p class="text-xs text-slate-500 mt-0.5 dark:text-neutral-500">Il y a 3 jours</p>
            </div>
            <!-- Preline Badge -->
            <span
                class="inline-flex items-center gap-x-1.5 py-1 px-2 rounded-lg text-xs font-bold bg-primary-100 text-primary-800 dark:bg-primary-800/30 dark:text-primary-500 font-mono">
                14/20
            </span>
        </li>
    </ul>

</body>

</html>
