<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Molecule: Feature Card (Landing)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap"
        rel="stylesheet">
    <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'], heading: ['Outfit', 'sans-serif'] }, colors: { primary: { 50: 'hsl(190, 80%, 95%)', 100: 'hsl(190, 80%, 90%)', 200: 'hsl(190, 80%, 80%)', 300: 'hsl(190, 80%, 70%)', 400: 'hsl(190, 80%, 60%)', 500: 'hsl(190, 80%, 45%)', 600: 'hsl(190, 80%, 35%)', 700: 'hsl(190, 80%, 25%)', 800: 'hsl(190, 80%, 15%)', 900: 'hsl(190, 80%, 5%)' } } } } };</script>
</head>

<body class="p-6 bg-slate-50 flex flex-col gap-6 max-w-sm mx-auto font-sans">

    <!-- Feature Card: Primary Icon (Premium) -->
    <div
        class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 flex items-center gap-5 transition-all active:scale-[0.98]">
        <div class="size-12 bg-primary-50 text-primary-500 rounded-xl flex items-center justify-center shrink-0">
            <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
            </svg>
        </div>
        <div>
            <h3 class="font-bold text-slate-900 text-sm">Passation en Direct</h3>
            <p class="text-slate-500 text-xs leading-relaxed">Vitesse de réponse optimisée pour mobile.</p>
        </div>
    </div>

    <!-- Feature Card: Success Icon (Premium) -->
    <div
        class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 flex items-center gap-5 transition-all active:scale-[0.98]">
        <div class="size-12 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center shrink-0">
            <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        </div>
        <div>
            <h3 class="font-bold text-slate-900 text-sm">Notes instantanées</h3>
            <p class="text-slate-500 text-xs leading-relaxed">Reçois tes résultats immédiatement après validation.</p>
        </div>
    </div>

    <!-- Feature Card: Warning Icon (Premium) -->
    <div
        class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 flex items-center gap-5 transition-all active:scale-[0.98]">
        <div class="size-12 bg-amber-50 text-amber-600 rounded-xl flex items-center justify-center shrink-0">
            <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path
                    d="M16 8v8m-4-5v5m-4-2v2m-2 4h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2z" />
            </svg>
        </div>
        <div>
            <h3 class="font-bold text-slate-900 text-sm">Suivi de cohorte</h3>
            <p class="text-slate-500 text-xs leading-relaxed">Compare tes performances et progresse avec tes collègues.
            </p>
        </div>
    </div>

</body>

</html>
