<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Molecule: Preline Card QCM</title>
    <!-- Preline Core -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.js"></script>
</head>

<body class="p-6 bg-slate-50 flex justify-center w-full">

    <!-- PRELINE BASIC CARD PATTERN -->
    <div
        class="flex flex-col w-full max-w-sm bg-white border border-slate-200 shadow-sm rounded-xl dark:bg-neutral-900 dark:border-neutral-700 relative overflow-hidden">
        <!-- Decoration indicator border -->
        <div class="absolute top-0 end-0 size-2 bg-semantic-warning h-full"></div>

        <div class="p-4 md:p-5">
            <h3 class="text-lg font-bold text-slate-800 dark:text-white pe-4">
                Fondamentaux PHP
            </h3>
            <p class="mt-1 text-xs text-slate-500 dark:text-neutral-500">
                Variables, boucles, fonctions.
            </p>

            <div class="mt-4 pt-4 border-t border-slate-100 dark:border-neutral-800">
                <a class="py-2 px-3 inline-flex items-center gap-x-2 text-sm font-semibold rounded-lg border border-transparent text-primary-600 hover:bg-primary-100 hover:text-primary-800 focus:outline-none focus:bg-primary-100 focus:text-primary-800 disabled:opacity-50 disabled:pointer-events-none dark:text-primary-500 dark:hover:bg-primary-800/30 dark:hover:text-primary-400 dark:focus:bg-primary-800/30 dark:focus:text-primary-400"
                    href="#">
                    Démarrer l'examen
                    <svg class="shrink-0 size-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <path d="m9 18 6-6-6-6" />
                    </svg>
                </a>
            </div>
        </div>
    </div>

</body>

</html>
