<!DOCTYPE html>
<html lang="fr" class="bg-slate-50">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SoliQuiz - Molécules: Cartes QCM</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@800&display=swap" rel="stylesheet">

    <!-- Styles -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../../charte-graphique/style.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
                        heading: ['Outfit', 'sans-serif']
                    },
                    colors: {
                        primary: {
                            50: 'var(--color-primary-50)',
                            100: 'var(--color-primary-100)',
                            200: 'var(--color-primary-200)',
                            300: 'var(--color-primary-300)',
                            400: 'var(--color-primary-400)',
                            500: 'var(--color-primary-500)',
                            600: 'var(--color-primary-600)',
                            700: 'var(--color-primary-700)',
                            800: 'var(--color-primary-800)',
                            900: 'var(--color-primary-900)'
                        }
                    }
                }
            }
        };
    </script>
</head>

<body class="p-10 space-y-12 bg-slate-50 font-sans antialiased max-w-[430px] mx-auto">

    <!-- Student Evaluation Card -->
    <section>
        <h2 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-6">Student Evaluation Card</h2>
        <div class="flex flex-col bg-white border border-slate-100 shadow-[0_8px_30px_-4px_rgba(0,0,0,0.04)] rounded-[2.5rem] overflow-hidden transition-all duration-300 hover:border-slate-200 active:scale-[0.98]">
            <div class="p-7">
                <div class="flex justify-between items-start mb-6">
                    <span class="inline-flex items-center gap-x-1.5 py-1.5 px-3.5 rounded-xl text-[9px] font-black uppercase tracking-[0.2em] bg-primary-50 text-primary-600 border border-primary-100/50">
                        <span class="size-1.5 rounded-full bg-primary-500 animate-pulse"></span>
                        Disponible
                    </span>
                    <div class="size-10 bg-slate-50 rounded-2xl flex items-center justify-center text-slate-400">
                        <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    </div>
                </div>
                
                <h3 class="text-2xl font-heading font-extrabold text-slate-900 leading-[1.1] tracking-tight mb-3">Fondamentaux PHP</h3>
                <div class="flex items-center gap-x-2 text-[10px] font-bold text-slate-400 uppercase tracking-tight">
                    <span>12 Questions</span>
                    <span class="size-1 bg-slate-200 rounded-full"></span>
                    <span>15 Minutes</span>
                </div>

                <div class="mt-8 flex gap-3">
                    <button class="flex-1 py-4 px-4 inline-flex justify-center items-center gap-x-2 text-[10px] font-black uppercase tracking-[0.2em] rounded-2xl bg-slate-950 text-white shadow-xl shadow-slate-900/10 active:scale-[0.97] transition-all">
                        Lancer le quiz
                        <svg class="shrink-0 size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path d="M5 12h14m-7-7l7 7-7 7" /></svg>
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- Formateur Creation Card -->
    <section>
        <h2 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-6">Formateur Creation Card</h2>
        <div class="flex flex-col bg-white border border-slate-100 shadow-[0_8px_30px_-4px_rgba(0,0,0,0.04)] rounded-[2.5rem] overflow-hidden transition-all duration-300 hover:border-slate-200">
            <div class="p-7">
                <div class="flex justify-between items-start mb-6">
                    <span class="inline-flex items-center gap-x-1.5 py-1.5 px-3.5 rounded-xl text-[9px] font-black uppercase tracking-[0.2em] bg-slate-50 text-slate-400 border border-slate-100">
                        <span class="size-1.5 rounded-full bg-slate-300"></span>
                        Brouillon
                    </span>
                    <button class="size-10 flex items-center justify-center bg-slate-50 rounded-2xl text-slate-400 hover:bg-slate-950 hover:text-white transition-all">
                        <svg class="shrink-0 size-5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1" /><circle cx="12" cy="5" r="1" /><circle cx="12" cy="19" r="1" /></svg>
                    </button>
                </div>
                
                <h3 class="text-2xl font-heading font-extrabold text-slate-900 leading-[1.1] tracking-tight mb-3">Architecture MVC</h3>
                <div class="flex items-center gap-x-2 text-[10px] font-bold text-slate-400 uppercase tracking-tight">
                    <span>5 Questions</span>
                    <span class="size-1 bg-slate-200 rounded-full"></span>
                    <span>Cohorte: CDA_101</span>
                </div>

                <div class="mt-8">
                    <button class="w-full py-4 px-4 inline-flex justify-center items-center gap-x-2 text-[10px] font-black uppercase tracking-[0.2em] rounded-2xl border-2 border-slate-100 bg-white text-slate-900 hover:bg-slate-50 transition-all">
                        Continuer l'édition
                    </button>
                </div>
            </div>
        </div>
    </section>

</body>
</html>
