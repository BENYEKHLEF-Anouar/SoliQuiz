<!DOCTYPE html>
<html lang="fr" class="bg-slate-50">

<head>

                </svg>

    <section>
        <h2 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-6">UI Actions</h2>
        <div class="flex flex-wrap gap-8 items-center">
            <div class="size-10 flex items-center justify-center bg-white border border-slate-100 rounded-xl text-slate-400 shadow-sm">
                <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12" /></svg>

            </div>
            <div class="size-10 flex items-center justify-center bg-primary-50 text-primary-500 rounded-xl">
                <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M5 13l4 4L19 7" /></svg>
