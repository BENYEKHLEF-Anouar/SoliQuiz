<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Atom: Preline Badges</title>
    <!-- Preline Core -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.js"></script>
</head>

<body class="p-6 bg-slate-50 flex gap-4 flex-wrap">
    <!-- Preline Soft Badge (Success) -->
    <span
        class="inline-flex items-center gap-x-1.5 py-1.5 px-3 rounded-full text-xs font-medium bg-primary-100 text-primary-800 dark:bg-primary-800/30 dark:text-primary-500">
        Actif
    </span>

    <!-- Preline indicator Badge (Warning/Alert) -->
    <span
        class="inline-flex items-center gap-x-1.5 py-1.5 px-3 rounded-full text-xs font-medium bg-semantic-error text-semantic-error dark:bg-semantic-error/30 dark:text-semantic-error">
        <span class="size-1.5 inline-block rounded-full bg-semantic-error dark:bg-semantic-error"></span>
        Urgent
    </span>

    <!-- Preline Outline Badge -->
    <span
        class="inline-flex items-center gap-x-1.5 py-1.5 px-3 rounded-full text-xs font-medium border border-slate-200 bg-white text-slate-800 shadow-sm dark:bg-neutral-900 dark:border-neutral-700 dark:text-white">
        Non noté
    </span>
</body>

</html>
