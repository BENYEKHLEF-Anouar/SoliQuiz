<!DOCTYPE html>
<html lang="fr" class="bg-slate-50">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SoliQuiz - Atomes: Badges</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">

    <!-- Styles -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../../charte-graphique/style.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif']
                    },
                    colors: {
                        primary: {
                            50: 'var(--color-primary-50)',
                            100: 'var(--color-primary-100)',
                            200: 'var(--color-primary-200)',
                            300: 'var(--color-primary-300)',
                            400: 'var(--color-primary-400)',
                            500: 'var(--color-primary-500)',
                            600: 'var(--color-primary-600)',
                            700: 'var(--color-primary-700)',
                            800: 'var(--color-primary-800)',
                            900: 'var(--color-primary-900)'
                        },
                        semantic: {
                            success: 'var(--color-success-500)',
                            error: 'var(--color-error-500)',
                            warning: 'var(--color-warning-500)',
                            info: 'var(--color-info-500)'
                        }
                    }
                }
            }
        };
    </script>
</head>

<body class="p-10 space-y-12 bg-slate-50 font-sans antialiased">

    <!-- Status Badges -->
    <section>
        <h2 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-6">Status Indicators</h2>
        <div class="flex flex-wrap gap-4 items-center">
            <span class="inline-flex items-center gap-x-1.5 py-1.5 px-3.5 rounded-xl text-[9px] font-black uppercase tracking-[0.2em] bg-primary-50 text-primary-600 border border-primary-100/50">
                <span class="size-1.5 rounded-full bg-primary-500 animate-pulse"></span>
                Actif
            </span>
            <span class="inline-flex items-center gap-x-1.5 py-1.5 px-3.5 rounded-xl text-[9px] font-black uppercase tracking-[0.2em] bg-slate-50 text-slate-400 border border-slate-100">
                <span class="size-1.5 rounded-full bg-slate-300"></span>
                Brouillon
            </span>
            <span class="inline-flex items-center gap-x-1.5 py-1.5 px-3.5 rounded-xl text-[9px] font-black uppercase tracking-[0.2em] bg-semantic-error/10 text-semantic-error border border-semantic-error/10">
                <span class="size-1.5 rounded-full bg-semantic-error animate-ping"></span>
                Urgent
            </span>
        </div>
    </section>

    <!-- Score Tags -->
    <section>
        <h2 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-6">Score & Metrics</h2>
        <div class="flex flex-wrap gap-4 items-center">
            <span class="px-3 py-1.5 rounded-xl text-xs font-black tracking-tight border shadow-sm bg-primary-50 text-primary-600 border-primary-100">
                17 <span class="opacity-40 text-[9px]">/</span> 20
            </span>
            <span class="px-3 py-1.5 rounded-xl text-xs font-black tracking-tight border shadow-sm bg-semantic-error/10 text-semantic-error border-semantic-error/10">
                08 <span class="opacity-40 text-[9px]">/</span> 20
            </span>
        </div>
    </section>

    <!-- Generic Labels -->
    <section>
        <h2 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-6">Generic Labels</h2>
        <div class="flex flex-wrap gap-4 items-center">
            <span class="inline-flex items-center bg-slate-950 text-white px-3 py-1 rounded-full text-[9px] font-black uppercase tracking-widest border border-white/10">
                V2.0 Mobile
            </span>
            <span class="inline-flex items-center bg-white text-slate-400 px-3 py-1 rounded-full text-[9px] font-black uppercase tracking-widest border border-slate-100">
                Apprenant
            </span>
        </div>
    </section>

</body>
</html>
