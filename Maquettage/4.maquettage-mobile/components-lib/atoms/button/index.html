<!DOCTYPE html>
<html lang="fr" class="bg-slate-50">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SoliQuiz - Atomes: Boutons</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">

    <!-- Styles -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../../charte-graphique/style.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
                        heading: ['Outfit', 'sans-serif']
                    },
                    colors: {
                        primary: {
                            50: 'var(--color-primary-50)',
                            100: 'var(--color-primary-100)',
                            200: 'var(--color-primary-200)',
                            300: 'var(--color-primary-300)',
                            400: 'var(--color-primary-400)',
                            500: 'var(--color-primary-500)',
                            600: 'var(--color-primary-600)',
                            700: 'var(--color-primary-700)',
                            800: 'var(--color-primary-800)',
                            900: 'var(--color-primary-900)'
                        },
                        semantic: {
                            success: 'var(--color-success-500)',
                            error: 'var(--color-error-500)',
                            warning: 'var(--color-warning-500)',
                            info: 'var(--color-info-500)'
                        }
                    }
                }
            }
        };
    </script>
</head>

<body class="p-10 space-y-12 bg-slate-50 font-sans antialiased">

    <!-- Primary Buttons -->
    <section>
        <h2 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-6">Primary Actions</h2>
        <div class="flex flex-wrap gap-6 items-center">
            <button class="h-16 px-8 inline-flex items-center justify-center gap-x-3 text-[10px] font-black uppercase tracking-[0.25em] rounded-2xl bg-primary-500 text-white shadow-2xl shadow-primary-500/30 hover:bg-primary-600 active:scale-95 transition-all outline-none">
                Commencer le Quiz
            </button>
            <button class="h-16 px-8 inline-flex items-center justify-center gap-x-3 text-[10px] font-black uppercase tracking-[0.25em] rounded-2xl bg-slate-950 text-white shadow-xl shadow-slate-900/20 hover:bg-slate-900 active:scale-95 transition-all outline-none">
                Se Connecter
            </button>
        </div>
    </section>

    <!-- Secondary & Outlined -->
    <section>
        <h2 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-6">Secondary & Outlined</h2>
        <div class="flex flex-wrap gap-6 items-center">
            <button class="h-16 px-8 inline-flex items-center justify-center gap-x-3 text-[10px] font-black uppercase tracking-[0.25em] rounded-2xl bg-white border-2 border-slate-100 text-slate-900 shadow-sm hover:border-slate-200 active:scale-95 transition-all outline-none">
                Consulter l'historique
            </button>
            <button class="h-16 px-8 inline-flex items-center justify-center gap-x-3 text-[10px] font-black uppercase tracking-[0.25em] rounded-2xl bg-semantic-error/10 text-semantic-error border-2 border-semantic-error/10 hover:bg-semantic-error/20 active:scale-95 transition-all outline-none">
                Annuler l'évaluation
            </button>
        </div>
    </section>

    <!-- Circle & FAB -->
    <section>
        <h2 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-6">Circular & FAB</h2>
        <div class="flex flex-wrap gap-6 items-center">
            <button class="size-16 bg-primary-500 text-white rounded-[2rem] shadow-[0_15px_35px_-5px_rgba(var(--color-primary-rgb),0.4)] flex items-center justify-center hover:bg-primary-600 active:scale-90 transition-all outline-none">
                <svg class="size-7" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <button class="size-12 bg-white border border-slate-100 rounded-2xl flex items-center justify-center text-slate-400 hover:text-primary-500 shadow-sm active:scale-95 transition-all outline-none">
                <svg class="size-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>
            </button>
        </div>
    </section>

    <!-- Loading State -->
    <section>
        <h2 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-6">Loading States</h2>
        <div class="flex flex-wrap gap-6 items-center">
            <button class="h-16 px-8 inline-flex items-center justify-center gap-x-3 text-[10px] font-black uppercase tracking-[0.25em] rounded-2xl bg-primary-500/50 text-white/50 cursor-wait">
                <svg class="animate-spin size-4" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                Chargement...
            </button>
        </div>
    </section>

</body>
</html>
