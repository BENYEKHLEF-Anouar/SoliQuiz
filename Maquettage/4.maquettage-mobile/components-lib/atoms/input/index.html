<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Atom: Preline Mobile Input</title>
    <!-- Preline Core -->
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.js"></script>
</head>

<body class="p-4 bg-slate-50 max-w-sm mx-auto">
    <!-- Preline Input Forms Structure -->
    <div>
        <label for="input-label" class="block text-sm font-medium mb-2 dark:text-white">Email</label>
        <input type="email" id="input-label"
            class="py-3 px-4 block w-full border-slate-200 rounded-lg text-sm focus:border-primary-500 focus:ring-primary-500 disabled:opacity-50 disabled:pointer-events-none dark:bg-neutral-900 dark:border-neutral-700 dark:text-neutral-400 dark:placeholder-neutral-500 dark:focus:ring-neutral-600"
            placeholder="vous@solicode.co">
    </div>
</body>

</html>
