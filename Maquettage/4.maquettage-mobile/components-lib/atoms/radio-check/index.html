<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Atom: Preline Radio/Checkbox Form</title>
    <!-- Preline Core -->
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.js"></script>
</head>

<body class="p-4 bg-slate-50 flex flex-col gap-4 max-w-sm mx-auto">
    <!-- Preline Advanced Radio Form Pattern -->
    <label for="hs-radio-in-form"
        class="flex p-3 w-full bg-white border border-slate-200 rounded-lg text-sm focus:border-primary-500 focus:ring-primary-500 dark:bg-neutral-900 dark:border-neutral-700 dark:text-neutral-400 cursor-pointer hover:bg-slate-50 active:scale-[0.98] transition-transform">
        <input type="radio" name="hs-radio-in-form"
            class="shrink-0 mt-0.5 border-slate-300 rounded-full text-primary-600 focus:ring-primary-500 disabled:opacity-50 disabled:pointer-events-none dark:bg-neutral-800 dark:border-neutral-500 dark:checked:bg-primary-500 dark:checked:border-primary-500 dark:focus:ring-offset-slate-800"
            id="hs-radio-in-form">
        <span class="text-sm text-slate-500 ms-3 dark:text-neutral-400 font-medium font-mono">Options de test
            (Radio)</span>
    </label>

    <!-- Preline Advanced Checkbox Form Pattern -->
    <label for="hs-checkbox-in-form"
        class="flex p-3 w-full bg-white border border-slate-200 rounded-lg text-sm focus:border-primary-500 focus:ring-primary-500 dark:bg-neutral-900 dark:border-neutral-700 dark:text-neutral-400 cursor-pointer hover:bg-slate-50 active:scale-[0.98] transition-transform">
        <input type="checkbox"
            class="shrink-0 mt-0.5 border-slate-300 rounded text-primary-600 focus:ring-primary-500 disabled:opacity-50 disabled:pointer-events-none dark:bg-neutral-800 dark:border-neutral-500 dark:checked:bg-primary-500 dark:checked:border-primary-500 dark:focus:ring-offset-slate-800"
            id="hs-checkbox-in-form">
        <span class="text-sm text-slate-500 ms-3 dark:text-neutral-400 font-medium font-mono">Options multiples
            (Check)</span>
    </label>
</body>

</html>
