<!DOCTYPE html>
<html lang="fr" class="bg-slate-50">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SoliQuiz - Atomes: Radio & Check</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">

    <!-- Styles -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../../charte-graphique/style.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: 'var(--color-primary-50)',
                            500: 'var(--color-primary-500)',
                        }
                    }
                }
            }
        };
    </script>
</head>

<body class="p-10 space-y-12 bg-slate-50 font-sans antialiased max-w-[430px]">

    <!-- QCM Options (Radio-like) -->
    <section>
        <h2 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-6">QCM Selectors</h2>
        <div class="space-y-4">
            <!-- Unselected -->
            <div class="group relative flex items-center p-5 bg-white border border-slate-100 rounded-[2rem] shadow-sm transition-all active:scale-[0.98]">
                <div class="size-6 rounded-full border-2 border-slate-100 flex items-center justify-center transition-colors group-hover:border-primary-200">
                    <div class="size-2 rounded-full bg-primary-500 opacity-0 transition-opacity"></div>
                </div>
                <span class="ms-4 text-sm font-bold text-slate-600">Option non sélectionnée</span>
            </div>
            
            <!-- Selected -->
            <div class="group relative flex items-center p-5 bg-primary-50 border border-primary-100 rounded-[2rem] shadow-[0_4px_15px_-3px_rgba(var(--color-primary-rgb),0.1)] transition-all active:scale-[0.98]">
                <div class="size-6 rounded-full border-2 border-primary-500 flex items-center justify-center">
                    <div class="size-2.5 rounded-full bg-primary-500 shadow-lg shadow-primary-500/40"></div>
                </div>
                <span class="ms-4 text-sm font-extrabold text-primary-900">Option sélectionnée</span>
            </div>
        </div>
    </section>

    <!-- Standard Checkbox -->
    <section>
        <h2 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-6">Standard Checkbox</h2>
        <div class="flex items-center gap-3">
             <div class="size-6 bg-primary-500 rounded-lg flex items-center justify-center text-white shadow-lg shadow-primary-500/20">
                <svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3.5"><path d="M5 13l4 4L19 7" /></svg>
             </div>
             <span class="text-xs font-bold text-slate-600 italic">Mémoriser mes infos</span>
        </div>
    </section>

</body>
</html>
