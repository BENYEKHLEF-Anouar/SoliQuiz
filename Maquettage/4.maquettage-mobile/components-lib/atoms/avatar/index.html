<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Atom: Mobile Avatar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.js"></script>
</head>

<body class="p-4 bg-slate-50 flex items-center gap-4">
    <!-- Image Avatar -->
    <button type="button"
        class="w-10 h-10 rounded-full border border-slate-200 bg-white shadow-sm overflow-hidden active:scale-95 transition-transform">
        <img class="w-full h-full object-cover"
            src="https://images.unsplash.com/photo-1568602471122-7832951cc4c5?ixlib=rb-4.0.3&auto=format&fit=facearea&facepad=2&w=300&h=300&q=80"
            alt="Avatar">
    </button>
    <!-- Initials Avatar -->
    <div
        class="w-8 h-8 rounded-full border border-slate-200 bg-slate-100 flex items-center justify-center font-bold text-slate-500 text-xs">
        SA</div>
</body>

</html>
