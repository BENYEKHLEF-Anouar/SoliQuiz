<!DOCTYPE html>
<html lang="fr" class="bg-slate-50">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SoliQuiz - Atomes: Avatars</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">

    <!-- Styles -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../../charte-graphique/style.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            500: 'var(--color-primary-500)',
                        }
                    }
                }
            }
        };
    </script>
</head>

<body class="p-10 space-y-12 bg-slate-50 font-sans antialiased">

    <!-- Simple Avatars -->
    <section>
        <h2 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-6">User Profiles</h2>
        <div class="flex flex-wrap gap-6 items-center">
            <img class="size-12 rounded-2xl border-2 border-white shadow-lg object-cover" 
                src="https://images.unsplash.com/photo-1568602471122-7832951cc4c5?ixlib=rb-4.0.3&auto=format&fit=facearea&facepad=2&w=150&h=150&q=80" alt="Avatar">
            
            <img class="size-20 rounded-full border-4 border-white shadow-xl object-cover" 
                src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?ixlib=rb-1.2.1&auto=format&fit=facearea&facepad=2&w=256&h=256&q=80" alt="Avatar Large">
        </div>
    </section>

    <!-- With Badges -->
    <section>
        <h2 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-6">With Status Badge</h2>
        <div class="relative inline-block group">
            <div class="absolute inset-0 bg-primary-500 rounded-full blur-2xl opacity-10 group-hover:opacity-20 transition-opacity"></div>
            <img class="relative inline-block size-24 rounded-full border-4 border-white shadow-xl object-cover" 
                src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?ixlib=rb-1.2.1&auto=format&fit=facearea&facepad=2&w=256&h=256&q=80" alt="Avatar">
            <div class="absolute bottom-1 right-1 size-6 bg-slate-950 text-white rounded-2xl border-2 border-white flex items-center justify-center shadow-lg">
                <svg class="size-3" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" /><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" /></svg>
            </div>
        </div>
    </section>

    <!-- Letter Placeholder -->
    <section>
        <h2 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-6">Letter Placeholder</h2>
        <div class="size-12 rounded-2xl bg-primary-500 text-white flex items-center justify-center font-black shadow-lg shadow-primary-500/20">
            MT
        </div>
    </section>

</body>
</html>
