<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Atom: Preline Progress</title>
    <!-- Preline Core -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/preline/dist/preline.js"></script>
</head>

<body class="p-6 bg-slate-50 w-full">
    <!-- Preline Global Progress Bar Component -->
    <div class="mb-2 flex justify-between items-center">
        <h3 class="text-sm font-semibold text-slate-800 dark:text-white">Avancement QCM</h3>
        <span class="text-sm text-slate-800 dark:text-white">40%</span>
    </div>
    <div class="flex w-full h-1.5 bg-slate-200 rounded-full overflow-hidden dark:bg-neutral-700" role="progressbar"
        aria-valuenow="40" aria-valuemin="0" aria-valuemax="100">
        <div class="flex flex-col justify-center rounded-full overflow-hidden bg-primary-600 text-xs text-white text-center whitespace-nowrap transition duration-500 dark:bg-primary-500"
            style="width: 40%"></div>
    </div>
</body>

</html>
