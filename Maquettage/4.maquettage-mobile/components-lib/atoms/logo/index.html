<!DOCTYPE html>
<html lang="fr" class="bg-slate-50">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SoliQuiz - Atomes: Logo & Branding</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&family=Outfit:wght@800&display=swap" rel="stylesheet">

    <!-- Styles -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../../charte-graphique/style.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
                        heading: ['Outfit', 'sans-serif']
                    },
                    colors: {
                        primary: {
                            500: 'var(--color-primary-500)',
                        }
                    }
                }
            }
        };
    </script>
</head>

<body class="p-10 space-y-16 bg-slate-50 font-sans antialiased">

    <!-- Light Background Logo -->
    <section>
        <h2 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-8">Standard Logo (Light)</h2>
        <div class="flex items-center gap-3">
            <div class="size-11 bg-primary-500 rounded-xl flex items-center justify-center shadow-lg shadow-primary-500/20">
                <svg class="text-white size-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                    <polyline points="14 2 14 8 20 8" />
                    <path d="m9 15 2 2 4-4" />
                </svg>
            </div>
            <div class="flex flex-col leading-none">
                <span class="text-2xl font-heading font-extrabold text-slate-900 tracking-tight">Soli<span class="text-primary-500">Quiz</span></span>
                <span class="text-[10px] font-black text-slate-300 uppercase tracking-[0.3em] ml-0.5">Apprenant</span>
            </div>
        </div>
    </section>

    <!-- Dark Background Logo -->
    <section class="bg-slate-950 p-10 rounded-[2.5rem] border border-white/5 shadow-2xl">
        <h2 class="text-[10px] font-black text-slate-600 uppercase tracking-[0.2em] mb-8">Standard Logo (Dark)</h2>
        <div class="flex items-center gap-3">
            <div class="size-11 bg-primary-500 rounded-xl flex items-center justify-center shadow-lg shadow-primary-500/30">
                <svg class="text-white size-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                    <polyline points="14 2 14 8 20 8" />
                    <path d="m9 15 2 2 4-4" />
                </svg>
            </div>
            <div class="flex flex-col leading-none">
                <span class="text-2xl font-heading font-extrabold text-white tracking-tight">Soli<span class="text-primary-500">Quiz</span></span>
                <span class="text-[10px] font-black text-slate-500 uppercase tracking-[0.3em] ml-0.5">Formateur</span>
            </div>
        </div>
    </section>

    <!-- Large Branding -->
    <section>
        <h2 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-8">Large Branding</h2>
        <div class="flex flex-col items-center">
            <div class="size-24 bg-primary-500 rounded-[2.5rem] flex items-center justify-center shadow-2xl shadow-primary-500/30 mb-6">
                <svg class="text-white size-12" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                    <polyline points="14 2 14 8 20 8" />
                    <path d="m9 15 2 2 4-4" />
                </svg>
            </div>
            <h1 class="text-4xl font-heading font-extrabold text-slate-900 tracking-tighter">Soli<span class="text-primary-500">Quiz</span></h1>
            <p class="text-[12px] font-black text-slate-300 uppercase tracking-[0.4em] mt-3">Évaluations Agiles</p>
        </div>
    </section>

</body>
</html>
