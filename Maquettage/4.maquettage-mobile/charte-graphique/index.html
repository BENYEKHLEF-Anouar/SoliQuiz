<!DOCTYPE html>
<html lang="fr"
    class="bg-slate-900 border-x border-slate-200 shadow-2xl h-[100dvh] mx-auto w-full max-w-[430px] overflow-hidden">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SoliQuiz - Charte Graphique Mobile</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: 'var(--color-primary-50)',
                            100: 'var(--color-primary-100)',
                            200: 'var(--color-primary-200)',
                            300: 'var(--color-primary-300)',
                            400: 'var(--color-primary-400)',
                            500: 'var(--color-primary-500)',
                            600: 'var(--color-primary-600)',
                            700: 'var(--color-primary-700)',
                            800: 'var(--color-primary-800)',
                            900: 'var(--color-primary-900)',
                        },
                        semantic: {
                            success: 'var(--color-success-500)',
                            warning: 'var(--color-warning-500)',
                            error: 'var(--color-error-500)',
                            info: 'var(--color-info-500)',
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-slate-50 flex flex-col h-full font-sans overflow-hidden">

    <header class="bg-white px-5 pt-10 pb-4 shadow-sm z-20 shrink-0">
        <h1 class="text-2xl font-heading font-bold text-slate-900 leading-tight">Mobile Design System</h1>
        <p class="text-xs font-semibold text-primary-500 uppercase tracking-widest mt-1">SoliQuiz Mobile</p>
    </header>

    <main class="flex-1 overflow-y-auto px-5 py-6 space-y-8">

        <!-- TYPOGRAPHIE -->
        <section>
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3 flex items-center gap-2">
                <span class="w-1.5 h-1.5 rounded-full bg-primary-500"></span> Typography
            </h2>
            <div class="bg-white p-5 rounded-2xl border border-slate-200/50 space-y-4 shadow-sm">
                <div>
                    <span class="text-[10px] text-slate-400 font-mono uppercase">H1 - Outfit Bold</span>
                    <h1 class="text-2xl font-heading font-bold text-slate-900 leading-tight mt-1">Titre de l'écran</h1>
                </div>
                <div>
                    <span class="text-[10px] text-slate-400 font-mono uppercase">H2 - Outfit SemiBold</span>
                    <h2 class="text-lg font-heading font-semibold text-slate-800 mt-1">Section secondaire</h2>
                </div>
                <div>
                    <span class="text-[10px] text-slate-400 font-mono uppercase">Body - Inter Regular</span>
                    <p class="text-sm text-slate-600 mt-1 leading-relaxed">Texte de contenu optimisé pour affichege
                        mobile (14px).</p>
                </div>
            </div>
        </section>

        <!-- COLORS -->
        <section>
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3 flex items-center gap-2">
                <span class="w-1.5 h-1.5 rounded-full bg-primary-500"></span> Colors
            </h2>
            <div class="grid grid-cols-5 gap-2 mb-4">
                <div class="h-12 rounded-xl bg-primary-100"></div>
                <div class="h-12 rounded-xl bg-primary-300"></div>
                <div class="h-12 rounded-xl bg-primary-500 border-2 border-primary-600 shadow-md"></div>
                <div class="h-12 rounded-xl bg-primary-700"></div>
                <div class="h-12 rounded-xl bg-primary-900"></div>
            </div>
            <div class="grid grid-cols-4 gap-2">
                <div class="h-10 rounded-xl bg-semantic-success"></div>
                <div class="h-10 rounded-xl bg-semantic-error"></div>
                <div class="h-10 rounded-xl bg-semantic-warning"></div>
                <div class="h-10 rounded-xl bg-semantic-info"></div>
            </div>
        </section>

        <!-- COMPONENTS PREVIEW -->
        <section>
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3 flex items-center gap-2">
                <span class="w-1.5 h-1.5 rounded-full bg-primary-500"></span> Touch Targets
            </h2>
            <div class="bg-white p-5 rounded-2xl border border-slate-200/50 space-y-4 shadow-sm">
                <button
                    class="w-full py-3.5 px-4 bg-primary-500 text-white font-bold rounded-xl active:scale-[0.98] transition-transform">
                    Primary Button (Touch)
                </button>
                <div class="flex gap-3">
                    <button
                        class="flex-1 py-3.5 px-4 bg-slate-100 text-slate-700 font-semibold rounded-xl active:bg-slate-200">
                        Back
                    </button>
                    <button
                        class="flex-1 py-3.5 px-4 bg-primary-100 text-primary-700 font-semibold rounded-xl active:bg-primary-200">
                        Next
                    </button>
                </div>
            </div>
        </section>

        <section class="pb-10">
            <a href="../index.html"
                class="flex items-center justify-center gap-2 text-primary-500 font-bold text-sm bg-primary-50 p-4 rounded-xl">
                <svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path d="M15 19l-7-7 7-7" />
                </svg>
                Revenir au Kit Mobile
            </a>
        </section>

    </main>

</body>

</html>
