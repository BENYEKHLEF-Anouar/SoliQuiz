<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>09 - Bibliothèque QCM Formateur - SoliQuiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        primary: {
                            50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd',
                            300: '#7dd3fc', 400: '#38bdf8', 500: '#17B0CF',
                            600: '#0ea5e9', 700: '#0284c7', 800: '#0369a1', 900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 h-screen overflow-hidden">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <aside class="hidden lg:block w-72 h-full p-4 shrink-0">
            <div class="h-full bg-white rounded-3xl border border-slate-100 shadow-sm flex flex-col">
                <div class="p-6 border-b border-slate-50">
                    <a href="#" class="flex items-center gap-3">
                        <div class="size-9 bg-[#17B0CF] rounded-xl flex items-center justify-center shadow-lg shadow-[#17B0CF]/20 text-white">
                            <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="m9 15 2 2 4-4"/></svg>
                        </div>
                        <div class="flex flex-col">
                            <span class="text-lg font-black text-slate-900 uppercase italic">Soli<span class="text-[#17B0CF]">Quiz</span></span>
                            <span class="text-[8px] font-black text-slate-400 uppercase">Espace Formateur</span>
                        </div>
                    </a>
                </div>
                <nav class="flex-1 px-3 py-6">
                    <a href="#" class="flex items-center gap-3.5 px-5 py-3 rounded-xl text-slate-500 hover:bg-[#e0f2fe]/50 hover:text-[#17B0CF] transition-all italic">
                        <svg class="size-4.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M12 20v-6M6 20V10M18 20V4"/></svg>
                        <span class="text-[11px] font-bold uppercase">Supervision</span>
                    </a>
                    <a href="#" class="flex items-center gap-3.5 px-5 py-3 rounded-xl bg-[#17B0CF] text-white shadow-lg shadow-[#17B0CF]/20 italic">
                        <svg class="size-4.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13"/></svg>
                        <span class="text-[11px] font-bold uppercase">Bibliothèque</span>
                    </a>
                </nav>
            </div>
        </aside>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col min-w-0">
            <main class="flex-1 overflow-y-auto p-4 lg:p-10">
                <div class="max-w-[1400px] mx-auto pt-6 space-y-6">
                    <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
                        <div>
                            <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] italic mb-1">Espace Formateur</p>
                            <h3 class="text-xl font-bold text-slate-900 italic uppercase">Banque de QCMs</h3>
                        </div>
                        <button class="px-6 py-3 bg-[#17B0CF] text-white text-[11px] font-black uppercase tracking-widest rounded-2xl hover:bg-[#14a0bd] transition-all shadow-lg shadow-[#17B0CF]/20 flex items-center gap-2">
                            <svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path d="M12 4v16m8-8H4"/></svg>
                            Nouveau QCM
                        </button>
                    </div>

                    <!-- Filters -->
                    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                        <div class="flex flex-col sm:flex-row gap-3">
                            <div class="relative flex-1">
                                <input type="text" placeholder="Rechercher..." class="w-full h-11 pl-11 pr-4 bg-slate-50 border-none rounded-xl text-sm font-medium focus:bg-white focus:ring-4 focus:ring-[#17B0CF]/10 outline-none">
                                <svg class="absolute left-4 top-1/2 -translate-y-1/2 size-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                            </div>
                            <select class="h-11 px-4 bg-slate-50 border-none rounded-xl text-sm font-medium"><option>Tous les statuts</option><option>Brouillon</option><option>Publié</option></select>
                        </div>
                    </div>

                    <!-- QCM Grid -->
                    <div class="grid gap-4">
                        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-all">
                            <div class="flex items-start justify-between mb-4">
                                <div>
                                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">UA2 - JavaScript</span>
                                    <h4 class="font-bold text-lg text-slate-900 mt-1">JavaScript Avancé ES6+</h4>
                                </div>
                                <span class="px-2 py-1 bg-emerald-100 text-emerald-700 rounded text-[10px] font-bold uppercase">Publié</span>
                            </div>
                            <div class="flex items-center gap-4 text-xs text-slate-500 mb-4">
                                <span class="flex items-center gap-1"><svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"/><path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>20 min</span>
                                <span class="flex items-center gap-1"><svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"/><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>15 questions</span>
                                <span class="flex items-center gap-1"><svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"/><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/></svg>45 passations</span>
                            </div>
                            <div class="flex items-center justify-between">
                                <span class="text-2xl font-black text-emerald-600">14.5</span>
                                <span class="text-sm text-slate-400">/20 moyenne</span>
                                <div class="flex gap-2">
                                    <button class="p-2 rounded-lg bg-slate-100 text-slate-600 hover:bg-[#17B0CF] hover:text-white transition-all"><svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"/><path d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg></button>
                                    <button class="p-2 rounded-lg bg-slate-100 text-slate-600 hover:bg-rose-500 hover:text-white transition-all"><svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"/><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
