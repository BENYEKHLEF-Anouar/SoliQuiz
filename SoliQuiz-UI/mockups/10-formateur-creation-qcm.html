<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10 - Création QCM - SoliQuiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        primary: { 50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 300: '#7dd3fc', 400: '#38bdf8', 500: '#17B0CF', 600: '#0ea5e9', 700: '#0284c7', 800: '#0369a1', 900: '#0c4a6e' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 h-screen overflow-hidden">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <aside class="hidden lg:block w-72 h-full p-4 shrink-0">
            <div class="h-full bg-white rounded-3xl border border-slate-100 shadow-sm flex flex-col">
                <div class="p-6 border-b border-slate-50">
                    <a href="#" class="flex items-center gap-3">
                        <div class="size-9 bg-[#17B0CF] rounded-xl flex items-center justify-center shadow-lg shadow-[#17B0CF]/20 text-white">
                            <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="m9 15 2 2 4-4"/></svg>
                        </div>
                        <div class="flex flex-col">
                            <span class="text-lg font-black text-slate-900 uppercase italic">Soli<span class="text-[#17B0CF]">Quiz</span></span>
                            <span class="text-[8px] font-black text-slate-400 uppercase">Espace Formateur</span>
                        </div>
                    </a>
                </div>
                <nav class="flex-1 px-3 py-6">
                    <a href="#" class="flex items-center gap-3.5 px-5 py-3 rounded-xl text-slate-500 hover:bg-[#e0f2fe]/50 hover:text-[#17B0CF] transition-all italic">
                        <svg class="size-4.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M12 20v-6M6 20V10M18 20V4"/></svg>
                        <span class="text-[11px] font-bold uppercase">Supervision</span>
                    </a>
                    <a href="#" class="flex items-center gap-3.5 px-5 py-3 rounded-xl bg-[#17B0CF] text-white shadow-lg shadow-[#17B0CF]/20 italic">
                        <svg class="size-4.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h6m-6 0h6m0 0v6m0-6h6"/></svg>
                        <span class="text-[11px] font-bold uppercase">Éditeur</span>
                    </a>
                </nav>
            </div>
        </aside>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col min-w-0">
            <main class="flex-1 overflow-y-auto p-4 lg:p-10">
                <div class="max-w-4xl mx-auto pt-6 space-y-6">
                    <!-- Header -->
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] italic mb-1">Espace Formateur</p>
                            <h3 class="text-xl font-bold text-slate-900 italic uppercase">Créer un QCM</h3>
                        </div>
                        <div class="flex gap-3">
                            <button class="px-6 py-3 bg-white border-2 border-slate-200 text-slate-700 text-[11px] font-bold uppercase tracking-widest rounded-2xl hover:border-[#7dd3fc] hover:text-[#17B0CF] transition-all">Enregistrer Brouillon</button>
                            <button class="px-6 py-3 bg-[#17B0CF] text-white text-[11px] font-bold uppercase tracking-widest rounded-2xl hover:bg-[#14a0bd] transition-all shadow-lg shadow-[#17B0CF]/20">Publier</button>
                        </div>
                    </div>

                    <!-- QCM Settings -->
                    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-5">
                        <h4 class="font-bold text-slate-900">Configuration du QCM</h4>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-2">Titre du QCM</label>
                                <input type="text" class="w-full py-3 px-4 border border-slate-200 rounded-xl text-sm font-medium focus:border-[#17B0CF] focus:ring-4 focus:ring-[#17B0CF]/10 outline-none" placeholder="JavaScript Avancé">
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-2">Unité d'apprentissage</label>
                                <select class="w-full py-3 px-4 border border-slate-200 rounded-xl text-sm font-medium focus:border-[#17B0CF] outline-none">
                                    <option>UA2 - JavaScript</option>
                                    <option>UA1 - HTML/CSS</option>
                                    <option>UA3 - Frameworks</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-2">Durée (minutes)</label>
                                <input type="number" class="w-full py-3 px-4 border border-slate-200 rounded-xl text-sm font-medium focus:border-[#17B0CF] outline-none" value="20">
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-2">Seuil de réussite</label>
                                <input type="number" class="w-full py-3 px-4 border border-slate-200 rounded-xl text-sm font-medium focus:border-[#17B0CF] outline-none" value="10">
                            </div>
                        </div>
                    </div>

                    <!-- Question List -->
                    <div class="space-y-4">
                        <div class="flex items-center justify-between">
                            <h4 class="font-bold text-slate-900">Questions (3)</h4>
                            <button class="text-sm text-[#17B0CF] font-bold hover:underline">+ Ajouter une question</button>
                        </div>

                        <!-- Question 1 -->
                        <div class="bg-white border border-slate-200 rounded-2xl overflow-hidden">
                            <div class="bg-slate-50 px-6 py-4 flex items-center justify-between">
                                <div class="flex items-center gap-3">
                                    <span class="size-7 bg-slate-800 text-white rounded-full flex items-center justify-center text-xs font-bold">1</span>
                                    <span class="text-sm font-bold text-slate-800 uppercase">Question</span>
                                </div>
                                <button class="text-slate-400 hover:text-rose-500"><svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"/><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button>
                            </div>
                            <div class="p-6 space-y-4">
                                <textarea class="w-full py-3 px-4 border border-slate-200 rounded-xl text-sm font-medium focus:border-[#17B0CF] outline-none" rows="2" placeholder="Quelle méthode HTTP est utilisée pour créer une nouvelle ressource ?"></textarea>
                                <div class="space-y-3 bg-slate-50 p-4 rounded-xl">
                                    <div class="flex items-center gap-3 bg-white p-3 rounded-lg border border-emerald-300">
                                        <input type="radio" name="q1" checked class="size-4 text-emerald-600"><input type="text" value="POST" class="flex-1 border-none text-sm font-bold">
                                    </div>
                                    <div class="flex items-center gap-3 bg-white p-3 rounded-lg border border-slate-200">
                                        <input type="radio" name="q1" class="size-4 text-[#17B0CF]"><input type="text" value="GET" class="flex-1 border-none text-sm">
                                    </div>
                                    <div class="flex items-center gap-3 bg-white p-3 rounded-lg border border-slate-200">
                                        <input type="radio" name="q1" class="size-4 text-[#17B0CF]"><input type="text" value="PUT" class="flex-1 border-none text-sm">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
