<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>05 - Passation QCM - SoliQuiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        primary: {
                            50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd',
                            300: '#7dd3fc', 400: '#38bdf8', 500: '#17B0CF',
                            600: '#0ea5e9', 700: '#0284c7', 800: '#0369a1', 900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 h-screen overflow-hidden" x-data="{ 
    currentQuestion: 1, 
    totalQuestions: 5,
    timeLeft: 1200,
    selectedAnswer: null,
    answers: {},
    showConfirm: false,
    formatTime(seconds) {
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        return `${m}:${s.toString().padStart(2, '0')}`;
    }
}" x-init="setInterval(() => { if(timeLeft > 0) timeLeft-- }, 1000)">
    <div class="flex h-screen">
        <!-- Sidebar Progress -->
        <aside class="w-80 bg-white border-r border-slate-200 hidden lg:flex flex-col">
            <div class="p-6 border-b border-slate-100">
                <div class="flex items-center gap-3 mb-4">
                    <div class="size-10 bg-[#17B0CF] rounded-xl flex items-center justify-center text-white shadow-lg shadow-[#17B0CF]/20">
                        <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                            <polyline points="14 2 14 8 20 8" />
                            <path d="m9 15 2 2 4-4" />
                        </svg>
                    </div>
                    <div>
                        <span class="text-lg font-black text-slate-900">Soli<span class="text-[#17B0CF]">Quiz</span></span>
                    </div>
                </div>
                <h3 class="font-bold text-slate-900">JavaScript Avancé</h3>
                <p class="text-xs text-slate-500 mt-1">Question <span x-text="currentQuestion"></span> sur <span x-text="totalQuestions"></span></p>
            </div>
            
            <!-- Progress List -->
            <div class="flex-1 overflow-y-auto p-4">
                <div class="space-y-2">
                    <template x-for="i in totalQuestions" :key="i">
                        <button @click="currentQuestion = i; selectedAnswer = answers[i] || null" 
                                class="w-full flex items-center gap-3 p-3 rounded-xl transition-all text-left"
                                :class="{
                                    'bg-[#17B0CF] text-white shadow-lg shadow-[#17B0CF]/20': currentQuestion === i,
                                    'bg-emerald-50 text-emerald-700 border border-emerald-200': answers[i] && currentQuestion !== i,
                                    'bg-slate-50 text-slate-600 hover:bg-slate-100': !answers[i] && currentQuestion !== i
                                }">
                            <div class="size-8 rounded-lg flex items-center justify-center text-sm font-black"
                                 :class="{
                                    'bg-white/20': currentQuestion === i,
                                    'bg-emerald-100': answers[i] && currentQuestion !== i,
                                    'bg-slate-200': !answers[i] && currentQuestion !== i
                                 }">
                                <span x-text="i"></span>
                            </div>
                            <span class="text-xs font-bold flex-1 truncate">Question <span x-text="i"></span></span>
                            <svg x-show="answers[i]" class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                                <path d="M5 13l4 4L19 7"/>
                            </svg>
                        </button>
                    </template>
                </div>
            </div>

            <!-- Timer -->
            <div class="p-4 border-t border-slate-100 bg-slate-50">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">Temps restant</span>
                    <span class="text-lg font-black" :class="timeLeft < 300 ? 'text-rose-600' : 'text-slate-900'" x-text="formatTime(timeLeft)"></span>
                </div>
                <div class="w-full bg-slate-200 rounded-full h-2">
                    <div class="bg-[#17B0CF] h-2 rounded-full transition-all duration-1000" :style="`width: ${(timeLeft / 1200) * 100}%`"></div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col min-w-0">
            <!-- Mobile Header -->
            <div class="lg:hidden bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between">
                <span class="font-bold text-slate-900">Q <span x-text="currentQuestion"></span>/<span x-text="totalQuestions"></span></span>
                <span class="font-black text-rose-600" x-text="formatTime(timeLeft)"></span>
            </div>

            <main class="flex-1 overflow-y-auto p-4 lg:p-10">
                <div class="max-w-3xl mx-auto space-y-8">
                    <!-- Question Card -->
                    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 lg:p-10">
                        <div class="mb-6">
                            <span class="text-[10px] font-black text-[#17B0CF] uppercase tracking-[0.3em] italic mb-2 block">Question <span x-text="currentQuestion"></span></span>
                            <h2 class="text-xl font-bold text-slate-900 leading-relaxed">
                                Quelle est la sortie de ce code JavaScript ?
                            </h2>
                        </div>
                        
                        <div class="bg-slate-900 rounded-xl p-4 mb-6 overflow-x-auto">
                            <code class="text-sm font-mono text-emerald-400">
                                const arr = [1, 2, 3];<br>
                                const result = arr.map(x => x * 2);<br>
                                console.log(result);
                            </code>
                        </div>

                        <!-- Options -->
                        <div class="space-y-3">
                            <label class="flex items-center gap-4 p-4 bg-slate-50 rounded-xl border-2 border-transparent hover:border-[#17B0CF]/30 cursor-pointer transition-all group"
                                   :class="{ 'border-[#17B0CF] bg-[#e0f2fe]/30': selectedAnswer === 'A' }">
                                <div class="relative">
                                    <input type="radio" name="answer" value="A" x-model="selectedAnswer" class="peer sr-only">
                                    <div class="size-6 rounded-full border-2 border-slate-300 peer-checked:border-[#17B0CF] peer-checked:bg-[#17B0CF] transition-all"></div>
                                    <div class="absolute inset-0 flex items-center justify-center">
                                        <div class="size-2 bg-white rounded-full scale-0 peer-checked:scale-100 transition-transform"></div>
                                    </div>
                                </div>
                                <span class="text-sm font-medium" :class="selectedAnswer === 'A' ? 'text-[#17B0CF] font-bold' : 'text-slate-700'">[1, 2, 3]</span>
                            </label>

                            <label class="flex items-center gap-4 p-4 bg-slate-50 rounded-xl border-2 border-transparent hover:border-[#17B0CF]/30 cursor-pointer transition-all"
                                   :class="{ 'border-[#17B0CF] bg-[#e0f2fe]/30': selectedAnswer === 'B' }">
                                <div class="relative">
                                    <input type="radio" name="answer" value="B" x-model="selectedAnswer" class="peer sr-only">
                                    <div class="size-6 rounded-full border-2 border-slate-300 peer-checked:border-[#17B0CF] peer-checked:bg-[#17B0CF] transition-all"></div>
                                    <div class="absolute inset-0 flex items-center justify-center">
                                        <div class="size-2 bg-white rounded-full scale-0 peer-checked:scale-100 transition-transform"></div>
                                    </div>
                                </div>
                                <span class="text-sm font-medium" :class="selectedAnswer === 'B' ? 'text-[#17B0CF] font-bold' : 'text-slate-700'">[2, 4, 6]</span>
                            </label>

                            <label class="flex items-center gap-4 p-4 bg-slate-50 rounded-xl border-2 border-transparent hover:border-[#17B0CF]/30 cursor-pointer transition-all"
                                   :class="{ 'border-[#17B0CF] bg-[#e0f2fe]/30': selectedAnswer === 'C' }">
                                <div class="relative">
                                    <input type="radio" name="answer" value="C" x-model="selectedAnswer" class="peer sr-only">
                                    <div class="size-6 rounded-full border-2 border-slate-300 peer-checked:border-[#17B0CF] peer-checked:bg-[#17B0CF] transition-all"></div>
                                    <div class="absolute inset-0 flex items-center justify-center">
                                        <div class="size-2 bg-white rounded-full scale-0 peer-checked:scale-100 transition-transform"></div>
                                    </div>
                                </div>
                                <span class="text-sm font-medium" :class="selectedAnswer === 'C' ? 'text-[#17B0CF] font-bold' : 'text-slate-700'">[2, 4, 6, 8]</span>
                            </label>

                            <label class="flex items-center gap-4 p-4 bg-slate-50 rounded-xl border-2 border-transparent hover:border-[#17B0CF]/30 cursor-pointer transition-all"
                                   :class="{ 'border-[#17B0CF] bg-[#e0f2fe]/30': selectedAnswer === 'D' }">
                                <div class="relative">
                                    <input type="radio" name="answer" value="D" x-model="selectedAnswer" class="peer sr-only">
                                    <div class="size-6 rounded-full border-2 border-slate-300 peer-checked:border-[#17B0CF] peer-checked:bg-[#17B0CF] transition-all"></div>
                                    <div class="absolute inset-0 flex items-center justify-center">
                                        <div class="size-2 bg-white rounded-full scale-0 peer-checked:scale-100 transition-transform"></div>
                                    </div>
                                </div>
                                <span class="text-sm font-medium" :class="selectedAnswer === 'D' ? 'text-[#17B0CF] font-bold' : 'text-slate-700'">undefined</span>
                            </label>
                        </div>
                    </div>

                    <!-- Navigation Buttons -->
                    <div class="flex items-center justify-between">
                        <button @click="if(currentQuestion > 1) { answers[currentQuestion] = selectedAnswer; currentQuestion--; selectedAnswer = answers[currentQuestion] || null; }"
                                :disabled="currentQuestion === 1"
                                class="px-6 py-3 bg-white border-2 border-slate-200 text-slate-700 text-[11px] font-black uppercase tracking-widest rounded-2xl hover:border-[#17B0CF] transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
                            <svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M15 19l-7-7 7-7"/></svg>
                            Précédent
                        </button>

                        <button x-show="currentQuestion < totalQuestions" 
                                @click="answers[currentQuestion] = selectedAnswer; currentQuestion++; selectedAnswer = answers[currentQuestion] || null;"
                                :disabled="!selectedAnswer"
                                class="px-6 py-3 bg-[#17B0CF] text-white text-[11px] font-black uppercase tracking-widest rounded-2xl hover:bg-[#0284c7] transition-all shadow-lg shadow-[#17B0CF]/20 disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
                            Suivant
                            <svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M9 5l7 7-7 7"/></svg>
                        </button>

                        <button x-show="currentQuestion === totalQuestions"
                                @click="answers[currentQuestion] = selectedAnswer; showConfirm = true;"
                                :disabled="!selectedAnswer"
                                class="px-6 py-3 bg-emerald-500 text-white text-[11px] font-black uppercase tracking-widest rounded-2xl hover:bg-emerald-600 transition-all shadow-lg shadow-emerald-500/20 disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
                            Terminer
                            <svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M5 13l4 4L19 7"/></svg>
                        </button>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div x-show="showConfirm" class="fixed inset-0 z-[9999] flex items-center justify-center p-4" style="display: none;">
        <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm" @click="showConfirm = false"></div>
        <div class="relative z-10 bg-white rounded-[2rem] shadow-2xl w-full max-w-md p-8 text-center" x-show="showConfirm" x-transition>
            <div class="size-16 bg-emerald-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <svg class="size-8 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
            </div>
            <h3 class="text-xl font-black text-slate-900 mb-2">Confirmer la soumission</h3>
            <p class="text-sm text-slate-500 mb-6">
                Vous avez répondu à <span class="font-black text-[#17B0CF]" x-text="Object.keys(answers).filter(k => answers[k]).length"></span> sur <span x-text="totalQuestions"></span> questions.
                <br>Êtes-vous sûr de vouloir soumettre ?
            </p>
            <div class="flex gap-3 justify-center">
                <button @click="showConfirm = false" class="px-6 py-3 bg-white border-2 border-slate-200 text-slate-700 text-[11px] font-black uppercase tracking-widest rounded-2xl hover:border-slate-300 transition-all">Revoir</button>
                <button @click="alert('QCM Soumis !'); window.location.reload();" class="px-6 py-3 bg-emerald-500 text-white text-[11px] font-black uppercase tracking-widest rounded-2xl hover:bg-emerald-600 transition-all shadow-lg shadow-emerald-500/20">Soumettre</button>
            </div>
        </div>
    </div>
</body>
</html>
