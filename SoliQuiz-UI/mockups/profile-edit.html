<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoliQuiz - Profil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], heading: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: { primary: { 50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 300: '#7dd3fc', 400: '#38bdf8', 500: '#17B0CF', 600: '#0ea5e9', 700: '#0284c7', 800: '#0369a1', 900: '#0c4a6e' } }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 min-h-screen font-sans antialiased">

@include('layout-app-sidebar')

<div class="ml-64 min-h-screen">
    <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-slate-200">
        <div class="flex items-center justify-between h-16 px-6">
            <div class="flex items-center gap-4">
                <h1 class="text-lg font-bold text-slate-900">Mon Profil</h1>
            </div>
        </div>
    </header>

    <main class="p-6 max-w-2xl">
        <div class="bg-white rounded-3xl border border-slate-100 shadow-sm p-8">
            <div class="flex items-center gap-6 mb-8">
                <img src="https://ui-avatars.com/api/?name=Martin+Dupont&background=17B0CF&color=fff&bold=true&size=128" class="size-24 rounded-2xl">
                <div>
                    <h2 class="text-2xl font-black text-slate-900">Martin Dupont</h2>
                    <p class="text-sm text-slate-500">martin.dupont@soliquiz.fr</p>
                </div>
            </div>

            <form class="space-y-6">
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="text-xs font-bold text-slate-400 uppercase tracking-widest block mb-2">Prénom</label>
                        <input type="text" value="Martin" class="w-full py-3 px-4 rounded-xl bg-slate-50 border-none font-bold text-slate-900 focus:bg-white transition-all">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-400 uppercase tracking-widest block mb-2">Nom</label>
                        <input type="text" value="Dupont" class="w-full py-3 px-4 rounded-xl bg-slate-50 border-none font-bold text-slate-900 focus:bg-white transition-all">
                    </div>
                </div>

                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-widest block mb-2">Email</label>
                    <input type="email" value="martin.dupont@soliquiz.fr" class="w-full py-3 px-4 rounded-xl bg-slate-50 border-none font-bold text-slate-900 focus:bg-white transition-all">
                </div>

                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-widest block mb-2">Nouveau mot de passe</label>
                    <input type="password" placeholder="••••••••" class="w-full py-3 px-4 rounded-xl bg-slate-50 border-none font-bold text-slate-900 focus:bg-white transition-all">
                </div>

                <button type="submit" class="w-full py-4 bg-slate-900 text-white rounded-xl font-bold text-sm uppercase tracking-widest hover:bg-primary-500 transition-all">
                    Mettre à jour
                </button>
            </form>
        </div>
    </main>
</div>

</body>
</html>
