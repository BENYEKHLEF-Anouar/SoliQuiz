<!DOCTYPE html>
<html lang="fr" class="scroll-smooth min-h-screen">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SoliQuiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'], heading: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: { primary: { 50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 300: '#7dd3fc', 400: '#38bdf8', 500: '#17B0CF', 600: '#0ea5e9', 700: '#0284c7', 800: '#0369a1', 900: '#0c4a6e' } }
                }
            }
        }
    </script>
    <style>[x-cloak] { display: none !important; }</style>
</head>

<body class="font-sans antialiased text-slate-800 bg-slate-50 h-screen overflow-hidden">
    <div class="flex h-screen overflow-hidden p-0 m-0" x-data="{ sidebarOpen: false }">
        
        <!-- Mobile Header -->
        <div class="lg:hidden glass fixed top-0 left-0 right-0 z-50 px-6 h-16 flex justify-between items-center shadow-sm bg-white">
            <div class="flex items-center gap-2">
                <div class="size-8 bg-primary-500 rounded-lg flex items-center justify-center shadow-lg shadow-primary-500/20">
                    <svg class="text-white size-5" fill="none" viewBox="0 0 24 24" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="m9 15 2 2 4-4"/></svg>
                </div>
                <span class="font-heading font-bold text-lg text-slate-900 leading-none tracking-tight">Soli<span class="text-primary-500">Quiz</span></span>
            </div>
            <button @click="sidebarOpen = !sidebarOpen" type="button" class="p-2 rounded-xl bg-slate-100 hover:bg-slate-200 transition-colors">
                <svg class="size-6 text-slate-600" fill="none" viewBox="0 0 24 24" stroke-width="2"><path d="M4 6h16M4 12h16m-7 6h7"/></svg>
            </button>
        </div>

        <!-- Backdrop -->
        <div x-show="sidebarOpen" x-transition class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-60 lg:hidden" @click="sidebarOpen = false" x-cloak></div>

        <!-- Sidebar -->
        <aside :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'" class="fixed top-0 left-0 w-72 transition-transform duration-300 ease-out z-70 h-screen shrink-0">
            <div class="h-full p-4">
                <div class="h-full bg-white rounded-3xl border border-slate-100 shadow-sm flex flex-col overflow-hidden">
                    <!-- Logo -->
                    <div class="p-6 border-b border-slate-50">
                        <a class="flex items-center gap-3" href="#">
                            <div class="size-9 bg-primary-500 rounded-xl flex items-center justify-center shadow-lg shadow-primary-500/20 text-white">
                                <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="m9 15 2 2 4-4"/></svg>
                            </div>
                            <div class="flex flex-col">
                                <span class="text-lg font-heading font-black text-slate-900 tracking-tight leading-none uppercase italic">Soli<span class="text-primary-500">Quiz</span></span>
                                <span class="text-[8px] font-black text-slate-400 uppercase tracking-[0.2em] mt-1">Espace Admin</span>
                            </div>
                        </a>
                    </div>

                    <!-- Navigation -->
                    <nav class="flex-1 px-3 py-6 space-y-6 overflow-y-auto">
                        <!-- Dashboard Link -->
                        <a href="#" class="flex items-center gap-3.5 px-5 py-3 rounded-xl bg-primary-500 text-white shadow-lg shadow-primary-500/20">
                            <svg class="size-4.5" fill="none" viewBox="0 0 24 24" stroke-width="2.5"><path d="M12 20v-6M6 20V10M18 20V4"/></svg>
                            <span class="text-[11px] font-bold uppercase">Dashboard</span>
                        </a>
                        <!-- Utilisateurs -->
                        <a href="#" class="flex items-center gap-3.5 px-5 py-3 rounded-xl text-slate-500 hover:bg-slate-50 hover:text-slate-900 transition-all">
                            <svg class="size-4.5" fill="none" viewBox="0 0 24 24" stroke-width="2.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 7a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></svg>
                            <span class="text-[11px] font-bold uppercase">Utilisateurs</span>
                        </a>
                        <!-- Classes -->
                        <a href="#" class="flex items-center gap-3.5 px-5 py-3 rounded-xl text-slate-500 hover:bg-slate-50 hover:text-slate-900 transition-all">
                            <svg class="size-4.5" fill="none" viewBox="0 0 24 24" stroke-width="2.5"><path d="M19 11H5m14 0a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2m14 0V9a2 2 0 0 0-2-2M5 11V9a2 2 0 0 1 2-2m0 0V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v2M7 7h10"/></svg>
                            <span class="text-[11px] font-bold uppercase">Cohortes</span>
                        </a>
                        <!-- QCMs -->
                        <a href="#" class="flex items-center gap-3.5 px-5 py-3 rounded-xl text-slate-500 hover:bg-slate-50 hover:text-slate-900 transition-all">
                            <svg class="size-4.5" fill="none" viewBox="0 0 24 24" stroke-width="2.5"><path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
                            <span class="text-[11px] font-bold uppercase">Banque QCM</span>
                        </a>
                        <!-- Pedagogie -->
                        <a href="#" class="flex items-center gap-3.5 px-5 py-3 rounded-xl text-slate-500 hover:bg-slate-50 hover:text-slate-900 transition-all">
                            <svg class="size-4.5" fill="none" viewBox="0 0 24 24" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                            <span class="text-[11px] font-bold uppercase">Ingénierie Péd.</span>
                        </a>
                    </nav>

                    <!-- Bottom Profile -->
                    <div class="p-4 border-t border-slate-100">
                        <div class="flex items-center gap-3 p-3 rounded-2xl hover:bg-slate-50 transition-all cursor-pointer">
                            <div class="size-10 bg-primary-500 rounded-xl flex items-center justify-center text-white font-bold text-sm">SA</div>
                            <div class="flex-1 min-w-0">
                                <p class="text-sm font-bold text-slate-900 truncate">Sarah Alami</p>
                                <p class="text-xs text-slate-500 truncate">sarah@solicode.co</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col min-w-0 lg:ml-72">
            <main class="flex-1 overflow-y-auto min-h-0">
                <div class="p-4 lg:p-10 pt-0 lg:pt-0">
                    <div class="max-w-[1600px] mx-auto pt-10">
                        <!-- Page Content Here -->
                    </div>
                </div>
            </main>
        </div>
    </div>
</body>

</html>
