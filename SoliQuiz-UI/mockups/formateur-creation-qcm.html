<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoliQuiz - Créer un QCM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], heading: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: { primary: { 50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 300: '#7dd3fc', 400: '#38bdf8', 500: '#17B0CF', 600: '#0ea5e9', 700: '#0284c7', 800: '#0369a1', 900: '#0c4a6e' } }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 min-h-screen font-sans antialiased">

@include('layout-app-sidebar')

<div class="ml-64 min-h-screen" x-data="{ titre: '', questions: [{texte: '', points: 4, type: 'choix_unique', options: [{texte: '', est_correcte: false}, {texte: '', est_correcte: false}]}] }">
    <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-slate-200">
        <div class="flex items-center justify-between h-16 px-6">
            <div class="flex items-center gap-4">
                <button class="lg:hidden size-10 flex items-center justify-center rounded-xl hover:bg-slate-100 text-slate-500">
                    <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                <h1 class="text-lg font-bold text-slate-900">Studio de Création</h1>
            </div>
            <div class="flex items-center gap-3">
                <button type="button" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl text-xs font-bold uppercase tracking-widest hover:bg-slate-200 transition-all">Enregistrer</button>
                <button type="submit" form="qcmForm" class="px-4 py-2 bg-primary-500 text-white rounded-xl text-xs font-bold uppercase tracking-widest hover:bg-primary-600 transition-all">Publier</button>
            </div>
        </div>
    </header>

    <main class="p-6 pb-32">
        <form id="qcmForm" class="flex flex-col lg:flex-row gap-6 xl:gap-8 items-start">
            <div class="flex-1 w-full space-y-8">
                <div class="bg-white rounded-3xl border border-slate-100 shadow-sm p-6 md:p-8 relative overflow-hidden">
                    <div class="absolute top-0 right-0 p-8 opacity-5">
                        <svg class="size-32" fill="currentColor" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="m9 15 2 2 4-4"/></svg>
                    </div>
                    <div class="relative z-10 space-y-3">
                        <label class="text-xs font-bold text-slate-400 uppercase tracking-widest ml-1">Identité de l'évaluation</label>
                        <input type="text" name="titre" x-model="titre" required class="w-full bg-slate-50/50 border-2 border-transparent rounded-2xl py-4 px-6 text-2xl font-black text-slate-900 placeholder:text-slate-200 focus:bg-white focus:border-primary-500 transition-all outline-none uppercase italic" placeholder="Saisir le titre du QCM...">
                    </div>
                </div>

                <template x-for="(question, qIndex) in questions" :key="qIndex">
                    <article class="bg-white rounded-3xl border border-slate-100 shadow-sm hover:shadow-xl transition-all duration-500 overflow-hidden">
                        <div class="px-10 py-6 border-b border-slate-50 flex items-center justify-between bg-slate-50/20">
                            <div class="flex items-center gap-6">
                                <div class="size-12 rounded-2xl bg-slate-900 text-white flex items-center justify-center text-lg font-black italic shadow-xl shadow-slate-900/10" x-text="qIndex + 1"></div>
                                <div class="flex flex-col">
                                    <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Configuration de l'item</span>
                                    <div class="flex items-center gap-3 mt-1">
                                        <span class="text-[10px] font-black text-primary-500 uppercase tracking-widest" x-text="question.type === 'choix_unique' ? 'Réponse Unique' : 'Réponses Multiples'"></span>
                                        <span class="size-1 rounded-full bg-slate-200"></span>
                                        <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest" x-text="`${question.points} Points`"></span>
                                    </div>
                                </div>
                            </div>
                            <button type="button" @click="questions.splice(qIndex, 1)" class="p-3 text-slate-300 hover:text-rose-500 transition-colors">
                                <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke-width="2.5"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                            </button>
                        </div>

                        <div class="p-6 md:p-8 space-y-8">
                            <div class="flex flex-col md:flex-row gap-6">
                                <div class="w-24 shrink-0 space-y-3">
                                    <label class="text-xs font-bold text-slate-400 uppercase tracking-widest ml-1">Points</label>
                                    <input type="number" x-model.number="question.points" :name="`questions[${qIndex}][points]`" class="w-full py-3 rounded-2xl border-none bg-slate-50 font-black text-xl text-slate-900 text-center focus:bg-white transition-all outline-none">
                                </div>
                                <div class="flex-1 space-y-3">
                                    <label class="text-xs font-bold text-slate-400 uppercase tracking-widest ml-1">Énoncé Pédagogique</label>
                                    <textarea x-model="question.texte" :name="`questions[${qIndex}][texte]`" required rows="2" class="w-full py-4 px-6 rounded-2xl bg-slate-50 border-none font-bold text-lg text-slate-900 placeholder:text-slate-200 focus:bg-white focus:ring-4 focus:ring-primary-500/10 transition-all outline-none resize-none" placeholder="Formuler la question..."></textarea>
                                </div>
                            </div>

                            <div class="space-y-4">
                                <div class="flex items-center justify-between border-b border-slate-50 pb-5">
                                    <div class="flex items-center gap-3">
                                        <h4 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.3em] italic">Options Strategiques</h4>
                                        <span class="px-3 py-1 rounded-full text-[9px] font-black uppercase bg-blue-100 text-blue-600">UNIQUE</span>
                                    </div>
                                </div>

                                <template x-for="(option, oIndex) in question.options" :key="oIndex">
                                    <div class="flex items-center gap-4">
                                        <input type="checkbox" :value="true" :name="`questions[${qIndex}][options][${oIndex}][est_correcte]`" :checked="option.est_correcte" class="size-5 rounded border-slate-200 text-primary-500 focus:ring-primary-500">
                                        <input type="text" :name="`questions[${qIndex}][options][${oIndex}][texte]`" x-model="option.texte" class="flex-1 py-3 px-4 rounded-xl bg-slate-50 border-none font-bold text-slate-900 focus:bg-white transition-all" placeholder="Texte de l'option...">
                                        <button type="button" @click="question.options.splice(oIndex, 1)" class="p-2 text-slate-300 hover:text-rose-500">
                                            <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke-width="2.5"><path d="M6 18L18 6M6 6l12 12"/></svg>
                                        </button>
                                    </div>
                                </template>

                                <button type="button" @click="question.options.push({texte: '', est_correcte: false})" class="w-full py-3 border-2 border-dashed border-slate-200 rounded-xl text-sm font-bold text-slate-400 hover:border-primary-300 hover:text-primary-500 transition-all">
                                    + Ajouter une option
                                </button>
                            </div>
                        </div>
                    </article>
                </template>

                <button type="button" @click="questions.push({texte: '', points: 4, type: 'choix_unique', options: [{texte: '', est_correcte: false}, {texte: '', est_correcte: false}]})" class="w-full py-4 bg-white rounded-2xl border-2 border-dashed border-slate-200 text-sm font-bold text-slate-400 hover:border-primary-300 hover:text-primary-500 transition-all flex items-center justify-center gap-2">
                    <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke-width="2.5"><path d="M12 4v16m8-8H4"/></svg>
                    Ajouter une question
                </button>
            </div>

            <div class="w-80 shrink-0 space-y-6">
                <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-6">
                    <h3 class="text-sm font-black text-slate-900 uppercase tracking-widest mb-4">Configuration</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-2">Module</label>
                            <select name="unite_apprentissage_id" class="w-full py-3 px-4 rounded-xl bg-slate-50 border-none font-bold text-slate-900 focus:bg-white transition-all">
                                <option value="">Sélectionner...</option>
                                <option value="1">Algorithmique de Base</option>
                                <option value="2">Base de Données</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-2">Durée (minutes)</label>
                            <input type="number" name="duree_minutes" value="30" class="w-full py-3 px-4 rounded-xl bg-slate-50 border-none font-bold text-slate-900 focus:bg-white transition-all">
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-2">Seuil de réussite</label>
                            <input type="number" name="score_reussite" value="10" class="w-full py-3 px-4 rounded-xl bg-slate-50 border-none font-bold text-slate-900 focus:bg-white transition-all">
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </main>
</div>

</body>
</html>
