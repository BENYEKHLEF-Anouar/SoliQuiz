<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banque de QCM - SoliQuiz UI</title>
    
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">

    <!-- Tailwind V4 CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Custom Design System -->
    <link rel="stylesheet" href="../charte-graphique/app.css">
    
    <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="font-sans antialiased text-slate-800 bg-slate-50 h-screen overflow-hidden">
    <div class="flex h-screen overflow-hidden p-0 m-0" x-data="{ sidebarOpen: false }">
        
        <!-- Sidebar -->
        <aside :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'"
               class="fixed top-0 left-0 w-72 transition-transform duration-300 ease-out z-70 h-screen shrink-0">
            <div class="h-full p-4 text-left">
                <div class="h-full bg-white rounded-[2.5rem] border border-slate-100 shadow-premium flex flex-col overflow-hidden relative">
                    <div class="p-8 border-b border-slate-50">
                        <a class="flex items-center gap-3 transition-transform active:scale-95 outline-none" href="#">
                            <div class="size-10 bg-primary-500 rounded-2xl flex items-center justify-center shadow-lg shadow-primary-500/25 text-white">
                                <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><polyline points="14 2 14 8 20 8" /><path d="m9 15 2 2 4-4" /></svg>
                            </div>
                            <div class="flex flex-col leading-none">
                                <span class="text-2xl font-heading font-black text-slate-900 tracking-tighter leading-none italic uppercase">Soli<span class="text-primary-500">Quiz</span></span>
                                <span class="text-[9px] font-black text-slate-400 uppercase tracking-widest mt-1.5 italic">Espace Admin</span>
                            </div>
                        </a>
                    </div>
                    <nav class="flex-1 px-4 py-8 space-y-8 overflow-y-auto custom-scrollbar">
                        <div>
                            <p class="text-label px-5 mb-5 italic">Général</p>
                            <div class="space-y-1">
                                <a href="06-admin-dashboard.html" class="group flex items-center gap-4 px-6 py-3.5 rounded-2xl text-slate-500 hover:bg-primary-50 hover:text-primary-600 transition-all italic">
                                    <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z" /></svg>
                                    <span class="text-xs font-black uppercase tracking-widest">Tableau de Bord</span>
                                </a>
                            </div>
                        </div>
                    </nav>
                </div>
            </div>
        </aside>

        <!-- Content Area -->
        <div class="flex-1 flex flex-col min-w-0 p-0 m-0 lg:ml-72">
            <main class="flex-1 overflow-y-auto custom-scrollbar min-h-0 bg-slate-50 pt-16 lg:pt-0">
                <div class="p-4 lg:p-10 pt-0 lg:pt-0 text-left">
                    <div class="max-w-[1600px] mx-auto pt-10">
                        <div class="fade-in space-y-12 pb-20">
                            <!-- Header Strategy Bar -->
                            <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-6 pb-10 border-b border-slate-100 mb-10">
                                <div>
                                    <p class="text-label mb-1 italic">Ressources Pédagogiques</p>
                                    <h3 class="text-2xl font-black text-slate-900 tracking-tight italic uppercase">Global <span class="text-transparent bg-clip-text bg-gradient-to-r from-primary-600 to-primary-400">Library</span></h3>
                                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1 italic">Gestion centralisée des actifs d'évaluation</p>
                                </div>
                                
                                <div class="flex items-center gap-4">
                                    <div class="hidden sm:flex items-center gap-6 px-8 py-4 bg-white rounded-[24px] border border-slate-100 shadow-sm relative overflow-hidden group">
                                        <div class="relative z-10 text-right">
                                            <p class="text-2xl font-black text-slate-900 italic leading-none mb-1">156</p>
                                            <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest italic">QCM Indexés</p>
                                        </div>
                                        <div class="relative z-10 size-12 bg-primary-50 rounded-xl flex items-center justify-center text-primary-500 shadow-lg shadow-primary-500/10">
                                            <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/></svg>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Search -->
                            <div class="flex flex-col md:flex-row gap-4 items-center">
                                <div class="flex-1 relative group w-full">
                                    <label class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-primary-500 transition-colors pointer-events-none pl-2">
                                        <svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                                            <circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path>
                                        </svg>
                                    </label>
                                    <input type="text" placeholder="Rechercher une évaluation, un module ou un auteur..." class="w-full h-14 pl-14 pr-6 bg-white border border-slate-100 rounded-2xl font-bold text-slate-900 text-sm placeholder:text-slate-300 focus:border-primary-500 focus:ring-4 focus:ring-primary-500/5 transition-all shadow-sm outline-none italic">
                                </div>
                            </div>

                            <!-- QCM Grid -->
                            <div class="grid grid-cols-1 md:grid-cols-2 2xl:grid-cols-3 gap-8">
                                <div class="group bg-white rounded-[3rem] p-10 border border-slate-100 shadow-premium hover:shadow-2xl hover:-translate-y-2 transition-all duration-500 relative overflow-hidden flex flex-col h-full">
                                    <div class="absolute -right-12 -top-12 size-40 bg-primary-50/50 rounded-full group-hover:scale-150 transition-all duration-700"></div>
                                    
                                    <div class="flex items-center justify-between mb-10 relative z-10">
                                        <span class="px-5 py-2 rounded-full text-[9px] font-black uppercase tracking-widest italic bg-emerald-100 text-emerald-600 shadow-sm">Public</span>
                                        <span class="text-[10px] font-black text-slate-200 uppercase tracking-widest italic">QCM-0042</span>
                                    </div>

                                    <div class="relative z-10 flex-1">
                                        <h3 class="text-2xl font-heading font-black text-slate-900 group-hover:text-primary-600 transition-colors leading-tight mb-6 italic uppercase tracking-tight">Architecture MVC / Laravel</h3>
                                        <div class="space-y-5 mb-12">
                                            <div class="flex items-center gap-4">
                                                <div class="size-10 rounded-xl bg-slate-50 border border-slate-100 flex items-center justify-center text-primary-500 shadow-sm">
                                                    <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.247 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>
                                                </div>
                                                <div>
                                                    <p class="text-[8px] font-black text-slate-400 uppercase tracking-widest italic mb-1">Module</p>
                                                    <p class="text-xs font-black text-slate-600 italic uppercase">Développement Backend</p>
                                                </div>
                                            </div>
                                            <div class="grid grid-cols-2 gap-4">
                                                <div class="bg-slate-50 rounded-2xl p-5 border border-slate-100 italic transition-all group-hover:bg-white group-hover:shadow-lg group-hover:border-primary-100">
                                                    <p class="text-[8px] font-black text-slate-400 uppercase tracking-widest mb-1">Durée</p>
                                                    <p class="text-xl font-black text-slate-900">45<span class="text-[10px] uppercase ml-1">min</span></p>
                                                </div>
                                                <div class="bg-slate-50 rounded-2xl p-5 border border-slate-100 italic transition-all group-hover:bg-white group-hover:shadow-lg group-hover:border-primary-100">
                                                    <p class="text-[8px] font-black text-slate-400 uppercase tracking-widest mb-1">Questions</p>
                                                    <p class="text-xl font-black text-slate-900">20</p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="pt-8 border-t border-slate-50 mt-auto flex items-center justify-between relative z-10">
                                        <div class="flex items-center gap-4">
                                            <img class="size-10 rounded-2xl bg-slate-50 border-2 border-white shadow-sm" src="https://ui-avatars.com/api/?name=Ahmed+Pro&background=f8fafc&color=0f172a&bold=true" alt="">
                                            <div class="flex flex-col text-left">
                                                <p class="text-[11px] font-black text-slate-900 uppercase italic leading-none">Ahmed Pro</p>
                                                <p class="text-[8px] font-black text-slate-400 uppercase tracking-widest mt-1.5 italic">Auteur</p>
                                            </div>
                                        </div>
                                        <div class="flex items-center gap-3">
                                            <button class="size-12 bg-slate-900 text-white rounded-2xl flex items-center justify-center hover:bg-primary-500 hover:shadow-xl hover:-translate-y-1 transition-all shadow-lg active:scale-95"><svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg></button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
