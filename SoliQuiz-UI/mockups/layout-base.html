    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        heading: ['"Plus Jakarta Sans"', 'sans-serif']
                    },
                    colors: {
                        primary: {
                            50: '#f0f9ff',

                            200: '#bae6fd',
                            300: '#7dd3fc',

            }
        }
    </script>

    <!-- Alpine.js -->

    <style>[x-cloak] { display: none !important; }</style>

<body class="font-sans antialiased text-slate-800 bg-slate-50 min-h-screen">
    <!-- Content Here -->
    
    <!-- Toast Component Placeholder -->
    <div x-data="{ show: false, message: '', type: 'success' }" x-show="show" x-transition class="fixed top-4 right-4 z-50 bg-white border border-slate-200 rounded-xl p-4 flex items-center gap-3 shadow-lg" style="display: none;">
        <div class="size-8 bg-emerald-50 rounded-full flex items-center justify-center">
            <svg class="size-4 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M5 13l4 4L19 7"/></svg>
        </div>
        <div class="flex-1"><p class="text-sm font-bold text-slate-900">Succès</p><p class="text-xs text-slate-500">Message</p></div>
    </div>

    <!-- Confirm Modal Placeholder -->
    <div x-data="{ show: false }" x-show="show" x-transition class="fixed inset-0 z-50 flex items-center justify-center" style="display: none;">
        <div class="fixed inset-0 bg-slate-900/50" @click="show = false"></div>
        <div class="relative bg-white border border-slate-200 rounded-2xl shadow-2xl overflow-hidden max-w-md w-full p-6">
            <div class="size-12 bg-red-50 rounded-2xl flex items-center justify-center mb-4">

            <h2 class="text-lg font-black text-slate-900 mb-2">Confirmer</h2>
            <p class="text-sm text-slate-500">Êtes-vous sûr ?</p>
            <div class="flex justify-end gap-3 mt-6">
                <button class="px-4 py-2 border border-slate-200 text-slate-600 rounded-xl text-sm font-bold hover:bg-slate-50">Annuler</button>
                <button class="px-4 py-2 bg-red-500 text-white rounded-xl text-sm font-bold hover:bg-red-600">Confirmer</button>
            </div>
        </div>
    </div>
