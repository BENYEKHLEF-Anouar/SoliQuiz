<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>18 - Édition QCM Formateur - SoliQuiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] }, colors: { primary: { 50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 300: '#7dd3fc', 400: '#38bdf8', 500: '#17B0CF', 600: '#0ea5e9', 700: '#0284c7', 800: '#0369a1', 900: '#0c4a6e' } } } } }
    </script>
</head>
<body class="bg-slate-900 font-sans text-slate-800 h-screen overflow-hidden">
    <div class="flex h-screen">
        <aside class="hidden lg:block w-72 h-full p-4 shrink-0">
            <div class="h-full bg-slate-800 rounded-3xl border border-slate-700 flex flex-col">
                <div class="p-6 border-b border-slate-700">
                    <a href="#" class="flex items-center gap-3">
                        <div class="size-9 bg-[#17B0CF] rounded-xl flex items-center justify-center shadow-lg text-white"><svg class="size-5" fill="none" viewBox="0 0 24 24" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="m9 15 2 2 4-4"/></svg></div>
                        <div class="flex flex-col"><span class="text-lg font-black text-white uppercase italic">Soli<span class="text-[#17B0CF]">Quiz</span></span><span class="text-[8px] font-black text-slate-400 uppercase">Formateur</span></div>
                    </a>
                </div>
                <nav class="flex-1 px-3 py-6">
                    <a href="#" class="flex items-center gap-3.5 px-5 py-3 rounded-xl text-slate-400 hover:bg-slate-700 hover:text-white transition-all italic"><svg class="size-4.5" fill="none" viewBox="0 0 24 24" stroke-width="2.5"><path d="M12 20v-6M6 20V10M18 20V4"/></svg><span class="text-[11px] font-bold uppercase">Dashboard</span></a>
                    <a href="#" class="flex items-center gap-3.5 px-5 py-3 rounded-xl text-slate-400 hover:bg-slate-700 hover:text-white transition-all italic"><svg class="size-4.5" fill="none" viewBox="0 0 24 24" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg><span class="text-[11px] font-bold uppercase">Mes Classes</span></a>
                    <a href="#" class="flex items-center gap-3.5 px-5 py-3 rounded-xl bg-[#17B0CF] text-white shadow-lg shadow-[#17B0CF]/20 italic"><svg class="size-4.5" fill="none" viewBox="0 0 24 24" stroke-width="2.5"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2m-6 9l2 2 4-4"/></svg><span class="text-[11px] font-bold uppercase">QCMs</span></a>
                </nav>
            </div>
        </aside>
        <div class="flex-1 flex flex-col min-w-0">
            <main class="flex-1 overflow-y-auto p-4 lg:p-10">
                <div class="max-w-[1400px] mx-auto pt-6 space-y-6">
                    <div class="flex items-center gap-2 text-[9px] font-black text-slate-400 uppercase tracking-widest mb-3">
                        <a href="#" class="hover:text-[#17B0CF] transition-colors">Mes QCMs</a>
                        <span class="size-1 rounded-full bg-slate-200"></span>
                        <span class="text-white">Modifier</span>
                    </div>
                    <div class="bg-slate-800 border border-slate-700 rounded-[2rem] p-8">
                        <div class="space-y-6">
                            <div class="grid grid-cols-2 gap-4">
                                <div><label class="block text-xs font-bold text-slate-400 uppercase mb-2">Titre du QCM</label><input type="text" value="HTML & CSS - Contrôle 1" class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-xl text-white"></div>
                                <div><label class="block text-xs font-bold text-slate-400 uppercase mb-2">Unité d'apprentissage</label><select class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-xl text-white"><option>UA1 - HTML & CSS</option><option>UA2 - JavaScript</option></select></div>
                            </div>
                            <div><label class="block text-xs font-bold text-slate-400 uppercase mb-2">Description</label><textarea rows="3" class="w-full px-4 py-3 bg-slate-700 border border-slate-600 rounded-xl text-white">Contrôle sur les bases HTML et CSS</textarea></div>
                            <div class="border-t border-slate-700 pt-6">
                                <div class="flex items-center justify-between mb-4"><h4 class="text-white font-bold">Questions</h4><button class="px-4 py-2 bg-[#17B0CF] text-white text-xs font-bold rounded-lg hover:bg-[#14a0bd]">+ Ajouter Question</button></div>
                                <div class="space-y-4">
                                    <div class="bg-slate-700/50 border border-slate-600 p-4 rounded-xl">
                                        <div class="flex gap-4 mb-3"><span class="text-[#17B0CF] font-bold">Q1</span><input type="text" value="What does HTML stand for?" class="flex-1 bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white text-sm"></div>
                                        <div class="space-y-2 ml-8"><div class="flex items-center gap-2"><input type="radio" name="q1" class="accent-[#17B0CF]"><input type="text" value="Hyper Text Markup Language" class="flex-1 bg-slate-700 border border-slate-600 rounded-lg px-3 py-1 text-white text-sm"></div><div class="flex items-center gap-2"><input type="radio" name="q1"><input type="text" value="High Tech Modern Language" class="flex-1 bg-slate-700 border border-slate-600 rounded-lg px-3 py-1 text-white text-sm"></div></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="flex justify-end gap-4 mt-6 pt-6 border-t border-slate-700">
                            <button class="px-6 py-3 border border-slate-600 text-slate-300 rounded-xl hover:bg-slate-700 font-bold">Annuler</button>
                            <button class="px-6 py-3 bg-[#17B0CF] text-white rounded-xl hover:bg-[#14a0bd] font-bold">Enregistrer</button>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
