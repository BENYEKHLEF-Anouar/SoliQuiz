<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>08 - Inscription - SoliQuiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        primary: {
                            50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd',
                            300: '#7dd3fc', 400: '#38bdf8', 500: '#17B0CF',
                            600: '#0ea5e9', 700: '#0284c7', 800: '#0369a1', 900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 font-sans antialiased text-slate-800 min-h-screen">
    <div class="min-h-screen flex items-center justify-center p-6 lg:p-12">
        <div class="w-full max-w-[540px]">
            <!-- Logo Header -->
            <div class="flex justify-center mb-10">
                <a href="#" class="flex items-center gap-3 group">
                    <div class="size-11 bg-[#17B0CF] rounded-[16px] flex items-center justify-center shadow-xl shadow-[#17B0CF]/25">
                        <svg class="text-white size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="m9 15 2 2 4-4"/></svg>
                    </div>
                    <span class="text-2xl font-black tracking-tight text-slate-900">Soli<span class="text-[#17B0CF]">Quiz</span></span>
                </a>
            </div>

            <!-- Auth Card -->
            <div class="bg-white rounded-[40px] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100 overflow-hidden">
                <div class="p-8 lg:p-10">
                    <div class="text-center mb-10">
                        <h1 class="text-3xl font-black text-slate-900 tracking-tight leading-none mb-3 uppercase">Créer un <span class="text-[#17B0CF]">Profil</span></h1>
                        <p class="text-slate-400 font-bold uppercase tracking-widest text-[9px]">Rejoignez l'écosystème Solicode</p>
                    </div>

                    <form class="space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="space-y-2">
                                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-4">Prénom</label>
                                <input type="text" class="w-full bg-slate-50 border-2 border-transparent rounded-[20px] py-3.5 px-6 font-bold text-slate-900 focus:bg-white focus:border-[#17B0CF] outline-none transition-all placeholder:text-slate-300" placeholder="Jean">
                            </div>
                            <div class="space-y-2">
                                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-4">Nom</label>
                                <input type="text" class="w-full bg-slate-50 border-2 border-transparent rounded-[20px] py-3.5 px-6 font-bold text-slate-900 focus:bg-white focus:border-[#17B0CF] outline-none transition-all placeholder:text-slate-300" placeholder="Dupont">
                            </div>
                        </div>

                        <div class="space-y-2">
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-4">Email Académique</label>
                            <input type="email" class="w-full bg-slate-50 border-2 border-transparent rounded-[24px] py-3.5 px-6 font-bold text-slate-900 focus:bg-white focus:border-[#17B0CF] outline-none transition-all placeholder:text-slate-300" placeholder="votre@solicode.co">
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="space-y-2">
                                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-4">Mot de passe</label>
                                <input type="password" class="w-full bg-slate-50 border-2 border-transparent rounded-[20px] py-3.5 px-6 font-bold text-slate-900 focus:bg-white focus:border-[#17B0CF] outline-none transition-all placeholder:text-slate-300" placeholder="········">
                            </div>
                            <div class="space-y-2">
                                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-4">Confirmation</label>
                                <input type="password" class="w-full bg-slate-50 border-2 border-transparent rounded-[20px] py-3.5 px-6 font-bold text-slate-900 focus:bg-white focus:border-[#17B0CF] outline-none transition-all placeholder:text-slate-300" placeholder="········">
                            </div>
                        </div>

                        <button type="submit" class="w-full py-5 px-8 bg-slate-900 text-white font-black rounded-[24px] hover:bg-[#17B0CF] shadow-2xl shadow-slate-900/10 active:scale-[0.98] transition-all uppercase tracking-widest text-sm flex items-center justify-center gap-3 mt-4">
                            Créer mon accès
                            <svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg>
                        </button>
                    </form>
                </div>

                <div class="bg-slate-50 border-t border-slate-100 p-8 text-center">
                    <p class="text-[11px] font-bold text-slate-400 uppercase tracking-widest">
                        Déjà inscrit ?
                        <a href="01-auth-login.html" class="text-[#17B0CF] hover:text-[#17B0CF] ml-1 transition-colors">Se connecter</a>
                    </p>
                </div>
            </div>

            <p class="mt-8 text-center text-[10px] font-black text-slate-400 uppercase tracking-[0.3em]">
                SoliQuiz — Powered by Solicode
            </p>
        </div>
    </div>
</body>
</html>
