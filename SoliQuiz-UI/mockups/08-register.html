<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - SoliQuiz UI</title>
    
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">

    <!-- Tailwind V4 CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        heading: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: 'hsl(190, 85%, 96%)',
                            100: 'hsl(190, 85%, 90%)',
                            200: 'hsl(190, 85%, 80%)',
                            300: 'hsl(190, 80%, 70%)',
                            400: 'hsl(190, 75%, 60%)',
                            500: 'hsl(190, 80%, 45%)',
                            600: 'hsl(190, 85%, 35%)',
                            700: 'hsl(190, 85%, 28%)',
                            800: 'hsl(190, 80%, 22%)',
                            900: 'hsl(190, 75%, 15%)',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Custom Design System -->
    <link rel="stylesheet" href="../charte-graphique/app.css">
    
    <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="bg-slate-50 font-sans antialiased min-h-screen">
    <div class="min-h-screen bg-mesh flex items-center justify-center p-6 lg:p-12">
        <div class="w-full max-w-[540px]">
            <!-- Logo Header -->
            <div class="flex justify-center mb-10">
                <a href="14-public-landing.html" class="flex items-center gap-3 group transition-transform hover:scale-105 active:scale-95 outline-none">
                    <div class="size-11 bg-primary-500 rounded-[16px] flex items-center justify-center shadow-xl shadow-primary-500/25">
                        <svg class="text-white size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                            <polyline points="14 2 14 8 20 8" />
                            <path d="m9 15 2 2 4-4" />
                        </svg>
                    </div>
                    <span class="text-2xl font-heading font-black tracking-tight text-slate-900 italic uppercase">Soli<span class="text-primary-500">Quiz</span></span>
                </a>
            </div>

            <!-- Auth Card -->
            <div class="bg-white rounded-[40px] shadow-premium border border-slate-100 overflow-hidden relative">
                <div class="p-8 lg:p-10 relative z-10">
                    <div class="text-center mb-10">
                        <h1 class="text-3xl font-heading font-black text-slate-900 tracking-tight leading-none mb-3 uppercase italic">Créer un <span class="text-primary-500">Profil</span></h1>
                        <p class="text-slate-400 font-bold uppercase tracking-widest text-[9px] italic">Rejoignez l'écosystème Solicode</p>
                    </div>

                    <form class="space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 text-left">
                            <div class="space-y-2">
                                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-4 italic leading-none">Prénom</label>
                                <input type="text" class="w-full bg-slate-50 border-2 border-transparent rounded-[20px] py-3.5 px-6 font-bold text-slate-900 focus:bg-white focus:border-primary-500 outline-none transition-all placeholder:text-slate-300 italic"
                                    placeholder="Jean" required autofocus>
                            </div>
                            <div class="space-y-2 text-left">
                                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-4 italic leading-none">Nom</label>
                                <input type="text" class="w-full bg-slate-50 border-2 border-transparent rounded-[20px] py-3.5 px-6 font-bold text-slate-900 focus:bg-white focus:border-primary-500 outline-none transition-all placeholder:text-slate-300 italic"
                                    placeholder="Dupont" required>
                            </div>
                        </div>

                        <div class="space-y-2 text-left">
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-4 italic leading-none">Email Académique</label>
                            <input type="email" class="w-full bg-slate-50 border-2 border-transparent rounded-[24px] py-3.5 px-6 font-bold text-slate-900 focus:bg-white focus:border-primary-500 outline-none transition-all placeholder:text-slate-300 italic"
                                placeholder="votre@solicode.co" required>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 text-left">
                            <div class="space-y-2">
                                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-4 italic leading-none">Mot de passe</label>
                                <input type="password" class="w-full bg-slate-50 border-2 border-transparent rounded-[20px] py-3.5 px-6 font-bold text-slate-900 focus:bg-white focus:border-primary-500 outline-none transition-all placeholder:text-slate-300 italic"
                                    placeholder="········" required>
                            </div>
                            <div class="space-y-2 text-left">
                                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-4 italic leading-none">Confirmation</label>
                                <input type="password" class="w-full bg-slate-50 border-2 border-transparent rounded-[20px] py-3.5 px-6 font-bold text-slate-900 focus:bg-white focus:border-primary-500 outline-none transition-all placeholder:text-slate-300 italic"
                                    placeholder="········" required>
                            </div>
                        </div>

                        <button type="submit"
                            class="w-full py-5 px-8 bg-slate-900 text-white font-black rounded-[24px] hover:bg-primary-500 shadow-2xl shadow-slate-900/10 active:scale-[0.98] transition-all uppercase tracking-widest text-sm flex items-center justify-center gap-3 mt-4 italic">
                            Créer mon accès
                            <svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path d="M13 7l5 5m0 0l-5 5m5-5H6" /></svg>
                        </button>
                    </form>
                </div>

                <div class="bg-slate-50 border-t border-slate-100 p-8 text-center">
                    <p class="text-[11px] font-bold text-slate-400 uppercase tracking-widest italic">
                        Déjà inscrit ? 
                        <a href="01-auth-login.html" class="text-primary-500 hover:text-primary-600 ml-1 transition-colors">Se connecter</a>
                    </p>
                </div>
            </div>
            
            <p class="mt-8 text-center text-[10px] font-black text-slate-400 uppercase tracking-[0.3em] italic">
                SoliQuiz — Powered by Solicode
            </p>
        </div>
    </div>
</body>
</html>
