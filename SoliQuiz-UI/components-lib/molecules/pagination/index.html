<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molecule: Pagination - SoliQuiz UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 p-10 font-sans">
    <div class="max-w-4xl mx-auto space-y-10">
        <div class="border-b border-slate-200 pb-4">
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.3em] mb-2">Molecule</p>
            <h1 class="text-3xl font-black text-slate-900">Pagination</h1>
            <p class="text-slate-500 mt-2">Navigation paginée</p>
        </div>

        <section class="space-y-4">
            <h2 class="text-lg font-bold text-slate-900">Standard Pagination</h2>
            <div class="p-6 bg-white rounded-2xl border border-slate-200">
                <div class="flex items-center justify-between">
                    <p class="text-xs text-slate-500">Affichage 1-10 sur 45 résultats</p>
                    <div class="flex items-center gap-1">
                        <button class="p-2 rounded-xl bg-slate-100 text-slate-400 hover:bg-slate-200 transition-all disabled:opacity-50">
                            <svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                                <path d="M15 19l-7-7 7-7"/>
                            </svg>
                        </button>
                        <button class="px-4 py-2 rounded-xl bg-[#17B0CF] text-white text-xs font-bold">1</button>
                        <button class="px-4 py-2 rounded-xl bg-white text-slate-600 text-xs font-bold hover:bg-slate-100 transition-all">2</button>
                        <button class="px-4 py-2 rounded-xl bg-white text-slate-600 text-xs font-bold hover:bg-slate-100 transition-all">3</button>
                        <span class="px-2 text-slate-400">...</span>
                        <button class="px-4 py-2 rounded-xl bg-white text-slate-600 text-xs font-bold hover:bg-slate-100 transition-all">5</button>
                        <button class="p-2 rounded-xl bg-white text-slate-600 hover:bg-slate-100 transition-all">
                            <svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                                <path d="M9 5l7 7-7 7"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <section class="space-y-4">
            <h2 class="text-lg font-bold text-slate-900">Compact Pagination</h2>
            <div class="p-6 bg-white rounded-2xl border border-slate-200">
                <div class="flex items-center gap-2">
                    <button class="p-2 rounded-lg bg-white border border-slate-200 text-slate-600 hover:border-[#17B0CF] hover:text-[#17B0CF] transition-all">
                        <svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                            <path d="M15 19l-7-7 7-7"/>
                        </svg>
                    </button>
                    <div class="flex items-center gap-1">
                        <button class="w-8 h-8 rounded-lg bg-[#17B0CF] text-white text-xs font-bold">1</button>
                        <button class="w-8 h-8 rounded-lg bg-white text-slate-600 text-xs font-bold hover:bg-slate-100">2</button>
                        <button class="w-8 h-8 rounded-lg bg-white text-slate-600 text-xs font-bold hover:bg-slate-100">3</button>
                    </div>
                    <button class="p-2 rounded-lg bg-white border border-slate-200 text-slate-600 hover:border-[#17B0CF] hover:text-[#17B0CF] transition-all">
                        <svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                            <path d="M9 5l7 7-7 7"/>
                        </svg>
                    </button>
                </div>
            </div>
        </section>

        <section class="space-y-4">
            <h2 class="text-lg font-bold text-slate-900">Load More</h2>
            <div class="p-6 bg-white rounded-2xl border border-slate-200 text-center">
                <button class="px-8 py-3 bg-slate-100 text-slate-700 text-[11px] font-black uppercase tracking-widest rounded-2xl hover:bg-[#17B0CF] hover:text-white transition-all">
                    Charger plus de résultats
                </button>
            </div>
        </section>
    </div>
</body>
</html>
