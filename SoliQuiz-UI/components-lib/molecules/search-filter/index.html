<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Filter - Molécules</title>
    
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">

    <!-- Tailwind V4 CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        heading: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: 'hsl(190, 85%, 96%)',
                            100: 'hsl(190, 85%, 90%)',
                            200: 'hsl(190, 85%, 80%)',
                            300: 'hsl(190, 80%, 70%)',
                            400: 'hsl(190, 75%, 60%)',
                            500: 'hsl(190, 80%, 45%)',
                            600: 'hsl(190, 85%, 35%)',
                            700: 'hsl(190, 85%, 28%)',
                            800: 'hsl(190, 80%, 22%)',
                            900: 'hsl(190, 75%, 15%)',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../../charte-graphique/app.css">
</head>
<body class="bg-slate-50 p-10 font-sans uppercase">
    <div class="max-w-4xl mx-auto space-y-16">
        <!-- Header -->
        <div class="border-b border-slate-200 pb-10 italic">
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.4em] mb-4 italic">Unité Moléculaire</p>
            <h1 class="text-5xl font-black text-slate-900 italic tracking-tighter uppercase">Filtrage <span class="text-primary-500">Dynamique</span></h1>
            <p class="text-[11px] font-bold text-slate-400 mt-4 uppercase tracking-widest italic">Système de segmentation et exploration de données</p>
        </div>

        <!-- Interactive Filter Bar -->
        <section class="space-y-8">
            <h2 class="text-[11px] font-black text-slate-400 uppercase tracking-[0.3em] italic">Barre de Contrôle Multi-Critères</h2>
            <div class="p-10 bg-white rounded-[3.5rem] border border-slate-100 shadow-premium italic space-y-8">
                <div class="flex flex-col lg:flex-row gap-6 items-center">
                    <!-- Search Field -->
                    <div class="relative flex-1 group w-full">
                        <div class="absolute inset-y-0 left-6 flex items-center pointer-events-none text-slate-300 group-focus-within:text-primary-500 transition-colors">
                            <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
                        </div>
                        <input type="text" placeholder="Infiltrer base de données..." class="h-16 w-full bg-slate-50 border-2 border-transparent rounded-2xl pl-16 pr-8 text-sm font-black text-slate-900 focus:bg-white focus:border-primary-500 focus:ring-8 focus:ring-primary-500/5 outline-none transition-all placeholder:text-slate-200 italic uppercase">
                    </div>

                    <div class="relative w-full lg:w-64 italic" x-data="{ open: false, selected: '', options: [{value:'', label:'Tous les État Flux'},{value:'1', label:'Actif / En Ligne'},{value:'2', label:'Inactif / Standby'}], get selectedLabel(){ return this.options.find(o=>o.value===this.selected)?.label || 'Tous les État Flux'; } }">
                        <button type="button" @click="open = !open" @click.away="open = false"
                            class="h-14 w-full bg-white border-2 border-primary-500 rounded-full px-8 pr-12 font-black text-slate-900 text-[10px] uppercase tracking-widest italic outline-none focus:ring-8 focus:ring-primary-500/5 transition-all cursor-pointer shadow-sm flex items-center justify-between">
                            <span x-text="selectedLabel" class="truncate mr-2"></span>
                            <svg class="size-4 text-primary-500 shrink-0 transition-transform duration-300" :class="open ? 'rotate-180' : ''" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="4"><path d="M19 9l-7 7-7-7" /></svg>
                        </button>
                        <div x-show="open"
                             x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-2 scale-95" x-transition:enter-end="opacity-100 translate-y-0 scale-100"
                             x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100 translate-y-0 scale-100" x-transition:leave-end="opacity-0 translate-y-2 scale-95"
                             class="absolute z-50 w-full mt-3 bg-white border border-slate-100 rounded-[2rem] shadow-premium overflow-hidden p-2" x-cloak>
                            <template x-for="opt in options" :key="opt.value">
                                <button type="button" @click="selected = opt.value; open = false"
                                    class="w-full text-left px-6 py-4 rounded-2xl text-[10px] font-black uppercase tracking-widest italic transition-all"
                                    :class="selected === opt.value ? 'bg-primary-500 text-white shadow-lg shadow-primary-500/20' : 'text-slate-600 hover:bg-primary-50 hover:text-primary-600'"
                                    x-text="opt.label"></button>
                            </template>
                        </div>
                    </div>

                    <!-- Filter Action -->
                    <button class="h-16 px-10 bg-slate-900 text-white rounded-2xl font-black text-[10px] uppercase tracking-[0.2em] hover:bg-primary-500 transition-all shadow-xl shadow-slate-900/10 active:scale-95 italic shrink-0">
                        Exécuter
                    </button>
                </div>

                <!-- Active Tokens -->
                <div class="flex flex-wrap gap-4 items-center pt-6 border-t border-slate-50">
                    <span class="text-[9px] font-black text-slate-300 uppercase tracking-widest italic mr-2">Piles Actives :</span>
                    <span class="inline-flex items-center gap-3 px-5 py-2.5 bg-primary-50 text-primary-600 rounded-xl text-[10px] font-black uppercase tracking-widest italic border border-primary-100 shadow-sm">
                        HTML-01
                        <button class="hover:text-primary-900 transition-colors"><svg class="size-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="4"><path d="M6 18L18 6M6 6l12 12" /></svg></button>
                    </span>
                    <span class="inline-flex items-center gap-3 px-5 py-2.5 bg-slate-100 text-slate-600 rounded-xl text-[10px] font-black uppercase tracking-widest italic border border-slate-200 shadow-sm">
                        STATUT: ACTIF
                        <button class="hover:text-slate-900 transition-colors"><svg class="size-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="4"><path d="M6 18L18 6M6 6l12 12" /></svg></button>
                    </span>
                    <button class="text-[9px] font-black text-rose-400 hover:text-rose-600 transition-colors uppercase tracking-[0.2em] italic ml-auto">Initialiser tout</button>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
