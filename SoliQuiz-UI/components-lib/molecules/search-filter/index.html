<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Filter - Molécules</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] }, colors: { primary: { 500: '#17B0CF' } } } } }
    </script>
</head>
<body class="bg-slate-50 font-sans p-10 space-y-6">
    <div>
        <span class="text-xs font-black text-slate-400 uppercase">Molécules</span>
        <h1 class="text-2xl font-black text-slate-900">Search Filter</h1>
    </div>
    <div class="max-w-2xl space-y-4">
        <div class="bg-white border border-slate-200 rounded-xl p-4 flex flex-wrap gap-3 items-center">
            <div class="relative flex-1 min-w-[200px]">
                <svg class="absolute left-3 top-1/2 -translate-y-1/2 size-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                <input type="text" placeholder="Rechercher..." class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:border-[#17B0CF] focus:ring-2 focus:ring-[#17B0CF]/10 outline-none">
            </div>
            <select class="px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-600 focus:border-[#17B0CF] focus:ring-2 focus:ring-[#17B0CF]/10 outline-none">
                <option>Tous les statuts</option>
                <option>Actif</option>
                <option>Inactif</option>
            </select>
            <select class="px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-600 focus:border-[#17B0CF] focus:ring-2 focus:ring-[#17B0CF]/10 outline-none">
                <option>Tous les rôles</option>
                <option>Admin</option>
                <option>Formateur</option>
                <option>Apprenant</option>
            </select>
            <button class="px-4 py-2.5 bg-slate-900 text-white rounded-lg text-sm font-bold hover:bg-slate-800">Filtrer</button>
        </div>
        <div class="flex gap-2 flex-wrap">
            <span class="inline-flex items-center gap-2 px-3 py-1.5 bg-[#17B0CF]/10 text-[#17B0CF] rounded-full text-xs font-bold">
                HTML × <button class="hover:text-[#14a0bd]">✕</button>
            </span>
            <span class="inline-flex items-center gap-2 px-3 py-1.5 bg-slate-100 text-slate-600 rounded-full text-xs font-bold">
                Actif × <button class="hover:text-slate-900">✕</button>
            </span>
            <button class="text-xs text-slate-500 hover:text-[#17B0CF] underline">Effacer tout</button>
        </div>
    </div>
</body>
</html>
