<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molecule: Hero Dashboard - SoliQuiz UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        primary: {
                            50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd',
                            300: '#7dd3fc', 400: '#38bdf8', 500: '#17B0CF',
                            600: '#0ea5e9', 700: '#0284c7', 800: '#0369a1', 900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 p-10 font-sans">
    <div class="max-w-4xl mx-auto space-y-10">
        <div class="border-b border-slate-200 pb-4">
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.3em] mb-2">Molecule</p>
            <h1 class="text-3xl font-black text-slate-900">Hero Dashboard</h1>
            <p class="text-slate-500 mt-2">Section d'accueil avec titre et stats</p>
        </div>

        <section class="space-y-4">
            <h2 class="text-lg font-bold text-slate-900">Variant Apprenant</h2>
            <div class="p-6 bg-white rounded-2xl border border-slate-200">
                <section class="w-full bg-gradient-to-br from-primary-50 to-white border border-primary-100 rounded-2xl px-6 py-8">
                    <div class="flex flex-wrap items-center justify-between gap-4">
                        <div>
                            <h2 class="text-2xl font-bold text-slate-900">
                                Bonjour <span class="text-[#17B0CF]">Mehdi</span>, here's where you are 👋
                            </h2>
                            <p class="text-sm text-slate-500 mt-1">Continuez sur votre lancée ! Vous avez 1 test en attente.</p>
                        </div>
                        <div class="flex flex-col items-center bg-white border border-primary-100 rounded-2xl px-6 py-3 shadow-sm">
                            <span class="text-xs font-bold text-slate-400 uppercase tracking-wide">Score Global</span>
                            <span class="text-3xl font-black text-[#17B0CF] leading-none mt-1">78%</span>
                        </div>
                    </div>
                </section>
            </div>
        </section>

        <section class="space-y-4">
            <h2 class="text-lg font-bold text-slate-900">Variant Formateur</h2>
            <div class="p-6 bg-white rounded-2xl border border-slate-200">
                <section class="w-full bg-gradient-to-br from-slate-800 to-slate-900 rounded-2xl px-6 py-8">
                    <div class="flex flex-wrap items-center justify-between gap-4">
                        <div>
                            <h2 class="text-2xl font-bold text-white">Supervision de vos cohortes</h2>
                            <p class="text-sm text-slate-400 mt-1">Développeurs Web 101 - DW_101</p>
                        </div>
                        <div class="relative mt-2" x-data="{ open: false, selected: 'DW_101', options: [{value:'DW_101', label:'DW_101'},{value:'DW_102', label:'DW_102'},{value:'DW_103', label:'DW_103'}], get selectedLabel(){ return this.options.find(o=>o.value===this.selected)?.label || 'Choisir Cohorte'; } }">
                            <button type="button" @click="open = !open" @click.away="open = false"
                                class="w-full h-12 bg-slate-800 border-2 border-[#17B0CF] rounded-full px-8 pr-12 text-[10px] font-black uppercase tracking-widest text-white outline-none focus:ring-8 focus:ring-[#17B0CF]/20 transition-all cursor-pointer italic shadow-sm flex items-center justify-between">
                                <span x-text="selectedLabel" class="truncate mr-2"></span>
                                <svg class="size-4 text-[#17B0CF] shrink-0 transition-transform duration-300" :class="open ? 'rotate-180' : ''" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="4"><path d="M19 9l-7 7-7-7" /></svg>
                            </button>
                            <div x-show="open"
                                 x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-2 scale-95" x-transition:enter-end="opacity-100 translate-y-0 scale-100"
                                 x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100 translate-y-0 scale-100" x-transition:leave-end="opacity-0 translate-y-2 scale-95"
                                 class="absolute right-0 z-50 w-48 mt-2 bg-slate-800 border border-slate-700 rounded-[1.5rem] shadow-2xl shadow-slate-900/50 overflow-hidden p-2" x-cloak>
                                <template x-for="opt in options" :key="opt.value">
                                    <button type="button" @click="selected = opt.value; open = false"
                                        class="w-full text-left px-5 py-3.5 rounded-xl text-[10px] font-black uppercase tracking-widest italic transition-all"
                                        :class="selected === opt.value ? 'bg-[#17B0CF] text-white shadow-lg shadow-[#17B0CF]/20' : 'text-slate-300 hover:bg-slate-700 hover:text-white'"
                                        x-text="opt.label"></button>
                                </template>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </section>
    </div>
</body>
</html>
