<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Modal - Molécules</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] }, colors: { primary: { 500: '#17B0CF' } } } } }
    </script>
</head>
<body class="bg-slate-50 font-sans p-10 space-y-6">
    <div>
        <span class="text-xs font-black text-slate-400 uppercase">Molécules</span>
        <h1 class="text-2xl font-black text-slate-900">Confirm Modal</h1>
    </div>
    <div class="max-w-md">
        <div class="bg-white border border-slate-200 rounded-2xl shadow-2xl overflow-hidden">
            <div class="p-6">
                <div class="size-12 bg-red-50 rounded-2xl flex items-center justify-center mb-4">
                    <svg class="size-6 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M7 7h10"/>
                    </svg>
                </div>
                <h2 class="text-lg font-black text-slate-900 mb-2">Confirmer la suppression</h2>
                <p class="text-sm text-slate-500">Êtes-vous sûr de vouloir supprimer cet élément ? Cette action est irréversible.</p>
            </div>
            <div class="px-6 py-4 bg-slate-50 flex justify-end gap-3">
                <button class="px-4 py-2 border border-slate-200 text-slate-600 rounded-xl text-sm font-bold hover:bg-slate-100">Annuler</button>
                <button class="px-4 py-2 bg-red-500 text-white rounded-xl text-sm font-bold hover:bg-red-600">Supprimer</button>
            </div>
        </div>
    </div>
</body>
</html>
