<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molecule: Sidebar - SoliQuiz UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        primary: {
                            50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd',
                            300: '#7dd3fc', 400: '#38bdf8', 500: '#17B0CF',
                            600: '#0ea5e9', 700: '#0284c7', 800: '#0369a1', 900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="bg-slate-100 p-10 font-sans">
    <div class="max-w-6xl mx-auto space-y-10">
        <!-- Header -->
        <div class="border-b border-slate-200 pb-4">
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.3em] mb-2">Molecule</p>
            <h1 class="text-3xl font-black text-slate-900">Sidebar</h1>
            <p class="text-slate-500 mt-2">Navigation latérale avec profil utilisateur</p>
        </div>

        <!-- Sidebar Component -->
        <section class="space-y-4">
            <h2 class="text-lg font-bold text-slate-900">Sidebar Navigation</h2>
            <div class="p-6 bg-slate-100 rounded-2xl border border-slate-200">
                <div class="relative h-[600px] bg-slate-50 rounded-2xl overflow-hidden flex">
                    <!-- Sidebar -->
                    <aside class="w-72 h-full shrink-0">
                        <div class="h-full p-4">
                            <div class="h-full bg-white rounded-3xl border border-slate-100 shadow-sm flex flex-col overflow-hidden">
                                <!-- Logo Section -->
                                <div class="p-6 border-b border-slate-50">
                                    <a class="flex items-center gap-3" href="#">
                                        <div class="size-9 bg-primary-500 rounded-xl flex items-center justify-center shadow-lg shadow-primary-500/20 text-white">
                                            <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                                                <polyline points="14 2 14 8 20 8" />
                                                <path d="m9 15 2 2 4-4" />
                                            </svg>
                                        </div>
                                        <div class="flex flex-col">
                                            <span class="text-lg font-black text-slate-900 tracking-tight leading-none uppercase italic">Soli<span class="text-primary-500">Quiz</span></span>
                                            <span class="text-[8px] font-black text-slate-400 uppercase tracking-[0.2em] mt-1">Espace Formateur</span>
                                        </div>
                                    </a>
                                </div>

                                <!-- Navigation -->
                                <nav class="flex-1 px-3 py-6 space-y-6 overflow-y-auto">
                                    <!-- Category 1 -->
                                    <div>
                                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.3em] mb-4 flex items-center gap-2 italic px-4 leading-none">
                                            Général
                                        </p>
                                        <div class="space-y-1">
                                            <a href="#" class="group flex items-center gap-3.5 px-5 py-3 rounded-xl transition-all duration-200 bg-primary-500 text-white shadow-lg shadow-primary-500/20 italic">
                                                <svg class="size-4.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                                                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 20v-6M6 20V10M18 20V4" />
                                                </svg>
                                                <span class="text-[11px] font-bold uppercase tracking-wider">Supervision</span>
                                            </a>
                                        </div>
                                    </div>

                                    <!-- Category 2 -->
                                    <div>
                                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.3em] mb-4 flex items-center gap-2 italic px-4 leading-none">
                                            Pédagogie
                                        </p>
                                        <div class="space-y-1">
                                            <a href="#" class="group flex items-center gap-3.5 px-5 py-3 rounded-xl transition-all duration-200 text-slate-500 hover:bg-primary-50 hover:text-primary-600 italic">
                                                <svg class="size-4.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                                                    <path stroke-linecap="round" stroke-linejoin="round" d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2 M9 7a4 4 0 1 0 0-8 4 4 0 0 0 0 8z" />
                                                </svg>
                                                <span class="text-[11px] font-bold uppercase tracking-wider">Mes Classes</span>
                                            </a>
                                            <a href="#" class="group flex items-center gap-3.5 px-5 py-3 rounded-xl transition-all duration-200 text-slate-500 hover:bg-primary-50 hover:text-primary-600 italic">
                                                <svg class="size-4.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                                                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
                                                </svg>
                                                <span class="text-[11px] font-bold uppercase tracking-wider">Ingénierie Péd.</span>
                                            </a>
                                        </div>
                                    </div>

                                    <!-- Category 3 -->
                                    <div>
                                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.3em] mb-4 flex items-center gap-2 italic px-4 leading-none">
                                            Contenu
                                        </p>
                                        <div class="space-y-1">
                                            <a href="#" class="group flex items-center gap-3.5 px-5 py-3 rounded-xl transition-all duration-200 text-slate-500 hover:bg-primary-50 hover:text-primary-600 italic">
                                                <svg class="size-4.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                                                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                                                </svg>
                                                <span class="text-[11px] font-bold uppercase tracking-wider">Bibliothèque</span>
                                            </a>
                                        </div>
                                    </div>
                                </nav>

                                <!-- Profile Section -->
                                <div class="p-6 border-t border-slate-50 bg-slate-50/30" x-data="{ userOpen: false }">
                                    <div class="relative">
                                        <button @click="userOpen = !userOpen" type="button"
                                                class="w-full flex items-center justify-between p-2 rounded-2xl hover:bg-white hover:shadow-sm transition-all group active:scale-95 border border-transparent hover:border-slate-100">
                                            <div class="flex items-center gap-3">
                                                <img class="size-9 rounded-xl shadow-sm border border-white"
                                                        src="https://ui-avatars.com/api/?name=Jean+Dupont&background=17B0CF&color=fff&bold=true"
                                                        alt="Avatar">
                                                <div class="flex flex-col text-left min-w-0">
                                                    <span class="text-[11px] font-black text-slate-900 truncate leading-tight uppercase italic">Jean</span>
                                                    <span class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">formateur</span>
                                                </div>
                                            </div>
                                            <svg class="size-4 text-slate-300 group-hover:text-slate-600 transition-transform" :class="userOpen ? 'rotate-180' : ''" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                                                <path d="M19 9l-7 7-7-7" />
                                            </svg>
                                        </button>

                                        <!-- Dropdown -->
                                        <div x-show="userOpen" 
                                             @click.away="userOpen = false"
                                             x-transition:enter="transition ease-out duration-200"
                                             x-transition:enter-start="opacity-0 translate-y-4 scale-95"
                                             x-transition:enter-end="opacity-100 translate-y-0 scale-100"
                                             x-transition:leave="transition ease-in duration-150"
                                             x-transition:leave-start="opacity-100 translate-y-0 scale-100"
                                             x-transition:leave-end="opacity-0 translate-y-4 scale-95"
                                             class="absolute bottom-full left-0 w-full mb-4 bg-white rounded-[2rem] border border-slate-200 shadow-xl p-3 z-50"
                                             x-cloak>
                                            
                                            <a href="#" 
                                                class="flex items-center gap-3 px-5 py-4 rounded-2xl text-slate-600 hover:bg-primary-50 hover:text-primary-600 transition-all text-[11px] font-black uppercase tracking-widest italic group/item">
                                                <div class="size-8 bg-primary-50 text-primary-500 rounded-xl flex items-center justify-center group-hover/item:bg-primary-500 group-hover/item:text-white transition-all shadow-sm">
                                                    <svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                                                </div>
                                                Mon Profil
                                            </a>

                                            <div class="h-px bg-slate-100/50 my-2 mx-4"></div>

                                            <button type="submit" 
                                                    class="w-full flex items-center gap-3 px-5 py-4 rounded-2xl text-rose-500 hover:bg-rose-50 transition-all text-[11px] font-black uppercase tracking-widest italic group/item">
                                                <div class="size-8 bg-rose-50 text-rose-500 rounded-xl flex items-center justify-center group-hover/item:bg-rose-500 group-hover/item:text-white transition-all shadow-sm">
                                                    <svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
                                                </div>
                                                Déconnexion
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </aside>

                    <!-- Main Content Placeholder -->
                    <div class="flex-1 p-8">
                        <div class="h-full bg-white rounded-2xl border border-slate-200 flex items-center justify-center">
                            <p class="text-slate-400">Main Content Area</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
