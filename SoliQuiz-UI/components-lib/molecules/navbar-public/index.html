<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molecule: Navbar Public - SoliQuiz UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        heading: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: 'hsl(190, 85%, 96%)',
                            100: 'hsl(190, 85%, 90%)',
                            200: 'hsl(190, 85%, 80%)',
                            300: 'hsl(190, 80%, 70%)',
                            400: 'hsl(190, 75%, 60%)',
                            500: 'hsl(190, 80%, 45%)',
                            600: 'hsl(190, 85%, 35%)',
                            700: 'hsl(190, 85%, 28%)',
                            800: 'hsl(190, 80%, 22%)',
                            900: 'hsl(190, 75%, 15%)',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../../charte-graphique/app.css">
    <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="bg-slate-50 font-sans">
    <div class="max-w-6xl mx-auto space-y-10 p-10">
        <div class="border-b border-slate-200 pb-4">
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.3em] mb-2">Molecule</p>
            <h1 class="text-3xl font-black text-slate-900">Navbar Public</h1>
            <p class="text-slate-500 mt-2">Barre de navigation publique (landing page)</p>
        </div>

        <section class="space-y-4">
            <h2 class="text-lg font-bold text-slate-900">Navbar Public</h2>
            <div>
                <!-- Navbar Public -->
                <header class="fixed top-0 w-full bg-white/80 backdrop-blur-md z-50 border-b border-slate-100">
                    <nav class="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
                        <!-- Logo -->
                        <a href="#" class="flex items-center gap-2 group outline-none">
                            <div class="size-9 bg-primary-500 rounded-xl flex items-center justify-center shadow-lg shadow-primary-500/20 transition-transform group-hover:scale-110">
                                <svg class="text-white size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                                    <polyline points="14 2 14 8 20 8" />
                                    <path d="m9 15 2 2 4-4" />
                                </svg>
                            </div>
                            <span class="text-2xl font-bold tracking-tight text-slate-900">Soli<span class="text-primary-500">Quiz</span></span>
                        </a>

                        <!-- Nav Links -->
                        <div class="hidden md:flex items-center gap-8">
                            <a href="#features" class="text-sm font-bold text-slate-600 hover:text-primary-500 transition-colors uppercase tracking-widest">Fonctionnalités</a>
                            <a href="#roles" class="text-sm font-bold text-slate-600 hover:text-primary-500 transition-colors uppercase tracking-widest">Utilisation</a>
                            <a href="#" class="py-3 px-6 bg-primary-500 text-white font-bold rounded-xl hover:bg-primary-600 transition-all shadow-lg shadow-primary-500/25 active:scale-95 text-sm uppercase tracking-widest">
                                Se Connecter
                            </a>
                        </div>
                    </nav>
                </header>
            </div>
        </section>
    </div>
</body>
</html>
