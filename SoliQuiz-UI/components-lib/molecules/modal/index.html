<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molecule: Modal - SoliQuiz UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-slate-50 p-10 font-sans" x-data="{ open: false, deleteOpen: false }">
    <div class="max-w-4xl mx-auto space-y-10">
        <div class="border-b border-slate-200 pb-4">
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.3em] mb-2">Molecule</p>
            <h1 class="text-3xl font-black text-slate-900">Modal</h1>
            <p class="text-slate-500 mt-2">Fenêtres modales et dialogs</p>
        </div>

        <section class="space-y-4">
            <h2 class="text-lg font-bold text-slate-900">Modal Preview</h2>
            <div class="p-6 bg-white rounded-2xl border border-slate-200">
                <button @click="open = true" class="px-6 py-3 bg-[#17B0CF] text-white text-[11px] font-black uppercase tracking-widest rounded-2xl hover:bg-[#0284c7] transition-all shadow-lg shadow-[#17B0CF]/20">
                    Ouvrir Modal
                </button>
            </div>

            <!-- Modal -->
            <div x-show="open" class="fixed inset-0 z-[9999] flex items-center justify-center p-4 sm:p-6" style="display: none;">
                <div x-show="open" x-transition:enter="ease-out duration-300" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" x-transition:leave="ease-in duration-200" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" class="fixed inset-0 bg-slate-900/40" @click="open = false"></div>
                <div x-show="open" x-transition:enter="ease-out duration-300" x-transition:enter-start="opacity-0 translate-y-8 sm:translate-y-0 sm:scale-95" x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100" x-transition:leave="ease-in duration-200" x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100" x-transition:leave-end="opacity-0 translate-y-8 sm:translate-y-0 sm:scale-95" class="relative z-10 bg-white rounded-[2rem] shadow-2xl w-full max-w-lg border border-white/40 overflow-hidden">
                    <div class="px-10 pt-10 pb-2 flex items-start justify-between">
                        <div>
                            <p class="text-[10px] font-black text-[#17B0CF] uppercase tracking-[0.3em] mb-1 leading-none italic">Configuration</p>
                            <h3 class="text-2xl font-heading font-black text-slate-900 tracking-tight leading-none uppercase italic">Nouveau QCM</h3>
                        </div>
                        <button @click="open = false" class="group size-12 rounded-2xl bg-slate-50 flex items-center justify-center text-slate-400 hover:bg-rose-50 hover:text-rose-500 transition-all active:scale-90 shadow-sm border border-slate-100">
                            <svg class="size-6 transition-transform" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>
                    </div>
                    <div class="px-10 py-8">
                        <div class="space-y-4">
                            <div>
                                <label class="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em] ml-1 italic">Titre du QCM</label>
                                <input type="text" placeholder="Ex: JavaScript Fondamentaux" class="w-full mt-2 bg-slate-50 border-2 border-transparent rounded-2xl py-3 px-4 text-sm font-bold text-slate-900 focus:bg-white focus:border-[#17B0CF] focus:ring-4 focus:ring-[#17B0CF]/10 outline-none transition-all">
                            </div>
                            <div>
                                <label class="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em] ml-1 italic">Unité d'apprentissage</label>
                                <select class="w-full mt-2 bg-slate-50 border-2 border-transparent rounded-2xl py-3 px-4 text-sm font-bold text-slate-900 focus:bg-white focus:border-[#17B0CF] focus:ring-4 focus:ring-[#17B0CF]/10 outline-none transition-all appearance-none">
                                    <option>Sélectionnez une UA...</option>
                                    <option>UA1 - Web Basics</option>
                                    <option>UA2 - JavaScript</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="px-10 py-8 bg-slate-50/50 border-t border-slate-100 flex justify-end gap-3">
                        <button @click="open = false" class="px-6 py-3 bg-white border-2 border-slate-200 text-slate-700 text-[11px] font-black uppercase tracking-widest rounded-2xl hover:border-[#7dd3fc] transition-all">Annuler</button>
                        <button @click="open = false" class="px-6 py-3 bg-[#17B0CF] text-white text-[11px] font-black uppercase tracking-widest rounded-2xl hover:bg-[#0284c7] transition-all shadow-lg shadow-[#17B0CF]/20">Créer</button>
                    </div>
                </div>
            </div>
        </section>

        <section class="space-y-4">
            <h2 class="text-lg font-bold text-slate-900">Delete Confirmation</h2>
            <div class="p-6 bg-white rounded-2xl border border-slate-200">
                <button @click="deleteOpen = true" class="px-6 py-3 bg-rose-500 text-white text-[11px] font-black uppercase tracking-widest rounded-2xl hover:bg-rose-600 transition-all shadow-lg shadow-rose-500/20">
                    Supprimer
                </button>
            </div>

            <!-- Delete Modal -->
            <div x-show="deleteOpen" class="fixed inset-0 z-[9999] flex items-center justify-center p-4" style="display: none;">
                <div x-show="deleteOpen" x-transition class="fixed inset-0 bg-slate-900/40" @click="deleteOpen = false"></div>
                <div x-show="deleteOpen" x-transition class="relative z-10 bg-white rounded-[2rem] shadow-2xl w-full max-w-md p-8 text-center">
                    <div class="size-16 bg-rose-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
                        <svg class="size-8 text-rose-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                        </svg>
                    </div>
                    <h3 class="text-xl font-black text-slate-900 mb-2">Confirmer la suppression</h3>
                    <p class="text-sm text-slate-500 mb-6">Êtes-vous sûr de vouloir supprimer ce QCM ? Cette action est irréversible.</p>
                    <div class="flex gap-3 justify-center">
                        <button @click="deleteOpen = false" class="px-6 py-3 bg-white border-2 border-slate-200 text-slate-700 text-[11px] font-black uppercase tracking-widest rounded-2xl hover:border-slate-300 transition-all">Annuler</button>
                        <button @click="deleteOpen = false" class="px-6 py-3 bg-rose-500 text-white text-[11px] font-black uppercase tracking-widest rounded-2xl hover:bg-rose-600 transition-all shadow-lg shadow-rose-500/20">Supprimer</button>
                    </div>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
