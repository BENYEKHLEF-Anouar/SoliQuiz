<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molecule: Navbar Apprenant - SoliQuiz UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        primary: {
                            50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd',
                            300: '#7dd3fc', 400: '#38bdf8', 500: '#17B0CF',
                            600: '#0ea5e9', 700: '#0284c7', 800: '#0369a1', 900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="bg-slate-50 font-sans">
    <div class="max-w-6xl mx-auto space-y-10 p-10">
        <div class="border-b border-slate-200 pb-4">
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.3em] mb-2">Molecule</p>
            <h1 class="text-3xl font-black text-slate-900">Navbar Apprenant</h1>
            <p class="text-slate-500 mt-2">Barre de navigation pour l'espace apprenant</p>
        </div>

        <section class="space-y-4">
            <h2 class="text-lg font-bold text-slate-900">Navbar Desktop + Mobile</h2>
            <div class="space-y-4">
                <!-- Navbar -->
                <header class="flex flex-wrap md:justify-start md:flex-nowrap z-50 w-full bg-white border-b border-slate-200 sticky top-0">
                    <nav class="relative max-w-7xl w-full flex flex-wrap md:grid md:grid-cols-12 basis-full items-center px-4 md:px-6 mx-auto py-3" aria-label="Navigation Apprenant">
                        <!-- Logo -->
                        <div class="md:col-span-3">
                            <a class="flex items-center gap-2 group outline-none" href="#" aria-label="SoliQuiz Accueil">
                                <div class="size-8 bg-[#17B0CF] rounded-lg flex items-center justify-center shadow-lg shadow-[#17B0CF]/20 transition-transform group-hover:scale-110">
                                    <svg class="text-white size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                                        <polyline points="14 2 14 8 20 8" />
                                        <path d="m9 15 2 2 4-4" />
                                    </svg>
                                </div>
                                <div class="flex flex-col leading-none">
                                    <span class="text-xl font-bold text-slate-900 tracking-tight">Soli<span class="text-[#17B0CF]">Quiz</span></span>
                                    <span class="text-[10px] font-black text-slate-400 uppercase tracking-[0.3em] ml-0.5">Apprenant</span>
                                </div>
                            </a>
                        </div>

                        <!-- Navbar Center (Menu - Hidden on Mobile) -->
                        <div class="hidden md:flex md:col-span-6 justify-center items-center gap-x-8">
                            <a href="#" class="font-bold text-[#17B0CF] focus:outline-none flex items-center gap-x-2 text-sm" aria-current="page">Dashboard</a>
                            <a href="#" class="font-bold text-slate-500 hover:text-slate-800 transition-colors focus:outline-none flex items-center gap-x-2 text-sm">Bibliothèque</a>
                            <a href="#" class="font-bold text-slate-500 hover:text-slate-800 transition-colors focus:outline-none flex items-center gap-x-2 text-sm">Progression</a>
                        </div>

                        <!-- User Avatar -->
                        <div class="flex items-center gap-x-3 md:gap-x-4 ms-auto md:col-span-3 justify-end relative" x-data="{ userOpen: false }">
                            <button @click="userOpen = !userOpen" type="button" class="flex items-center justify-center size-[38px] rounded-full border border-slate-200 bg-white hover:bg-slate-100 transition-colors">
                                <img class="inline-block size-[32px] rounded-full" src="https://ui-avatars.com/api/?name=Mehdi+B&background=17B0CF&color=fff&bold=true" alt="Avatar">
                            </button>
                            <span class="hidden md:inline-block font-bold text-sm text-slate-800">Mehdi.B</span>

                            <!-- Dropdown -->
                            <div x-show="userOpen" @click.away="userOpen = false" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100" class="absolute right-0 top-full mt-2 w-48 bg-white rounded-xl border border-slate-200 shadow-xl p-2 z-50" x-cloak>
                                <a href="#" class="flex items-center gap-2 px-4 py-2 rounded-lg text-sm text-slate-600 hover:bg-slate-50">Mon Profil</a>
                                <a href="#" class="flex items-center gap-2 px-4 py-2 rounded-lg text-sm text-slate-600 hover:bg-slate-50">Paramètres</a>
                                <hr class="my-2 border-slate-100">
                                <a href="#" class="flex items-center gap-2 px-4 py-2 rounded-lg text-sm text-rose-500 hover:bg-rose-50">Déconnexion</a>
                            </div>
                        </div>
                    </nav>
                </header>

                <!-- Mobile Bottom Nav -->
                <nav class="md:hidden fixed bottom-0 w-full bg-white border-t border-slate-200 z-50">
                    <div class="flex justify-around items-center h-[72px] px-4">
                        <a href="#" class="flex flex-col items-center justify-center text-[#17B0CF] gap-1.5">
                            <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                                <path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                            </svg>
                            <span class="text-[10px] font-bold uppercase tracking-widest">Home</span>
                        </a>
                        <a href="#" class="flex flex-col items-center justify-center text-slate-400 gap-1.5">
                            <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.168.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                            </svg>
                            <span class="text-[10px] font-bold uppercase tracking-widest">Library</span>
                        </a>
                        <a href="#" class="flex flex-col items-center justify-center text-slate-400 gap-1.5">
                            <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                            </svg>
                            <span class="text-[10px] font-bold uppercase tracking-widest">Stats</span>
                        </a>
                        <a href="#" class="flex flex-col items-center justify-center text-slate-400 gap-1.5">
                            <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                            </svg>
                            <span class="text-[10px] font-bold uppercase tracking-widest">Profil</span>
                        </a>
                    </div>
                </nav>
            </div>
        </section>
    </div>
</body>
</html>
