<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molecule: Search Form - SoliQuiz UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 p-10 font-sans">
    <div class="max-w-4xl mx-auto space-y-10">
        <div class="border-b border-slate-200 pb-4">
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.3em] mb-2">Molecule</p>
            <h1 class="text-3xl font-black text-slate-900">Search Form</h1>
            <p class="text-slate-500 mt-2">Barres de recherche et filtres</p>
        </div>

        <section class="space-y-4">
            <h2 class="text-lg font-bold text-slate-900">Search with Filters</h2>
            <div class="p-6 bg-white rounded-2xl border border-slate-200">
                <div class="flex flex-col sm:flex-row gap-3">
                    <div class="relative flex-1">
                        <div class="absolute inset-y-0 left-4 flex items-center text-slate-400">
                            <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                            </svg>
                        </div>
                        <input type="text" placeholder="Rechercher un QCM..." class="w-full bg-slate-50 border border-slate-200 rounded-xl py-3 pl-12 pr-4 text-sm font-bold text-slate-900 focus:bg-white focus:border-[#17B0CF] focus:ring-2 focus:ring-[#17B0CF]/10 outline-none transition-all">
                    </div>
                    <div class="flex gap-2">
                        <select class="bg-slate-50 border border-slate-200 rounded-xl py-3 px-4 pr-10 text-xs font-bold text-slate-700 focus:border-[#17B0CF] outline-none transition-all appearance-none cursor-pointer min-w-[140px]">
                            <option>Tous les statuts</option>
                            <option>Publié</option>
                            <option>Brouillon</option>
                        </select>
                        <select class="bg-slate-50 border border-slate-200 rounded-xl py-3 px-4 pr-10 text-xs font-bold text-slate-700 focus:border-[#17B0CF] outline-none transition-all appearance-none cursor-pointer min-w-[140px]">
                            <option>Toutes les UA</option>
                            <option>UA1 - Web</option>
                            <option>UA2 - JS</option>
                        </select>
                    </div>
                </div>
            </div>
        </section>

        <section class="space-y-4">
            <h2 class="text-lg font-bold text-slate-900">Compact Search</h2>
            <div class="p-6 bg-white rounded-2xl border border-slate-200">
                <div class="relative max-w-sm">
                    <div class="absolute inset-y-0 left-3 flex items-center text-slate-400">
                        <svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                            <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                        </svg>
                    </div>
                    <input type="text" placeholder="Rechercher..." class="w-full bg-slate-100 border-transparent rounded-xl py-2 pl-10 pr-4 text-sm font-bold text-slate-900 focus:bg-white focus:ring-2 focus:ring-[#17B0CF]/20 outline-none transition-all">
                </div>
            </div>
        </section>
    </div>
</body>
</html>
