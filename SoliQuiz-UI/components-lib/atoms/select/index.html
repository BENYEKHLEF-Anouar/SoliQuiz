<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atom: Select - SoliQuiz UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 p-10 font-sans">
    <div class="max-w-4xl mx-auto space-y-10">
        <div class="border-b border-slate-200 pb-4">
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.3em] mb-2">Atom</p>
            <h1 class="text-3xl font-black text-slate-900">Select</h1>
            <p class="text-slate-500 mt-2">Menus déroulants et sélection</p>
        </div>

        <section class="space-y-4">
            <h2 class="text-lg font-bold text-slate-900">Basic Select</h2>
            <div class="p-6 bg-white rounded-2xl border border-slate-200">
                <div class="space-y-2">
                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em] ml-1 italic">Unité d'apprentissage</label>
                    <div class="relative">
                        <select class="w-full bg-slate-50 border-2 border-transparent rounded-2xl py-3 px-4 pr-12 text-sm font-bold text-slate-900 focus:bg-white focus:border-[#17B0CF] focus:ring-4 focus:ring-[#17B0CF]/10 outline-none transition-all appearance-none cursor-pointer">
                            <option value="">Sélectionnez une UA...</option>
                            <option value="1">UA1 - Fondamentaux Web</option>
                            <option value="2">UA2 - JavaScript Avancé</option>
                            <option value="3">UA3 - Frameworks Frontend</option>
                        </select>
                        <div class="absolute inset-y-0 right-4 flex items-center pointer-events-none text-slate-400">
                            <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                                <path d="M19 9l-7 7-7-7" />
                            </svg>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="space-y-4">
            <h2 class="text-lg font-bold text-slate-900">Select with Icon</h2>
            <div class="p-6 bg-white rounded-2xl border border-slate-200">
                <div class="space-y-2">
                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em] ml-1 italic">Classe assignée</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none text-slate-400">
                            <svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                                <path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
                            </svg>
                        </div>
                        <select class="w-full bg-slate-50 border-2 border-transparent rounded-2xl py-3 pl-12 pr-12 text-sm font-bold text-slate-900 focus:bg-white focus:border-[#17B0CF] focus:ring-4 focus:ring-[#17B0CF]/10 outline-none transition-all appearance-none cursor-pointer">
                            <option value="">Choisir une classe...</option>
                            <option value="1">DevWeb-2026-A</option>
                            <option value="2">DevWeb-2026-B</option>
                            <option value="3">Mobile-2026</option>
                        </select>
                        <div class="absolute inset-y-0 right-4 flex items-center pointer-events-none text-slate-400">
                            <svg class="size-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                                <path d="M19 9l-7 7-7-7" />
                            </svg>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="space-y-4">
            <h2 class="text-lg font-bold text-slate-900">Filter Select (Compact)</h2>
            <div class="p-6 bg-white rounded-2xl border border-slate-200">
                <div class="flex gap-3">
                    <div class="relative flex-1">
                        <select class="w-full bg-slate-50 border border-slate-200 rounded-xl py-2.5 px-4 pr-10 text-xs font-bold text-slate-700 focus:bg-white focus:border-[#17B0CF] focus:ring-2 focus:ring-[#17B0CF]/10 outline-none transition-all appearance-none cursor-pointer">
                            <option value="">Tous les statuts</option>
                            <option value="published">Publié</option>
                            <option value="draft">Brouillon</option>
                            <option value="closed">Fermé</option>
                        </select>
                        <div class="absolute inset-y-0 right-3 flex items-center pointer-events-none text-slate-400">
                            <svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                                <path d="M19 9l-7 7-7-7" />
                            </svg>
                        </div>
                    </div>
                    <div class="relative flex-1">
                        <select class="w-full bg-slate-50 border border-slate-200 rounded-xl py-2.5 px-4 pr-10 text-xs font-bold text-slate-700 focus:bg-white focus:border-[#17B0CF] focus:ring-2 focus:ring-[#17B0CF]/10 outline-none transition-all appearance-none cursor-pointer">
                            <option value="">Toutes les UA</option>
                            <option value="1">UA1 - Web</option>
                            <option value="2">UA2 - JS</option>
                            <option value="3">UA3 - Frameworks</option>
                        </select>
                        <div class="absolute inset-y-0 right-3 flex items-center pointer-events-none text-slate-400">
                            <svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                                <path d="M19 9l-7 7-7-7" />
                            </svg>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
