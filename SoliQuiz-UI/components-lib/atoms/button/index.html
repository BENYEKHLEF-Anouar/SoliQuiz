<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atom: Button - SoliQuiz UI</title>
    
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">

    <!-- Tailwind V4 CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        heading: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: 'hsl(190, 85%, 96%)',
                            100: 'hsl(190, 85%, 90%)',
                            200: 'hsl(190, 85%, 80%)',
                            300: 'hsl(190, 80%, 70%)',
                            400: 'hsl(190, 75%, 60%)',
                            500: 'hsl(190, 80%, 45%)',
                            600: 'hsl(190, 85%, 35%)',
                            700: 'hsl(190, 85%, 28%)',
                            800: 'hsl(190, 80%, 22%)',
                            900: 'hsl(190, 75%, 15%)',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../../../charte-graphique/app.css">
</head>
<body class="bg-slate-50 p-10 font-sans uppercase">
    <div class="max-w-4xl mx-auto space-y-16">
        <!-- Header -->
        <div class="border-b border-slate-200 pb-10 italic">
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.4em] mb-4 italic">Fondations Atomiques</p>
            <h1 class="text-5xl font-black text-slate-900 italic tracking-tighter uppercase">Boutons <span class="text-primary-500">Premium</span></h1>
            <p class="text-[11px] font-bold text-slate-400 mt-4 uppercase tracking-widest italic">Unités d'interaction haute fidélité</p>
        </div>

        <!-- Primary Actions -->
        <section class="space-y-8">
            <h2 class="text-[11px] font-black text-slate-400 uppercase tracking-[0.3em] italic">Actions Primaires</h2>
            <div class="p-16 bg-white rounded-[4rem] border border-slate-100 shadow-premium flex flex-wrap gap-10 items-center justify-center italic">
                <!-- Large Primary -->
                <button class="h-16 px-12 bg-primary-500 text-white rounded-[1.5rem] font-black text-[11px] uppercase tracking-[0.2em] hover:bg-primary-600 shadow-3xl shadow-primary-500/30 active:scale-[0.97] transition-all flex items-center gap-4 italic group">
                    <svg class="size-5 group-hover:rotate-90 transition-transform duration-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="4"><path d="M12 4v16m8-8H4"/></svg>
                    Exécuter Processus
                </button>
                
                <!-- Normal Primary -->
                <button class="h-14 px-10 bg-primary-500 text-white rounded-2xl font-black text-[10px] uppercase tracking-widest hover:bg-primary-600 shadow-xl shadow-primary-500/20 transition-all italic">
                    Valider Évaluation
                </button>

                <!-- Small Primary -->
                <button class="h-10 px-6 bg-primary-500 text-white rounded-xl font-black text-[9px] uppercase tracking-widest hover:bg-primary-600 transition-all italic">
                    Édition
                </button>
            </div>
        </section>

        <!-- Functional Variants -->
        <section class="grid grid-cols-1 md:grid-cols-2 gap-10">
            <!-- Dark Variant -->
            <div class="space-y-6 italic">
                <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest italic">Contrôle Structurel</h3>
                <div class="p-12 bg-slate-900 rounded-[3rem] border border-white/5 flex items-center justify-center">
                    <button class="h-14 px-10 bg-white/10 backdrop-blur text-white border border-white/10 rounded-2xl font-black text-[10px] uppercase tracking-widest hover:bg-white hover:text-slate-900 transition-all italic">
                        Archiver Segment
                    </button>
                </div>
            </div>

            <!-- Danger Variant -->
            <div class="space-y-6 italic">
                <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest italic">État Critique</h3>
                <div class="p-12 bg-white rounded-[3rem] border border-slate-100 shadow-sm flex items-center justify-center">
                    <button class="h-14 px-10 bg-rose-50 text-rose-500 border border-rose-100 rounded-2xl font-black text-[10px] uppercase tracking-widest hover:bg-rose-500 hover:text-white transition-all italic">
                        Suppression Définitive
                    </button>
                </div>
            </div>
        </section>

        <!-- Construction Tokens -->
        <section class="space-y-8">
            <h2 class="text-[11px] font-black text-slate-400 uppercase tracking-[0.3em] italic">Spécifications Interaction</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-6 italic">
                <div class="p-6 bg-slate-50 rounded-2xl border border-slate-100 text-center">
                    <p class="text-[9px] font-black text-slate-400 uppercase mb-2">Hover</p>
                    <p class="text-xs font-black text-slate-900">Scale 102% / Shadow++</p>
                </div>
                <div class="p-6 bg-slate-50 rounded-2xl border border-slate-100 text-center">
                    <p class="text-[9px] font-black text-slate-400 uppercase mb-2">Active</p>
                    <p class="text-xs font-black text-slate-900">Scale 97%</p>
                </div>
                <div class="p-6 bg-slate-50 rounded-2xl border border-slate-100 text-center">
                    <p class="text-[9px] font-black text-slate-400 uppercase mb-2">Shadow</p>
                    <p class="text-xs font-black text-primary-500">3xl Primary (30%)</p>
                </div>
                <div class="p-6 bg-slate-50 rounded-2xl border border-slate-100 text-center">
                    <p class="text-[9px] font-black text-slate-400 uppercase mb-2">Transition</p>
                    <p class="text-xs font-black text-slate-900">300ms Cubic-Bezier</p>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
