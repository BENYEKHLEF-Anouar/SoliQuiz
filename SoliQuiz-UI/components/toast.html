<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toast Component - SoliQuiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], heading: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: { primary: { 50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 300: '#7dd3fc', 400: '#38bdf8', 500: '#17B0CF', 600: '#0ea5e9', 700: '#0284c7', 800: '#0369a1', 900: '#0c4a6e' } }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 p-10 min-h-screen">
    <div x-data="{
        messages: [],
        remove(id) { this.messages = this.messages.filter(m => m.id !== id) },
        add(message, type = 'success') {
            const id = Date.now()
            this.messages.push({ id, message, type })
            setTimeout(() => this.remove(id), 5000)
        }
    }" x-on:toast.window="add($event.detail.message, $event.detail.type)" class="fixed bottom-10 right-10 z-[200] flex flex-col gap-4 pointer-events-none">
        
        <p class="text-sm font-bold text-slate-600 mb-2">Click to test:</p>
        
        <button @click="add('Opération réussie!', 'success')" class="px-4 py-2 bg-emerald-500 text-white rounded-lg font-bold">Test Success</button>
        <button @click="add('Une erreur est survenue', 'error')" class="px-4 py-2 bg-red-500 text-white rounded-lg font-bold">Test Error</button>
        <button @click="add('Information importante', 'info')" class="px-4 py-2 bg-sky-500 text-white rounded-lg font-bold">Test Info</button>

        <template x-for="msg in messages" :key="msg.id">
            <div x-show="true" x-transition:enter="ease-out duration-300" x-transition:enter-start="opacity-0 translate-x-12 scale-90" x-transition:enter-end="opacity-100 translate-x-0 scale-100" x-transition:leave="ease-in duration-200" x-transition:leave-start="opacity-100 translate-x-0 scale-100" x-transition:leave-end="opacity-0 translate-x-12 scale-90" class="pointer-events-auto min-w-[340px] max-w-md p-5 rounded-[2rem] shadow-lg bg-white/80 backdrop-blur-xl border border-white/40 flex items-center gap-5">
                <div class="flex-shrink-0 size-14 rounded-2xl flex items-center justify-center shadow-lg relative overflow-hidden" :class="{'bg-emerald-50 text-emerald-500 shadow-emerald-500/10': msg.type === 'success', 'bg-rose-50 text-rose-500 shadow-rose-500/10': msg.type === 'error', 'bg-sky-50 text-sky-500 shadow-sky-500/10': msg.type === 'info'}">
                    <div class="absolute inset-0 border-2 border-white opacity-40 rounded-2xl"></div>
                    <svg x-show="msg.type === 'success'" class="size-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
                    <svg x-show="msg.type === 'error'" class="size-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
                    <svg x-show="msg.type === 'info'" class="size-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <div class="flex-grow">
                    <p class="text-[8px] font-black uppercase tracking-[0.4em] mb-1 italic opacity-40" :class="{'text-emerald-600': msg.type === 'success', 'text-rose-600': msg.type === 'error', 'text-sky-600': msg.type === 'info'}" x-text="msg.type === 'success' ? 'Confirmation' : (msg.type === 'error' ? 'Anomalie' : 'Notification')"></p>
                    <p class="text-xs font-black text-slate-900 uppercase italic leading-tight" x-text="msg.message"></p>
                </div>
                <button @click="remove(msg.id)" class="size-8 rounded-xl hover:bg-slate-50 flex items-center justify-center text-slate-300 hover:text-slate-900 transition-all">
                    <svg class="size-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
        </template>
    </div>
</body>
</html>
