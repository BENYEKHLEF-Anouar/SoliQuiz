<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Modal Component - SoliQuiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'], heading: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: { primary: { 50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 300: '#7dd3fc', 400: '#38bdf8', 500: '#17B0CF', 600: '#0ea5e9', 700: '#0284c7', 800: '#0369a1', 900: '#0c4a6e' } }
                }
            }
        }
    </script>
    <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="bg-slate-100 p-10 min-h-screen">
    <div x-data="{
        show: false,
        title: '',
        message: '',
        confirmAction: null,
        cancelText: 'Annuler',
        confirmText: 'Confirmer',
        type: 'danger',
        open(detail) {
            this.title = detail.title || 'Confirmation';
            this.message = detail.message || 'Êtes-vous sûr de vouloir continuer ?';
            this.confirmText = detail.confirmText || 'Confirmer';
            this.cancelText = detail.cancelText || 'Annuler';
            this.type = detail.type || 'danger';
            this.confirmAction = detail.onConfirm;
            this.show = true;
        },
        confirm() {
            if (this.confirmAction) this.confirmAction();
            this.show = false;
        }
    }" x-on:confirm.window="open($event.detail)" x-show="show" class="fixed inset-0 z-[10000] flex items-center justify-center p-4" x-cloak>
        
        <div x-show="show" class="fixed inset-0" @click="show = false">
            <div class="absolute inset-0 bg-slate-900/40"></div>
        </div>

        <div x-show="show" class="relative z-10 bg-white rounded-[2.5rem] shadow-[0_25px_60px_rgba(0,0,0,0.12)] w-full max-w-lg border border-slate-100 overflow-hidden">
            <div class="flex p-10 gap-8">
                <div class="flex-shrink-0">
                    <div class="size-16 rounded-[1.5rem] flex items-center justify-center transition-colors duration-500 shadow-sm" :class="type === 'danger' ? 'bg-rose-50 text-rose-500' : 'bg-amber-50 text-amber-500'">
                        <svg class="size-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M7 7h10"/></svg>
                    </div>
                </div>
                <div class="flex-1">
                    <h3 class="text-2xl font-heading font-black text-slate-900 mb-3" x-text="title"></h3>
                    <p class="text-sm text-slate-500 font-medium leading-relaxed" x-text="message"></p>
                </div>
            </div>
            <div class="bg-slate-50 p-6 border-t border-slate-100 flex justify-end gap-4">
                <button @click="show = false" class="px-6 py-3 border border-slate-200 text-slate-600 rounded-2xl font-bold hover:bg-slate-100 transition-all" x-text="cancelText"></button>
                <button @click="confirm()" class="px-6 py-3 rounded-2xl font-bold transition-all" :class="type === 'danger' ? 'bg-rose-500 text-white hover:bg-rose-600' : 'bg-amber-500 text-white hover:bg-amber-600'" x-text="confirmText"></button>
            </div>
        </div>
    </div>

    <div class="space-y-4">
        <p class="text-sm font-bold text-slate-600 mb-2">Click to test:</p>
        <button @click="$dispatch('confirm', { title: 'Supprimer le QCM?', message: 'Cette action est irréversible.', onConfirm: () => alert('Confirmed!') })" class="px-4 py-2 bg-red-500 text-white rounded-lg font-bold">Test Danger Modal</button>
        <button @click="$dispatch('confirm', { title: 'Publier le QCM?', message: 'Êtes-vous prêt à publier?', type: 'warning', onConfirm: () => alert('Confirmed!') })" class="px-4 py-2 bg-amber-500 text-white rounded-lg font-bold">Test Warning Modal</button>
    </div>
</body>
</html>
